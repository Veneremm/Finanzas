<script>
  // Silenciar el aviso de "in-browser Babel transformer" (es solo informativo)
  (function(){
    var _w = console.warn;
    console.warn = function(){
      var m = arguments[0];
      if (typeof m === 'string' && m.indexOf('in-browser Babel transformer') !== -1) return;
      return _w.apply(console, arguments);
    };
  })();
</script>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.4/babel.min.js"></script>
<style>
  :root {
    --paper: #eef0f7;
    --surface: #ffffff;
    --surface2: #f4f5fb;
    --ink: #0d1230;
    --ink2: #586084;
    --ink3: #98a0be;
    --line: rgba(13,18,48,.08);
    --line2: rgba(13,18,48,.15);
    --brand: #2a3cff;
    --brand2: #1a25c4;
    --brand-soft: rgba(42,60,255,.09);
    --marigold: #ffb703;
    --ok: #0f9d6e;
    --ok-soft: rgba(15,157,110,.12);
    --warn: #d97a00;
    --warn-soft: rgba(229,138,0,.14);
    --bad: #e5304f;
    --bad-soft: rgba(229,48,79,.11);
    --glass: rgba(255,255,255,.80);
    --radius: 22px;
    --radius-sm: 12px;
    --shadow: 0 1px 0 rgba(13,18,48,.03), 0 14px 34px -22px rgba(13,18,48,.32);
    --ease-out: cubic-bezier(.23,1,.32,1);
    --ease-in-out: cubic-bezier(.77,0,.175,1);
    --ease-drawer: cubic-bezier(.32,.72,0,1);
    --nav-h: 84px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --font-ui: -apple-system, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
    --font-num: ui-rounded, "SF Pro Rounded", "Avenir Next Rounded", -apple-system, system-ui, sans-serif;
    /* nombres anteriores, para que los formularios heredados sigan bien */
    --bg: var(--paper); --card: var(--surface); --text: var(--ink); --text2: var(--ink2); --text3: var(--ink3);
    --sep: var(--line); --blue: var(--brand); --blue-mid: var(--brand); --green: var(--ok); --red: var(--bad); --orange: var(--warn);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --paper: #090c1b;
    --surface: #131833;
    --surface2: #1b2145;
    --ink: #eef0ff;
    --ink2: #a3abd0;
    --ink3: #646c96;
    --line: rgba(255,255,255,.075);
    --line2: rgba(255,255,255,.14);
    --brand: #7482ff;
    --brand2: #5663ff;
    --brand-soft: rgba(116,130,255,.17);
    --ok: #3ddba4;
    --ok-soft: rgba(61,219,164,.14);
    --warn: #ffb347;
    --warn-soft: rgba(255,179,71,.15);
    --bad: #ff6b85;
    --bad-soft: rgba(255,107,133,.14);
    --glass: rgba(19,24,51,.82);
    --shadow: 0 0 0 1px rgba(255,255,255,.04), 0 18px 40px -24px rgba(0,0,0,.7);
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  * { scrollbar-width: none; -ms-overflow-style: none; }
  *::-webkit-scrollbar { width: 0; height: 0; display: none; }
  html, body, #root { height: 100%; overflow: hidden; }
  body { font-family: var(--font-ui); background: var(--paper); color: var(--ink); overscroll-behavior: none; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
  button { font-family: inherit; color: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; color: inherit; }
  .num { font-family: var(--font-num); letter-spacing: -.02em; }
  #root { display: flex; flex-direction: column; position: relative; }

  /* ── Estructura ── */
  .app-root { display: flex; flex-direction: column; height: 100%; width: 100%; max-width: 480px; margin: 0 auto; position: relative; }
  .app-stack { position: relative; flex: 1; overflow: hidden; }
  .screen-view { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; padding-bottom: calc(var(--nav-h) + var(--safe-bottom) + 30px);
    transition: transform .38s var(--ease-drawer), opacity .3s var(--ease-out); will-change: transform; }
  .screen-view.slide-in { transform: translateX(0); opacity: 1; }
  .screen-view.slide-out { transform: translateX(-22%); opacity: 0; pointer-events: none; }
  .screen-view.slide-right { transform: translateX(100%); opacity: 0; pointer-events: none; }
  .page { padding: 0 16px; }
  .side { display: none; }
  .view-toggle { position: fixed; top: 10px; right: 12px; z-index: 45; background: var(--glass); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border: 1px solid var(--line); border-radius: 20px; padding: 6px 13px; font-size: 12px; font-weight: 600; color: var(--ink); transition: transform .16s var(--ease-out); }
  .view-toggle:active { transform: scale(.96); }

  /* ── Navegación flotante ── */
  .dock { position: fixed; bottom: calc(14px + var(--safe-bottom)); left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; padding: 0 16px;
    display: flex; align-items: center; justify-content: center; gap: 10px; z-index: 50; pointer-events: none; }
  .dock > * { pointer-events: auto; }
  .dock-pill { display: flex; gap: 4px; padding: 5px; border-radius: 999px; background: var(--glass); border: 1px solid var(--line);
    -webkit-backdrop-filter: blur(22px) saturate(170%); backdrop-filter: blur(22px) saturate(170%); box-shadow: 0 16px 36px -14px rgba(13,18,48,.35); }
  .dock-btn { display: flex; align-items: center; gap: 0; height: 46px; min-width: 46px; padding: 0 12px; border-radius: 999px; border: none; background: none; color: var(--ink2); font-size: 14px; font-weight: 650;
    transition: background .22s var(--ease-out), color .22s var(--ease-out), transform .14s var(--ease-out); }
  .dock-btn:active { transform: scale(.95); }
  .dock-btn svg { width: 22px; height: 22px; flex-shrink: 0; }
  .dock-btn span { max-width: 0; overflow: hidden; white-space: nowrap; opacity: 0; transition: max-width .28s var(--ease-out), opacity .2s, margin .28s var(--ease-out); }
  .dock-btn.on { background: var(--ink); color: var(--surface); padding: 0 16px 0 13px; }
  .dock-btn.on span { max-width: 90px; opacity: 1; margin-left: 8px; }
  .dock-add { width: 56px; height: 56px; border-radius: 50%; border: none; background: linear-gradient(145deg, #4a5bff, var(--brand2)); color: #fff; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 16px 30px -10px rgba(42,60,255,.7), inset 0 1px 0 rgba(255,255,255,.28); transition: transform .16s var(--ease-out); flex-shrink: 0; }
  .dock-add:active { transform: scale(.93); }
  .dock-add svg { width: 26px; height: 26px; }

  /* ── Encabezados de página ── */
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; padding: 58px 20px 14px; }
  .page-head h1 { font-family: var(--font-num); font-size: 32px; font-weight: 800; letter-spacing: -.04em; line-height: 1; }
  .page-head p { font-size: 13.5px; color: var(--ink2); margin-top: 6px; }
  .round-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--brand); display: flex; align-items: center; justify-content: center; transition: transform .14s var(--ease-out); }
  .round-btn:active { transform: scale(.92); }
  .round-btn svg { width: 20px; height: 20px; }
  .h2 { font-family: var(--font-num); font-size: 18px; font-weight: 750; letter-spacing: -.03em; margin: 28px 4px 12px; display: flex; align-items: baseline; justify-content: space-between; }
  .h2 small { font-family: var(--font-ui); font-size: 13px; font-weight: 500; color: var(--ink2); letter-spacing: 0; }
  .empty { text-align: center; padding: 34px 20px; color: var(--ink2); font-size: 14.5px; line-height: 1.45; }
  .empty .icon { font-size: 38px; margin-bottom: 8px; }
  .empty b { display: block; color: var(--ink); font-size: 16px; margin-bottom: 3px; }

  /* ── Inicio: la ruta ── */
  .route { position: relative; overflow: hidden; color: #fff; padding: 62px 22px 20px; border-radius: 0 0 38px 38px;
    background: radial-gradient(90% 70% at 100% 0%, rgba(120,140,255,.55), rgba(120,140,255,0) 60%), linear-gradient(165deg, #3047ff 0%, #1f2ee0 45%, #131b9e 100%); }
  .route::before { content: ''; position: absolute; width: 260px; height: 260px; border-radius: 50%; left: -90px; bottom: -150px; background: radial-gradient(circle, rgba(255,183,3,.22), rgba(255,183,3,0) 65%); pointer-events: none; }
  .route-brand { display: flex; align-items: center; gap: 9px; font-family: var(--font-num); font-weight: 800; font-size: 16px; letter-spacing: -.02em; margin-bottom: 26px; }
  .route-brand i { width: 28px; height: 28px; border-radius: 9px; background: rgba(255,255,255,.18); display: flex; align-items: center; justify-content: center; box-shadow: inset 0 1px 0 rgba(255,255,255,.3); }
  .route-brand svg { width: 18px; height: 18px; }
  .route-lead { font-size: 15px; color: rgba(255,255,255,.74); }
  .route-amt { font-family: var(--font-num); font-size: 52px; font-weight: 800; letter-spacing: -.05em; line-height: 1.04; margin-top: 2px; }
  .route-amt small { font-size: 26px; font-weight: 700; opacity: .7; letter-spacing: -.02em; }
  .route-paid { margin-top: 10px; display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; color: rgba(255,255,255,.8); }
  .route-paid i { display: block; width: 86px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.2); overflow: hidden; }
  .route-paid i b { display: block; height: 100%; border-radius: 3px; background: var(--marigold); transition: width .8s var(--ease-out); }
  .route-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-top: 18px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.16); }
  .route-head b { font-family: var(--font-num); font-size: 15px; font-weight: 800; letter-spacing: -.02em; }
  .route-head span { font-size: 11.5px; color: rgba(255,255,255,.6); font-weight: 600; }
  .route-card .route-head { border-top: none; margin-top: 0; padding-top: 0; } .route-card .route-head span { color: var(--ink3); }
  .route-chart { margin: 6px -6px 0; }
  .route-chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .route-cap { margin: 2px 4px 0; min-height: 22px; font-size: 14.5px; color: rgba(255,255,255,.78); }
  .route-cap b { color: #fff; font-weight: 700; }
  .rt-line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: rtDraw 1s var(--ease-out) .1s forwards; }
  .rt-area { opacity: 0; animation: rtFade .7s var(--ease-out) .5s forwards; }
  .rt-static .rt-line { animation: none; stroke-dashoffset: 0; }
  .rt-static .rt-area { animation: none; opacity: 1; }
  @keyframes rtDraw { to { stroke-dashoffset: 0; } }
  @keyframes rtFade { to { opacity: 1; } }
  .home-body { padding: 0 16px; }
  .month { background: var(--surface); border-radius: 28px; box-shadow: var(--shadow); padding: 20px 20px 18px; margin-top: 18px; }
  .month-cols { display: flex; gap: 16px; align-items: flex-start; }
  .month-cols > div { flex: 1; min-width: 0; }
  .month-cols > div + div { text-align: right; }
  .k { font-size: 13.5px; color: var(--ink2); }
  .v { font-family: var(--font-num); font-size: 28px; font-weight: 800; letter-spacing: -.04em; line-height: 1.1; margin-top: 3px; }
  .v-btn { background: none; border: none; text-align: right; width: 100%; padding: 0; display: block; }
  .v-btn .k { display: inline-flex; align-items: center; gap: 5px; }
  .v-btn .k svg { width: 13px; height: 13px; }
  .v.link { color: var(--brand); font-size: 20px; margin-top: 8px; }
  .s { font-size: 13px; color: var(--ink2); margin-top: 3px; }
  .meter { height: 10px; border-radius: 6px; background: var(--surface2); margin-top: 18px; overflow: hidden; }
  .meter i { display: block; height: 100%; border-radius: 6px; background: var(--ok); transition: width .7s var(--ease-out); }
  .meter.short i { background: var(--warn); }
  .meter-cap { font-size: 13.5px; margin-top: 8px; font-weight: 600; color: var(--ok); }
  .meter-cap.short { color: var(--warn); }
  .tickets { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -16px; padding: 2px 16px 6px; }
  .ticket { flex: 0 0 158px; scroll-snap-align: start; background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); padding: 14px 14px 13px; position: relative; overflow: hidden; }
  .ticket::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 5px; background: var(--tk, var(--brand)); }
  .tk-date { display: flex; align-items: baseline; gap: 5px; margin-top: 4px; }
  .tk-date b { font-family: var(--font-num); font-size: 30px; font-weight: 800; letter-spacing: -.04em; line-height: 1; }
  .tk-date span { font-size: 13px; color: var(--ink2); font-weight: 600; text-transform: lowercase; }
  .tk-name { font-size: 14.5px; font-weight: 600; margin-top: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tk-amt { font-family: var(--font-num); font-size: 17px; font-weight: 750; letter-spacing: -.03em; margin-top: 2px; }
  .tk-chip { display: inline-block; margin-top: 10px; padding: 3px 9px; border-radius: 20px; font-size: 12px; font-weight: 650; background: var(--surface2); color: var(--ink2); }
  .tk-chip.warn { background: var(--warn-soft); color: var(--warn); }
  .tk-chip.bad { background: var(--bad-soft); color: var(--bad); }
  .none-row { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); padding: 18px; color: var(--ink2); font-size: 14.5px; }
  .wallet { background: var(--surface); border-radius: 24px; box-shadow: var(--shadow); overflow: hidden; }
  .w-row { display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px 16px; border: none; background: none; text-align: left; position: relative; transition: background .15s; }
  .w-row + .w-row::before { content: ''; position: absolute; left: 70px; right: 16px; top: 0; height: 1px; background: var(--line); }
  .w-row:active { background: var(--surface2); }
  .w-chip { width: 42px; height: 28px; border-radius: 7px; flex-shrink: 0; box-shadow: inset 0 1px 0 rgba(255,255,255,.28), 0 4px 10px -4px rgba(13,18,48,.35); }
  .w-main { flex: 1; min-width: 0; }
  .w-name { font-size: 15.5px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .w-use { height: 4px; border-radius: 2px; background: var(--surface2); margin-top: 7px; overflow: hidden; }
  .w-use i { display: block; height: 100%; border-radius: 2px; background: var(--brand); }
  .w-amt { text-align: right; }
  .w-amt b { font-family: var(--font-num); font-size: 16.5px; font-weight: 750; letter-spacing: -.03em; display: block; }
  .w-amt span { font-size: 12px; color: var(--ink2); }
  .donut-card { background: var(--surface); border-radius: 24px; box-shadow: var(--shadow); padding: 18px; }
  .donut-row { display: flex; align-items: center; gap: 18px; }
  .donut-wrap { position: relative; flex-shrink: 0; }
  .donut-c { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .donut-c b { font-family: var(--font-num); font-size: 15px; font-weight: 800; letter-spacing: -.03em; }
  .donut-c span { font-size: 11px; color: var(--ink2); }
  .legend { flex: 1; min-width: 0; }
  .lg-row { display: flex; align-items: center; gap: 9px; width: 100%; padding: 7px 0; border: none; background: none; text-align: left; transition: opacity .15s; }
  .lg-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
  .lg-name { flex: 1; min-width: 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lg-pct { font-size: 13px; font-weight: 650; color: var(--ink2); }
  .lg-detail { margin-top: 12px; padding-top: 6px; border-top: 1px solid var(--line); }
  .lg-detail > div { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; font-size: 14px; }
  .lg-detail > div span:first-child { color: var(--ink2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lg-detail > div span:last-child { font-weight: 650; }
  .settings { background: var(--surface); border-radius: 24px; box-shadow: var(--shadow); padding: 16px; }
  .settings + .settings { margin-top: 12px; }
  .set-t { font-size: 15px; font-weight: 650; }
  .set-s { font-size: 12.5px; color: var(--ink2); margin-top: 3px; line-height: 1.4; }
  .btn-row { display: flex; gap: 10px; margin-top: 14px; }
  .ghost { flex: 1; height: 46px; border-radius: 14px; border: 1px solid var(--line2); background: none; font-size: 15px; font-weight: 650; transition: transform .14s var(--ease-out); }
  .ghost:active { transform: scale(.97); }
  .ghost.fill { background: var(--ink); color: var(--surface); border-color: transparent; }
  .seg { display: flex; background: var(--surface2); border-radius: 14px; padding: 3px; }
  .seg button { flex: 1; border: none; background: none; padding: 9px 0; border-radius: 11px; font-size: 13.5px; font-weight: 650; color: var(--ink2); transition: background .2s var(--ease-out), color .2s; }
  .seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 4px rgba(13,18,48,.14); }
  :root[data-theme="dark"] .seg button.on { background: var(--brand-soft); color: var(--ink); box-shadow: none; }

  /* ── Tarjetas (diseño original) ── */
  .card-flat { margin: 0 16px 10px; border-radius: 16px; padding: 13px 16px 13px; color: #fff; cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.08); animation: fadeUp .3s ease both; transition: transform .12s ease, filter .12s ease; user-select: none; -webkit-user-select: none; }
  .card-flat:active { transform: scale(.985); filter: brightness(.96); }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .cc-header { border-radius: 16px 16px 0 0; padding: 15px 16px 13px; color: #fff; position: relative; overflow: hidden; }
  .cc-name { font-size: 15px; font-weight: 700; }
  .cc-chips { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
  .cc-chip { font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 20px; background: rgba(255,255,255,.2); }
  .cc-amount { font-size: 27px; font-weight: 700; margin-top: 9px; letter-spacing: -.8px; }
  .cc-amount-label { font-size: 11px; opacity: .7; margin-top: 1px; }
  .grad-yellow  { background: linear-gradient(145deg, #e8b332, #cf9a1e); }
  .grad-red     { background: linear-gradient(145deg, #e53935, #c1272d); }
  .grad-blue    { background: linear-gradient(145deg, #1f82dd, #1257a0); }
  .grad-skyblue { background: linear-gradient(145deg, #039be5, #0379b0); }
  .grad-purple  { background: linear-gradient(145deg, #ab47bc, #8b3a9c); }
  .grad-orange  { background: linear-gradient(145deg, #f4511e, #cc3f12); }
  .grad-green   { background: linear-gradient(145deg, #3a9540, #29702d); }
  .grad-black    { background: linear-gradient(145deg, #3a3a3f, #141417); }
  .grad-graphite { background: linear-gradient(145deg, #5b6573, #313842); }
  .grad-teal     { background: linear-gradient(145deg, #16b9a6, #0c7a6e); }
  .grad-pink     { background: linear-gradient(145deg, #ec4899, #b81d6e); }
  .grad-indigo   { background: linear-gradient(145deg, #4254c5, #28307e); }
  .grad-gold     { background: linear-gradient(145deg, #caa14e, #93702a); }
  .grad-wine     { background: linear-gradient(145deg, #9b2742, #5f1628); }

  /* ── Detalle de tarjeta ── */
  .detail-top { display: flex; align-items: center; justify-content: space-between; padding: 52px 16px 12px; }
  .pill-link { display: flex; align-items: center; gap: 4px; height: 38px; padding: 0 14px 0 8px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 14.5px; font-weight: 650; transition: transform .14s var(--ease-out); }
  .pill-link:active { transform: scale(.96); }
  .pill-link svg { width: 18px; height: 18px; }
  .pill-link.solo { padding: 0 16px; }
  .banner-wrap { margin: 0 16px 12px; }
  .banner-wrap .cc-header { border-radius: 24px; padding: 20px 20px 18px; box-shadow: 0 18px 34px -20px rgba(13,18,48,.5); }
  .banner-wrap .cc-name { font-size: 16px; }
  .banner-wrap .cc-chip { font-size: 11px; padding: 3px 9px; }
  .banner-wrap .cc-amount { font-size: 38px; margin-top: 14px; font-family: var(--font-num); font-weight: 800; letter-spacing: -.045em; }
  .banner-wrap .cc-amount-label { font-size: 13px; opacity: .78; }

  /* ── Hojas de captura ── */

  /* ── Tarjeta física ── */
  .stack { padding: 0 16px 20px; }
  .pcard { position: relative; height: 196px; border-radius: 28px; padding: 18px 20px; color: #fff; overflow: hidden; cursor: pointer; user-select: none; -webkit-user-select: none;
    box-shadow: 0 -10px 24px -14px rgba(0,0,0,.4), 0 22px 36px -24px rgba(0,0,0,.55); display: flex; flex-direction: column; transition: transform .2s var(--ease-out); }
  .pcard::before { content: ''; position: absolute; inset: 0; background: radial-gradient(110% 80% at 100% 0%, rgba(255,255,255,.3), rgba(255,255,255,0) 55%); pointer-events: none; }
  .pcard::after { content: ''; position: absolute; right: -70px; bottom: -110px; width: 250px; height: 250px; border-radius: 50%; border: 36px solid rgba(255,255,255,.09); pointer-events: none; }
  .pcard:active { transform: scale(.985); }
  .stack .pcard + .pcard { margin-top: -130px; }
  .pc-top { position: relative; z-index: 1; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .pc-name { font-family: var(--font-num); font-size: 19px; font-weight: 800; letter-spacing: -.03em; line-height: 1.15; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pc-month { text-align: right; flex-shrink: 0; line-height: 1.1; }
  .pc-month b { font-family: var(--font-num); font-size: 19px; font-weight: 800; letter-spacing: -.03em; display: block; }
  .pc-month span { font-size: 11.5px; opacity: .78; }
  .pc-body { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; }
  .pc-chip { position: absolute; left: 0; top: 6px; width: 40px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, rgba(255,255,255,.8), rgba(255,255,255,.3)); box-shadow: inset 0 0 0 1px rgba(255,255,255,.4); }
  .pc-debt span { display: block; font-size: 12px; opacity: .78; }
  .pc-debt b { font-family: var(--font-num); font-size: 30px; font-weight: 800; letter-spacing: -.045em; line-height: 1.05; }
  .pc-foot { display: flex; align-items: center; gap: 7px; }
  .pc-pill { font-size: 11.5px; font-weight: 650; padding: 3px 9px; border-radius: 999px; background: rgba(255,255,255,.2); white-space: nowrap; }
  .pc-use { flex: 1; height: 5px; border-radius: 3px; background: rgba(255,255,255,.25); overflow: hidden; min-width: 20px; }
  .pc-use i { display: block; height: 100%; border-radius: 3px; background: #fff; }
  .pc-pct { font-size: 11.5px; font-weight: 700; opacity: .9; }
  .pcard.full { cursor: default; height: 210px; }
  .pcard.full:active { transform: none; }
  .banner-wrap { margin: 0 16px 12px; }
  .app-root.as-pc .stack { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; padding: 0; }
  .app-root.as-pc .stack .pcard + .pcard { margin-top: 0; }

  /* ── Línea del ciclo ── */
  .cyc { padding: 4px 2px 0; }
  .cyc-track { position: relative; height: 10px; border-radius: 6px; background: var(--surface2); margin: 26px 8px 32px; }
  .cyc-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: var(--brand-soft); border: 1px solid transparent; }
  .cyc-now { position: absolute; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; background: var(--marigold); box-shadow: 0 0 0 4px var(--surface), 0 4px 10px -2px rgba(0,0,0,.3); }
  .cyc-mk { position: absolute; top: -4px; width: 4px; height: 18px; margin-left: -2px; border-radius: 2px; }
  .cyc-mk.cut { background: var(--ink); } .cyc-mk.pay { background: var(--brand); }
  .cyc-mk em { position: absolute; left: 50%; font-style: normal; font-size: 12px; font-weight: 700; white-space: nowrap; transform: translateX(-50%); }
  .cyc-mk.cut em { bottom: 22px; color: var(--ink); } .cyc-mk.pay em { top: 22px; color: var(--brand); }
  .cyc-info { display: flex; gap: 12px; }
  .cyc-info > div { flex: 1; background: var(--surface2); border-radius: 14px; padding: 10px 12px; font-size: 12.5px; color: var(--ink2); }
  .cyc-info span { display: block; font-family: var(--font-num); font-size: 17px; font-weight: 800; letter-spacing: -.03em; }

  /* ── Pestañas y listas del detalle ── */
  .utabs { position: sticky; top: 0; z-index: 10; display: flex; gap: 4px; padding: 10px 16px 0; background: var(--glass); -webkit-backdrop-filter: blur(18px) saturate(170%); backdrop-filter: blur(18px) saturate(170%); box-shadow: 0 1px 0 var(--line); }
  .utabs button { flex: 1; position: relative; border: none; background: none; padding: 10px 2px 12px; font-size: 14px; font-weight: 650; color: var(--ink3); white-space: nowrap; transition: color .2s; }
  .utabs button em { font-style: normal; font-size: 11px; font-weight: 700; margin-left: 5px; padding: 1px 6px; border-radius: 10px; background: var(--surface2); color: var(--ink2); }
  .utabs button::after { content: ''; position: absolute; left: 12%; right: 12%; bottom: 0; height: 3px; border-radius: 3px 3px 0 0; background: var(--brand); transform: scaleX(0); transition: transform .25s var(--ease-out); }
  .utabs button.on { color: var(--ink); } .utabs button.on::after { transform: scaleX(1); }
  .add-row { display: flex; align-items: center; justify-content: center; gap: 8px; width: calc(100% - 32px); margin: 0 16px 6px; height: 48px; border-radius: 16px; border: 2px dashed var(--line2); background: none; color: var(--brand); font-size: 15px; font-weight: 700; transition: transform .14s var(--ease-out), background .15s; }
  .add-row:active { transform: scale(.98); background: var(--brand-soft); }
  .add-row svg { width: 18px; height: 18px; }
  .stackbar { margin: 14px 16px 2px; }
  .sb-bar { display: flex; height: 12px; border-radius: 7px; overflow: hidden; gap: 3px; background: none; }
  .sb-bar i { display: block; border-radius: 4px; min-width: 0; }
  .sb-leg { display: flex; gap: 14px; margin-top: 8px; font-size: 12.5px; color: var(--ink2); }
  .sb-leg span { display: flex; align-items: center; gap: 6px; }
  .sb-leg i, .sec-h i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; }
  .sec-h { display: flex; justify-content: space-between; align-items: center; padding: 18px 22px 8px; }
  .sec-h span { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; }
  .sec-h b { font-family: var(--font-num); font-size: 15px; font-weight: 800; letter-spacing: -.02em; }
  .msi-top { display: flex; align-items: center; gap: 14px; }
  .msi-info { flex: 1; min-width: 0; }
  .msi-nums { display: flex; margin: 16px 0 14px; background: var(--surface2); border-radius: 16px; padding: 12px 4px; }
  .msi-nums > div { flex: 1; text-align: center; } .msi-nums > div + div { border-left: 1px solid var(--line); }
  .msi-nums b { display: block; font-family: var(--font-num); font-size: 16px; font-weight: 800; letter-spacing: -.03em; }
  .msi-nums span { font-size: 12px; color: var(--ink2); }
  .cuo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(54px, 1fr)); gap: 7px; }
  .cuo { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 7px 0 8px; border-radius: 12px; border: 2px solid transparent; background: var(--brand-soft); color: var(--brand); font-size: 12.5px; font-weight: 700; cursor: pointer; transition: transform .14s var(--ease-out); }
  .cuo small { font-size: 10px; font-weight: 600; opacity: .7; }
  .cuo:active { transform: scale(.94); }
  .cuo.on { background: var(--ok); color: #fff; cursor: default; } .cuo.on:active { transform: none; }
  :root[data-theme="dark"] .cuo.on { color: #06231a; }
  .cuo.cur { border-color: var(--marigold); }

  /* ── Calendario: barras + agenda ── */
  .sum3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
  .sum3 > div { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); padding: 13px 14px; min-width: 0; }
  .sum3 span { font-size: 12.5px; color: var(--ink2); display: block; }
  .sum3 b { display: block; font-family: var(--font-num); font-size: 19px; font-weight: 800; letter-spacing: -.04em; margin-top: 3px; white-space: nowrap; }
  .sum3 .s-pay { background: var(--ink); } .sum3 .s-pay span { color: var(--ink3); } .sum3 .s-pay b { color: var(--surface); }
  .sum3 .s-inc b, .sum3 .s-net b { color: var(--ok); } .sum3 .s-neg b { color: var(--bad); }
  .cbars { background: var(--surface); border-radius: 26px; box-shadow: var(--shadow); padding: 18px 12px 12px; }
  .cb-plot { display: flex; align-items: flex-end; gap: 2px; }
  .cb-col { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; border: none; background: none; padding: 0; }
  .cb-top { height: 10px; display: flex; align-items: center; justify-content: center; }
  .cb-inc { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
  .cb-bar { width: 100%; max-width: 14px; border-radius: 5px 5px 3px 3px; background: var(--brand); transition: height .5s var(--ease-out), background .15s; }
  .cb-col.we .cb-bar { filter: saturate(.7) brightness(1.12); }
  .cb-col.sel .cb-bar { background: var(--ink); }
  .cb-col:active .cb-bar { transform: scaleX(.8); }
  .cb-n { height: 16px; line-height: 16px; font-size: 10.5px; font-weight: 650; color: var(--ink3); margin-top: 4px; }
  .cb-col.today .cb-n { color: var(--ink); background: var(--marigold); border-radius: 8px; padding: 0 5px; margin-top: 3px; height: 17px; line-height: 17px; }
  .agenda { display: flex; flex-direction: column; gap: 10px; }
  .ag-day { display: flex; gap: 12px; align-items: flex-start; }
  .ag-day.past { opacity: .55; }
  .ag-rail { width: 46px; flex-shrink: 0; text-align: center; padding-top: 8px; }
  .ag-rail b { display: block; font-size: 26px; font-weight: 800; letter-spacing: -.05em; line-height: 1; }
  .ag-rail span { font-size: 12px; font-weight: 650; color: var(--ink3); }
  .ag-day.now .ag-rail b { color: var(--brand); } .ag-day.now .ag-rail span { color: var(--brand); }
  .ag-items { flex: 1; min-width: 0; background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; }
  .ag-day.now .ag-items { box-shadow: 0 0 0 2px var(--marigold), var(--shadow); }
  .ag-item { display: flex; align-items: center; gap: 11px; padding: 11px 12px; position: relative; }
  .ag-item + .ag-item::before { content: ''; position: absolute; left: 60px; right: 12px; top: 0; height: 1px; background: var(--line); }
  .ag-dot { width: 12px; height: 12px; border-radius: 4px; margin: 0 8px; flex-shrink: 0; }
  .ag-item .it-amt { font-size: 15px; }
  .pcard { isolation: isolate; }

  /* ── Captura de gasto ── */
  .xp-amt { display: flex; align-items: baseline; justify-content: center; gap: 6px; padding: 6px 0 14px; }
  .xp-amt .cur { font-family: var(--font-num); font-size: 30px; font-weight: 700; color: var(--ink3); }
  .xp-amt b { font-size: 54px; font-weight: 800; letter-spacing: -.05em; line-height: 1; }
  .xp-amt.empty b { color: var(--line2); }
  .xp-label { font-size: 13px; font-weight: 650; color: var(--ink2); margin: 14px 2px 8px; }
  .xp-row { display: flex; gap: 8px; align-items: stretch; margin-bottom: 2px; }
  .xp-row.wrap { flex-wrap: wrap; }
  .xp-chip { display: inline-flex; align-items: center; gap: 8px; min-height: 42px; padding: 0 16px; border-radius: 14px; border: 2px solid transparent; background: var(--surface2); font-size: 14.5px; font-weight: 650; color: var(--ink2); white-space: nowrap; position: relative; transition: background .15s, border-color .15s, color .15s; }
  .xp-chip.on { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); }
  .xp-chip i { width: 14px; height: 14px; border-radius: 5px; display: inline-block; }
  .xp-chip.date input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; }
  .xp-chip.date { flex: 1; justify-content: center; }
  .xp-chip.sel { padding: 0 6px; gap: 2px; flex: 1; }
  .xp-chip.sel select, .xp-chip.sel input { border: none; background: none; font-size: 14.5px; font-weight: 650; color: inherit; outline: none; -webkit-appearance: none; appearance: none; padding: 8px 6px; }
  .xp-chip.sel input { width: 70px; }
  .xp-chip.num-in { width: 76px; padding: 0 10px; text-align: center; outline: none; }
  .xp-chip.num-in:focus { border-color: var(--brand); }
  .xp-cats { display: flex; gap: 8px; overflow-x: auto; margin: 0 -20px; padding: 2px 20px 6px; scroll-snap-type: x proximity; }
  .xp-cat { flex-shrink: 0; scroll-snap-align: start; display: flex; align-items: center; gap: 7px; height: 42px; padding: 0 14px 0 10px; border-radius: 14px; border: 2px solid transparent; background: var(--surface2); font-size: 14px; font-weight: 650; color: var(--ink2); white-space: nowrap; transition: transform .14s var(--ease-out), background .15s, border-color .15s; }
  .xp-cat span { font-size: 19px; line-height: 1; }
  .xp-cat:active { transform: scale(.95); }
  .xp-cat.on { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); }
  .xp-due { margin-top: 10px; padding: 9px 13px; border-radius: 12px; background: var(--brand-soft); color: var(--brand); font-size: 12.5px; font-weight: 650; }
  .xp-desc { width: 100%; margin-top: 14px; background: var(--surface2); border: 2px solid transparent; border-radius: 14px; padding: 13px 14px; font-size: 16px; color: var(--ink); outline: none; transition: border-color .15s, background .15s; }
  .xp-desc:focus { border-color: var(--brand); background: var(--surface); }
  .xp-desc::placeholder { color: var(--ink3); }
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
  .keypad button { height: 54px; border: none; border-radius: 16px; background: var(--surface2); font-family: var(--font-num); font-size: 24px; font-weight: 700; color: var(--ink); transition: transform .12s var(--ease-out), background .12s; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  .keypad button:active { transform: scale(.94); background: var(--line2); }
  .keypad .kp-del { color: var(--ink2); font-size: 20px; }
  .stepper { display: flex; align-items: center; justify-content: space-between; background: var(--surface2); border-radius: 16px; padding: 6px; }
  .stepper button { width: 48px; height: 44px; border: none; border-radius: 12px; background: var(--surface); font-size: 24px; font-weight: 700; color: var(--brand); box-shadow: 0 1px 3px rgba(13,18,48,.12); transition: transform .12s var(--ease-out); }
  .stepper button:active { transform: scale(.92); }
  .stepper b { font-size: 24px; font-weight: 800; }
  .msi-prev { margin-top: 18px; background: var(--ink); color: var(--surface); border-radius: 20px; padding: 16px 18px; }
  .msi-prev span { font-size: 12.5px; opacity: .65; }
  .msi-prev b { display: block; font-size: 28px; font-weight: 800; letter-spacing: -.04em; margin-top: 2px; }
  .mp-line { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  .mp-line i { flex: 1; height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--marigold), rgba(255,255,255,.3)); }
  .mp-line span { font-size: 12.5px; font-weight: 650; opacity: .9; }
  .msi-prev small { display: block; margin-top: 10px; font-size: 12px; opacity: .7; }
  .xp-hint { font-size: 12.5px; color: var(--ink2); line-height: 1.4; margin: 14px 2px 10px; }
  .qa-tile.row { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; }
  .qa-tile.row .qa-t { margin-top: 0; }

  /* ── Calendario por semanas ── */
  .weeks { display: flex; flex-direction: column; gap: 12px; }
  .wk { background: var(--surface); border-radius: 26px; box-shadow: var(--shadow); padding: 6px 6px 8px; }
  .wk.now { box-shadow: 0 0 0 2px var(--marigold), var(--shadow); }
  .wk.past .wk-t b, .wk.past .wk-tot b { color: var(--ink2); }
  .wk-h { display: flex; align-items: center; gap: 10px; width: 100%; border: none; background: none; text-align: left; padding: 12px 12px 10px; }
  .wk-t { flex: 1; min-width: 0; }
  .wk-t b { display: block; font-family: var(--font-num); font-size: 17px; font-weight: 800; letter-spacing: -.03em; }
  .wk-t span { font-size: 12.5px; color: var(--ink2); }
  .wk-tot { text-align: right; }
  .wk-tot b { display: block; font-size: 17px; font-weight: 800; letter-spacing: -.03em; }
  .wk-tot em { font-style: normal; font-size: 12.5px; font-weight: 700; color: var(--ok); }
  .wk-chev { width: 18px; height: 18px; color: var(--ink3); transition: transform .25s var(--ease-out); display: flex; flex-shrink: 0; }
  .wk-chev.open { transform: rotate(90deg); }
  .wk-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; padding: 0 8px; }
  .wk-d { position: relative; aspect-ratio: 1 / 1.15; border-radius: 14px; background: var(--surface2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; }
  .wk-d small { font-size: 10.5px; font-weight: 650; color: var(--ink3); }
  .wk-d b { font-family: var(--font-num); font-size: 17px; font-weight: 800; letter-spacing: -.03em; }
  .wk-d i { position: absolute; bottom: 5px; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
  .wk-d.blank { background: none; }
  .wk-d[style*="--h"] { background: color-mix(in srgb, var(--brand) calc(var(--h) * 100%), var(--surface2)); }
  .wk-d.hot, .wk-d.hot small { color: #fff; }
  :root[data-theme="dark"] .wk-d.hot, :root[data-theme="dark"] .wk-d.hot small { color: #0a0d24; }
  .wk-d.today { box-shadow: inset 0 0 0 2.5px var(--marigold); }
  .wk-items { margin-top: 8px; padding: 0 4px; }
  .wk-i { display: flex; align-items: center; gap: 11px; padding: 11px 8px; position: relative; }
  .wk-i + .wk-i::before { content: ''; position: absolute; left: 62px; right: 8px; top: 0; height: 1px; background: var(--line); }
  .wk-i::after { content: ''; position: absolute; left: 0; top: 14px; bottom: 14px; width: 4px; border-radius: 2px; background: var(--bar, var(--brand)); }
  .wk-dt { width: 40px; text-align: center; flex-shrink: 0; margin-left: 6px; }
  .wk-dt b { display: block; font-size: 20px; font-weight: 800; letter-spacing: -.04em; line-height: 1; }
  .wk-dt span { font-size: 11.5px; color: var(--ink3); font-weight: 650; }
  .wk-i .it-amt { font-size: 15px; }
  .wk-empty { padding: 12px 16px 8px; font-size: 13.5px; color: var(--ink3); }

  .xp-date { flex: 1; min-width: 0; background: var(--surface2); border: 2px solid transparent; border-radius: 14px; padding: 0 12px; min-height: 42px; font-size: 14.5px; font-weight: 650; outline: none; -webkit-appearance: none; appearance: none; }
  .xp-chip.sm { min-height: 36px; padding: 0 16px; border-radius: 12px; }
  .disc { background: var(--surface2); border-radius: 18px; padding: 14px; margin-bottom: 14px; }
  .disc-q { font-size: 14.5px; font-weight: 650; margin-bottom: 10px; }
  .disc .seg { background: var(--surface); }
  :root[data-theme="dark"] .disc .seg { background: var(--paper); }
  .disc-h { font-size: 12.5px; color: var(--ink2); margin-top: 9px; }
  .msi-sum { display: flex; gap: 10px; margin-bottom: 4px; }
  .msi-sum > div { flex: 1; background: var(--surface2); border-radius: 16px; padding: 12px 14px; }
  .msi-sum span { font-size: 12.5px; color: var(--ink2); display: block; }
  .msi-sum b { font-size: 19px; font-weight: 800; letter-spacing: -.03em; }

  .seg2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .seg2 button { text-align: left; padding: 11px 14px; border-radius: 14px; border: 2px solid transparent; background: var(--surface2); transition: background .15s, border-color .15s; }
  .seg2 b { display: block; font-size: 16px; font-weight: 800; color: var(--ink2); }
  .seg2 small { display: block; font-size: 12px; color: var(--ink3); margin-top: 1px; }
  .seg2 button.on { background: var(--brand-soft); border-color: var(--brand); }
  .seg2 button.on b { color: var(--brand); } .seg2 button.on small { color: var(--ink2); }
  .xp-chip.small { min-height: 34px; padding: 0 12px; font-size: 13.5px; border-radius: 11px; }
  .paid-row { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; font-size: 14.5px; font-weight: 650; color: var(--ink2); }
  .stepper.mini { width: 138px; padding: 4px; }
  .stepper.mini button { width: 38px; height: 34px; font-size: 20px; }
  .stepper.mini b { font-size: 18px; }
  .msi-line { display: flex; align-items: baseline; justify-content: space-between; margin-top: 16px; padding: 13px 16px; border-radius: 16px; background: var(--brand-soft); }
  .msi-line b { font-size: 20px; font-weight: 800; letter-spacing: -.03em; color: var(--brand); }
  .msi-line span { font-size: 12.5px; font-weight: 650; color: var(--ink2); }

  .xp-name { width: 100%; border: none; border-bottom: 2px solid var(--line2); background: none; outline: none; padding: 8px 2px 10px; font-family: var(--font-num); font-size: 24px; font-weight: 800; letter-spacing: -.03em; color: var(--ink); transition: border-color .15s; }
  .xp-name:focus { border-color: var(--brand); }
  .xp-name::placeholder { color: var(--ink3); font-weight: 700; }
  .xp-recents { display: flex; gap: 7px; overflow-x: auto; margin: 10px -20px 0; padding: 0 20px 2px; }
  .xp-recents button { flex-shrink: 0; height: 32px; padding: 0 13px; border-radius: 999px; border: none; background: var(--surface2); font-size: 13.5px; font-weight: 650; color: var(--ink2); }

  /* ── Calendario: pendientes ── */

  .cal-head { align-items: flex-start; margin-bottom: 14px; }

  .qn.sel.empty .qn-net { color: rgba(255,255,255,.7); }
  .qn-sub { display: flex; gap: 10px; margin-top: 4px; font-size: 12px; font-weight: 700; opacity: .65; }
  .vseg { display: flex; width: 150px; background: var(--surface2); border-radius: 12px; padding: 3px; margin: 0 0 12px auto; }
  .vseg button { flex: 1; border: none; background: none; padding: 7px 0; border-radius: 9px; font-size: 13px; font-weight: 700; color: var(--ink2); transition: background .2s var(--ease-out), color .2s; }
  .vseg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 4px rgba(13,18,48,.14); }
  :root[data-theme="dark"] .vseg button.on { background: var(--brand-soft); box-shadow: none; }
  .ribbon { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 4px 16px 10px; scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; }
  .rb { flex: 0 0 56px; height: 96px; scroll-snap-align: center; border: 2px solid transparent; border-radius: 20px; background: var(--surface); box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; padding: 10px 0 9px; gap: 1px; position: relative; transition: transform .14s var(--ease-out), background .15s; }

  .rb-bar { margin-top: auto; width: 22px; height: 22px; border-radius: 7px; background: var(--surface2); display: flex; align-items: flex-end; overflow: hidden; }

  .rb.sel small, .rb.sel b { color: #fff; } .rb.sel .rb-amt { color: var(--sun); } .rb.sel .rb-bar { background: rgba(255,255,255,.2); } .rb.sel .rb-bar s { background: var(--sun); }

  .mbox { background: var(--surface); border-radius: 26px; box-shadow: var(--shadow); padding: 14px 12px 12px; }

  .mg-w { text-align: center; font-size: 12px; font-weight: 700; color: var(--ink3); padding: 2px 0 6px; }
  .mg-d { position: relative; aspect-ratio: 1 / 1.1; border: 2px solid transparent; border-radius: 14px; background: var(--surface2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 0; transition: transform .14s var(--ease-out); }

  .mg-d b { font-size: 16px; font-weight: 800; letter-spacing: -.03em; line-height: 1; }

  :root[data-theme="dark"] .mg-d.sel { background: var(--brand2) !important; border-color: var(--brand2); }
  .mg-d.sel span { color: var(--sun); opacity: 1; }
  .mg-d.past { opacity: .5; }

  /* ══ Avisos con deshacer ══ */
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(92px + var(--safe-bottom)); z-index: 60; display: flex; align-items: center; gap: 14px; max-width: min(440px, calc(100% - 32px)); padding: 12px 12px 12px 18px; border-radius: 18px; background: var(--navy); color: #fff; font-size: 14px; font-weight: 600; box-shadow: 0 18px 34px -12px rgba(9,12,32,.6); animation: toastIn .28s var(--ease-out); }

  .cp-sum { text-align: center; padding: 8px 0 4px; }

  /* ── Gastos / alertas / ajustes ── */

// ─── CALENDARIO DE DEUDA: cuánto cae en cada mes ─────────────────────────────
// Devuelve un arreglo [mes0, mes1, ...] cuya suma == totalToPay de la tarjeta.
function cardSchedule(card, expenses, msis, payments=[], horizon=60) {
  const arr = new Array(horizon).fill(0);
  const put = (k,v)=>{ if (v>0) arr[Math.min(horizon-1, Math.max(0,k))] += v; };
  expenses.forEach(e=>{ if(!e.paid) put(dueMonthsAway(e.date, card.cutDay, card.payDay), parseFloat(e.amount)||0); });
  msis.forEach(m=>{
    const total=parseInt(m.total)||0, monthly=parseFloat(m.monthly)||0, paid=m.paid||[];
    for (let i=0;i<total;i++){
      const mi=(parseInt(m.startMonth)+i)%12;
      const yi=(parseInt(m.startYear)||currentYear)+Math.floor((parseInt(m.startMonth)+i)/12);
      if (!paid.includes(monthKey(yi,mi))) put(msiMonthAway(yi,mi), monthly);
    }
  });
  let abonos = payments.reduce((a,p)=>a+(parseFloat(p.amount)||0),0);
  for (let k=0;k<horizon && abonos>0;k++){ const t=Math.min(arr[k],abonos); arr[k]-=t; abonos-=t; }
  const target = computeCardTotals(card, expenses, msis, payments).totalToPay;
  const sum = arr.reduce((a,b)=>a+b,0);
  if (sum>0) { const f=target/sum; for (let k=0;k<horizon;k++) arr[k]*=f; }
  else if (target>0) arr[0]=target;
  return arr;
}

function useCountUp(value) {
  const reduce = typeof window!=='undefined' && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  useEffect(()=>{
    if (window.__cuDone || reduce) { setV(value); window.__cuDone = true; return; }
    let raf, t0=null; const dur=850;
    const step = ts => {
      if (t0===null) t0=ts;
      const p = Math.min(1,(ts-t0)/dur);
      setV(value*(1-Math.pow(1-p,4)));
      if (p<1) raf=requestAnimationFrame(step); else window.__cuDone=true;
    };
    raf = requestAnimationFrame(step);
    return ()=>cancelAnimationFrame(raf);
  }, [value]);
  return v;
}

  const pts = [total];
  let acc = total;
  for (let j=0;j<n;j++){ acc = Math.max(0, acc - sched[j]); pts.push(j===last?0:acc); }
  const W=340, H=150, px=10, top=30, bot=24;
  const X = j => px + j/n*(W-2*px);
  const Y = v => top + (1-v/total)*(H-top-bot);
  let d = `M${X(0)},${Y(pts[0])}`;
  for (let j=1;j<=n;j++){ const x0=X(j-1), x1=X(j), dx=(x1-x0)/2; d += ` C${x0+dx},${Y(pts[j-1])} ${x1-dx},${Y(pts[j])} ${x1},${Y(pts[j])}`; }
  const area = `${d} L${X(n)},${H-bot} L${X(0)},${H-bot} Z`;
  const lab = j => { const dt=new Date(currentYear, currentMonth+j-1, 1); return `${MONTHS[dt.getMonth()]}${dt.getFullYear()!==currentYear?` ${dt.getFullYear()}`:''}`; };
  const hero = tone!=='card';
  const line = hero ? '#ffb703' : 'var(--brand)';
  const lblc = hero ? 'rgba(255,255,255,.7)' : 'var(--ink3)';
  const move = e => {
    const r = e.currentTarget.getBoundingClientRect();
    const x = (e.clientX-r.left)/r.width*W;
    setHi(Math.max(0, Math.min(n, Math.round((x-px)/(W-2*px)*n))));
  };
  return (
    <>
      <div className="route-head"><b>Ruta a cero</b><span>Toca la gráfica para ver cada mes</span></div>
      <div className={`route-chart ${still?'rt-static':''}`}>
        <svg viewBox={`0 0 ${W} ${H}`} style={{touchAction:'pan-y'}} onPointerDown={move} onPointerMove={move} onPointerLeave={()=>setHi(null)} onPointerUp={()=>setHi(null)} role="img" aria-label="Proyección de tu deuda mes a mes">
          <defs>
            <linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stopColor={hero?'#fff':'var(--brand)'} stopOpacity={hero?.3:.22}/>
              <stop offset="1" stopColor={hero?'#fff':'var(--brand)'} stopOpacity="0"/>
            </linearGradient>
          </defs>
          <line x1={px} x2={W-px} y1={H-bot} y2={H-bot} stroke={hero?'rgba(255,255,255,.25)':'var(--line2)'} strokeWidth="1" strokeDasharray="2 4"/>
          <line x1={px} x2={W-px} y1={Y(total/2)} y2={Y(total/2)} stroke={hero?'rgba(255,255,255,.14)':'var(--line)'} strokeWidth="1"/>
          <path className="rt-area" d={area} fill={`url(#${gid})`}/>
          <path className="rt-line" pathLength="1" d={d} fill="none" stroke={line} strokeWidth="3.4" strokeLinecap="round"/>
          {n<=18 && pts.slice(1,n).map((v,j)=>(<circle key={j} cx={X(j+1)} cy={Y(v)} r="2.6" fill={hero?'#fff':'var(--brand)'} opacity=".75"/>))}
          <circle cx={X(0)} cy={Y(pts[0])} r="4.5" fill={hero?'#fff':'var(--brand)'}/>
          <circle cx={X(n)} cy={Y(0)} r="6" fill={line} stroke={hero?'#1f2ee0':'var(--surface)'} strokeWidth="3"/>
          {hi!==null && <g>
            <line x1={X(hi)} x2={X(hi)} y1={top-4} y2={H-bot} stroke={hero?'rgba(255,255,255,.55)':'var(--line2)'} strokeWidth="1.5"/>
            <circle cx={X(hi)} cy={Y(pts[hi])} r="6" fill={hero?'#fff':'var(--brand)'} stroke={line} strokeWidth="3"/>
          </g>}
          <text x={X(0)} y={Y(pts[0])-10} fontSize="11.5" fontWeight="700" fill={hero?'#fff':'var(--ink)'} textAnchor="start">{fmt(total)}</text>
          <text x={X(n)} y={Y(0)-13} fontSize="11.5" fontWeight="700" fill={hero?'#ffb703':'var(--ok)'} textAnchor="end">$0.00</text>
          {n>=4 && <text x={X(Math.round(n/2))} y={H-6} fontSize="11" fontWeight="600" fill={lblc} textAnchor="middle">{lab(Math.round(n/2))}</text>}
          <text x={X(0)} y={H-6} fontSize="11.5" fontWeight="600" fill={lblc} textAnchor="start">Hoy</text>
          <text x={X(n)} y={H-6} fontSize="11.5" fontWeight="600" fill={lblc} textAnchor="end">{lab(n)}</text>
        </svg>
      </div>
      <div className="route-cap">

// ─── FINANCIAL MODEL ─────────────────────────────────────────────────────────
// card.available = exact bank balance entered by user. NEVER mutated.
//
// EXPENSES:
//   toggle OFF + not paid  → bank hasn't charged yet → subtract
//   toggle OFF + paid      → bank charged, credit freed → no adjustment (net 0 vs base)
//   toggle ON  + any       → already in base → 0
//
// MSI:
//   paidCount = cuotas pre-existing when user added the MSI (already in base available).
//   extraPaid = paid.length - paidCount  (cuotas newly palomeaded AFTER adding)
//   stillOwed = total - paid.length      (cuotas not yet palomeaded)
//   → each extraPaid cuota adds back to available (bank charged, freed credit)
//   → each stillOwed cuota subtracts from available (reserved future debt)
//
// IMPORTANT: if paidCount is missing (legacy data), treat ALL current paid[] as pre-existing
//            so opening an old MSI doesn't suddenly move the available balance.

function computeCardTotals(card, expenses, msis, payments=[]) {
  const totalCredit = parseFloat(card.total)||0;
  const extension   = parseFloat(card.extension)||0;
  const baseAvail   = parseFloat(card.available)||0;

  // ── Expense adjustment ──
  // The toggle (alreadyDiscounted) only affects whether we subtract when NOT paid.
  // Palomear (paid=true) ALWAYS frees credit — regardless of toggle.
  //
  //   alreadyDiscounted=false, paid=false  → bank hasn't charged yet   → subtract
  //   alreadyDiscounted=false, paid=true   → bank charged, now settled  → +amount (cancel the subtract)
  //   alreadyDiscounted=true,  paid=false  → bank already has it        → 0 (already in base)
  //   alreadyDiscounted=true,  paid=true   → paid & settled             → +amount (credit freed)
  //
  // Simplified: paid=true always adds back. paid=false only subtracts if NOT already discounted.
  let expAdj = 0;
  expenses.forEach(e => {
    const amount = parseFloat(e.amount)||0;
    if (e.paid) {
      expAdj += amount;          // paid: bank charged it AND user settled → credit freed → +
    } else if (!e.alreadyDiscounted) {
      expAdj -= amount;          // pending, bank hasn't charged yet → -
    }
    // alreadyDiscounted=true + not paid → 0 (already in base, still owed but bank tracks it)
  });

  // ── MSI adjustment ──
  // baseAvail already reflects ALL pre-existing paid cuotas (paidCount) — bank took them.
  // Only NEW cuotas palomeated AFTER adding the MSI to the app add credit back.
  // newlyPaid = paid.length - paidCount  (cuotas ticked by user in the app)
  let msiAdj = 0;
  msis.forEach(m => {
    const monthly   = parseFloat(m.monthly)||0;
    const paidKeys  = m.paid||[];
    const paidCount = m.paidCount !== undefined && m.paidCount !== ''
      ? parseInt(m.paidCount)||0
      : paidKeys.length; // legacy: treat all as pre-existing → no adjustment
    const newlyPaid = Math.max(0, paidKeys.length - paidCount);
    msiAdj += newlyPaid * monthly;
  });

  // ── Payments (abonos) ──
  // Dinero que transferiste a la tarjeta: libera crédito (sube disponible)
  // y baja tu total a pagar. No se ata a un gasto concreto.
  const totalPayments = payments.reduce((a,p)=>a+(parseFloat(p.amount)||0),0);

  const realAvail = baseAvail + expAdj + msiAdj + totalPayments;
  const creditLine = totalCredit + extension;
  const used    = creditLine - realAvail;
  const usedPct = creditLine > 0 ? (used / creditLine) * 100 : 0;

  // "Total a pagar": unpaid expenses + remaining MSI cuotas − pagos hechos
  const unpaidExp = expenses.filter(e=>!e.paid).reduce((a,e)=>a+(parseFloat(e.amount)||0),0);
  const pendMsi   = msis.reduce((a,m)=>{
    const stillOwed = (parseInt(m.total)||0) - (m.paid||[]).length;
    return a + stillOwed * (parseFloat(m.monthly)||0);
  },0);
  const totalToPay = Math.max(0, unpaidExp + pendMsi - totalPayments);

  // ── Cycle breakdown (expenses + MSI cuotas) ──
  const expThisCycle = expenses.filter(e=>!e.paid && dueMonthsAway(e.date, card.cutDay, card.payDay) <= 0).reduce((a,e)=>a+(parseFloat(e.amount)||0),0);
  const expNextCycle = expenses.filter(e=>!e.paid && dueMonthsAway(e.date, card.cutDay, card.payDay) === 1).reduce((a,e)=>a+(parseFloat(e.amount)||0),0);
  const { thisCycleMsi, nextCycleMsi } = getMsiCycleAmounts(msis);

  // Los pagos reducen primero lo del ciclo actual
  const thisCycle = Math.max(0, (expThisCycle + thisCycleMsi) - totalPayments);

  return { totalCredit, extension, realAvail, used, usedPct, totalToPay, totalPayments,
    cutDays: daysUntil(parseInt(card.cutDay)||1),
    payDays: daysUntil(parseInt(card.payDay)||15),
    thisCycle,
    nextCycle:  expNextCycle + nextCycleMsi,
  };
}

// ─── CYCLE HELPER ────────────────────────────────────────────────────────────
// Returns true if a date string falls AFTER the card's cut day (next billing cycle)
function isNextCycle(dateStr, cutDay) {
  if (!dateStr) return false;
  const [y,m,d] = dateStr.split('-').map(Number);
  const expDate = new Date(y, m-1, d);
  const cut = parseInt(cutDay)||1;
  const cutThisMonth = new Date(today.getFullYear(), today.getMonth(), cut);
  return expDate > cutThisMonth;
}

// Meses que faltan para PAGAR un gasto, según corte y pago de la tarjeta.
// 0 = este mes (o atrasado), 1 = próximo mes, 2 = en dos meses...
// Una compra hecha DESPUÉS del corte entra al siguiente estado de cuenta.
// Si el día de pago cae ANTES que el de corte, ese estado se paga el mes siguiente al cierre.
function dueMonthsAway(dateStr, cutDay, payDay) {
  if (!dateStr) return 0;
  const [y,m,d] = dateStr.split('-').map(Number);
  const C = parseInt(cutDay)||1, P = parseInt(payDay)||15;
  let closeAbs = y*12 + (m-1);              // estado de cuenta que captura la compra
  if (d > C) closeAbs += 1;                 // comprado después del corte → siguiente estado
  const dueAbs = closeAbs + (P <= C ? 1 : 0); // si el pago < corte, se paga el mes siguiente
  return dueAbs - (currentYear*12 + currentMonth);
}
// Meses que faltan para una cuota MSI (por su propio mes asignado).
function msiMonthAway(yi, mi) {
  return (yi*12 + mi) - (currentYear*12 + currentMonth);
}

// Returns the date string for a given cuota index of an MSI
function msiCuotaDate(msi, index) {
  const mi = (parseInt(msi.startMonth) + index) % 12;
  const yi = parseInt(msi.startYear) + Math.floor((parseInt(msi.startMonth) + index) / 12);
  // Use day 1 of that month as the billing date
  return `${yi}-${String(mi+1).padStart(2,'0')}-01`;
}

// Returns { thisCycleMsi, nextCycleMsi } — unpaid cuotas grouped by current/next cycle
function getMsiCycleAmounts(msis) {
  let thisCycleMsi = 0, nextCycleMsi = 0;
  msis.forEach(m => {
    const total    = parseInt(m.total)||0;
    const monthly  = parseFloat(m.monthly)||0;
    const paidKeys = m.paid||[];
    for (let i = 0; i < total; i++) {
      const mi = (parseInt(m.startMonth)+i)%12;
      const yi = parseInt(m.startYear)+Math.floor((parseInt(m.startMonth)+i)/12);
      const mk = monthKey(yi,mi);
      if (paidKeys.includes(mk)) continue; // already paid, skip
      const away = msiMonthAway(yi, mi);
      if (away <= 0) thisCycleMsi += monthly;       // este mes o atrasada
      else if (away === 1) nextCycleMsi += monthly; // próximo mes
    }
  });
  return { thisCycleMsi, nextCycleMsi };
}

// Próximos 2 meses a pagar de UNA tarjeta: cuotas MSI de ese mes + gastos cuyo pago real cae ahí
function cardMonthsToPay(card, expenses, msis) {
  const out = [];
  for (let k=1;k<=2;k++){
    const d  = new Date(currentYear, currentMonth+k, 1);
    const mk = monthKey(d.getFullYear(), d.getMonth());
    let amount = 0;
    msis.forEach(m=>{
      const total=parseInt(m.total)||0, monthly=parseFloat(m.monthly)||0, paid=m.paid||[];
      for (let i=0;i<total;i++){
        const mi=(parseInt(m.startMonth)+i)%12;
        const yi=parseInt(m.startYear)+Math.floor((parseInt(m.startMonth)+i)/12);
        const cuotaMk=monthKey(yi,mi);
        if (cuotaMk===mk && !paid.includes(cuotaMk)) amount += monthly;
      }
    });
    amount += expenses
      .filter(e=>!e.paid && dueMonthsAway(e.date, card.cutDay, card.payDay) === k)
      .reduce((a,e)=>a+(parseFloat(e.amount)||0),0);
    out.push({ label: MONTHS[d.getMonth()], year: d.getFullYear(), amount });
  }
  return out;
}

function QuickAdd({ cards, lastCard, onPick, onNewCard, onClose }) {

        <div className="qa-grid">
          <button className="qa-tile big" disabled={need} style={need?{opacity:.45}:null} onClick={()=>choose({k:'gasto',needCard:true})}>

            <span><span className="qa-t">Gasto</span><span className="qa-s">Compra con tarjeta</span></span>

function HomeSummary({ grandTotal, thisMonth, weekly, months, upcoming, cash, expenses, msis, cards, payments, budgets, loans, onOpenLoans, onEditCash, onOpenCard, onGoTab, onOpenSettings }) {

  const diff = cashVal - thisMonth;
  const [selCat, setSelCat] = useState(null);
  const PALETTE = ['#2a3cff','#ffb703','#0f9d6e','#e5304f','#8b5cf6','#06b6d4'];

  const { catData, catItems, owedTotal, paidTotal, hasAbonos, sched } = (()=>{
    const map = {}, items = {}, sched = new Array(60).fill(0);
    let owed = 0, paid = 0, abonosOn = false;
    const add = (k,v,desc)=>{ if(v>0){ map[k]=(map[k]||0)+v; (items[k]=items[k]||[]).push({desc:desc||k, amount:v}); } };
    cards.forEach(c=>{
      const cExp  = (expenses||[]).filter(e=>e.cardId===c.id);
      const cMsi  = (msis||[]).filter(m=>m.cardId===c.id);
      const cPay  = (payments||[]).filter(p=>p.cardId===c.id);
      const target = computeCardTotals(c, cExp, cMsi, cPay).totalToPay;
      cardSchedule(c, cExp, cMsi, cPay).forEach((v,i)=>{ sched[i]+=v; });
      const abonos = cPay.reduce((a,p)=>a+(parseFloat(p.amount)||0),0);
      const raw = [];
      cExp.forEach(e=>{
        const amt = parseFloat(e.amount)||0;
        if (e.paid) paid += amt; else if (amt>0) raw.push({k:e.cat||'📦 Otro', v:amt, d:e.desc||'Gasto'});
      });
      cMsi.forEach(m=>{
        const mo = parseFloat(m.monthly)||0, t = parseInt(m.total)||0, p = (m.paid||[]).length;
        paid += Math.min(p,t)*mo;
        const left = Math.max(0,t-p)*mo;
        if (left>0) raw.push({k:'📅 Meses sin intereses', v:left, d:m.desc||'MSI'});
      });
      paid += abonos;
      const rawSum = raw.reduce((a,r)=>a+r.v,0);
      const f = rawSum>0 ? target/rawSum : 0;
      if (abonos>0 && f<1) abonosOn = true;
      raw.forEach(r=> add(r.k, r.v*f, r.d));
      owed += target;
    });
    const arr = Object.entries(map).map(([label,value])=>({label,value})).filter(d=>d.value>0.005).sort((a,b)=>b.value-a.value);
    const top = arr.slice(0,5), rest = arr.slice(5);
    if (rest.length) {
      top.push({ label:'➕ Otras categorías', value: rest.reduce((a,d)=>a+d.value,0) });
      items['➕ Otras categorías'] = rest.flatMap(d=>items[d.label]||[]);
    }
    return { catData: top.map((d,i)=>({ ...d, color: PALETTE[i%PALETTE.length] })), catItems: items, owedTotal: owed, paidTotal: paid, hasAbonos: abonosOn, sched };
  })();
  const catTotal = catData.reduce((a,d)=>a+d.value,0);
  const everything = paidTotal + owedTotal;
  const paidPct = everything>0 ? Math.round(paidTotal/everything*100) : 0;
  const flow = [{ label:'Este mes', amount:thisMonth, current:true }, ...(months||[]).map(m=>({ label: m.label + (m.year!==currentYear?` '${String(m.year).slice(2)}`:''), amount:m.amount }))];

  const shown = useCountUp(owedTotal);
  const cents = Math.round(shown*100), whole = Math.floor(cents/100), dec = String(cents%100).padStart(2,'0');
  const alerts = (()=>{
    const out = [];
    (upcoming||[]).filter(p=>p.days<=3).forEach(p=>{ const card = p.isCommit?null:cards.find(c=>c.id===p.id);
      out.push({ k:'u'+p.id, tone:'bad', icon:'⏰', t:`${p.name} · ${dayLabel(p.days).toLowerCase()}`, s:`Paga ${fmt(p.amount)}`, go: card?()=>onOpenCard(card):()=>onGoTab('commits') }); });
    if (cashVal>0 && diff<0) out.push({ k:'cash', tone:'bad', icon:'⚠️', t:'Tu disponible no cubre este mes', s:`Te faltan ${fmt(-diff)}`, go:onEditCash });
    cards.forEach(c=>{
      const t = computeCardTotals(c, expenses.filter(e=>e.cardId===c.id), msis.filter(m=>m.cardId===c.id), payments.filter(p=>p.cardId===c.id));
      if (t.usedPct>=80) out.push({ k:'u80'+c.id, tone:t.usedPct>=95?'bad':'warn', icon:'💳', t:`${c.name||'Tarjeta'} usa el ${Math.round(t.usedPct)}% de su límite`, s:`Disponible ${fmt(t.realAvail)}`, go:()=>onOpenCard(c) });
    });
    const sp = monthCatSpend(expenses, monthKey(currentYear, currentMonth+1));
    Object.entries(budgets||{}).forEach(([c,b])=>{ if((sp[c]||0)>b) out.push({ k:'b'+c, tone:'warn', icon:c.split(' ')[0], t:`Presupuesto de ${c.split(' ').slice(1).join(' ')} excedido`, s:`${fmt(sp[c]-b)} sobre tus ${fmt(b)}`, go:()=>onGoTab('insights') }); });
    return out.slice(0,5);
  })();
  const loanRows = (loans||[]).map(l=>({l,i:loanInfo(l)})).filter(x=>x.i.left>0);
  const loanOwed = loanRows.reduce((a,x)=>a+x.i.owed,0);
  const meterPct = thisMonth>0 ? Math.min(100, cashVal/thisMonth*100) : 100;

  return (
    <>
      <div className="route">
        <div className="route-brand"><i><IconBrand/></i>Finanzas</div>
        <button className="route-gear" onClick={onOpenSettings} aria-label="Ajustes"><IconGear/></button>
        <div className="route-lead">Debes hoy</div>
        <div className="route-amt num">${whole.toLocaleString('es-MX')}<small>.{dec}</small></div>
        {everything>0 && <div className="route-paid"><i><b style={{width:`${paidPct}%`}}/></i>Pagado {fmt0(paidTotal)} · {paidPct}%</div>}
        {loanOwed>0 && <div className="route-loans"><span>Tarjetas <b className="num">{fmt(owedTotal)}</b></span><span>Préstamos <b className="num">{fmt(loanOwed)}</b></span><span>Total <b className="num">{fmt(owedTotal+loanOwed)}</b></span></div>}
        {owedTotal>0.005
          ? <RouteChart sched={sched} total={owedTotal}/>
          : <div className="route-cap" style={{marginTop:14}}>Sin deuda pendiente</div>}
      </div>

      <div className="home-body">
        {alerts.length>0 && (
          <section className="wide">
            <div className="h2" style={{marginTop:22}}>Atención</div>
            <div className="alerts">
              {alerts.map(a=>(
                <button key={a.k} className={`alert ${a.tone}`} onClick={a.go||undefined} style={{cursor:a.go?'pointer':'default'}}>
                  <span className="ai">{a.icon}</span><span className="at">{a.t}<small>{a.s}</small></span>
                </button>
              ))}
            </div>
          </section>
        )}
        <section className="month">
          <div className="month-cols">
            <div><div className="k">Este mes</div><div className="v">{fmt0(thisMonth)}</div><div className="s">≈ {fmt0(weekly)} por semana</div></div>
            <div>
              <button className="v-btn" onClick={onEditCash}>
                <div className="k">Disponible</div>
                {cashVal>0 ? <div className="v">{fmt0(cashVal)}</div> : <div className="v link">Agregar</div>}
              </button>
            </div>
          </div>
          {cashVal>0 && (<>
            <div className={`meter ${diff<0?'short':''}`}><i style={{width:`${meterPct}%`}}/></div>
            <div className={`meter-cap ${diff<0?'short':''}`}>{diff>=0 ? `Te alcanza · sobran ${fmt0(diff)}` : `Te faltan ${fmt0(-diff)}`}</div>
          </>)}
        </section>

        <section>
          <div className="h2">Próximos pagos</div>
          {upcoming && upcoming.length>0
            ? <div className="tickets">
                {upcoming.map(p=>{
                  const card = p.isCommit ? null : cards.find(c=>c.id===p.id);
                  return (
                    <div key={p.id} className="ticket" style={{'--tk': p.hex || '#ffb703', cursor:card?'pointer':'default'}} onClick={card?()=>onOpenCard(card):undefined}>
                      <div className="tk-date"><b className="num">{p.date.getDate()}</b><span>{MONTHS[p.date.getMonth()]}</span></div>
                      <div className="tk-name">{p.name}</div>
                      <div className="tk-amt">{fmt(p.amount)}</div>
                      <span className={`tk-chip ${p.days<=3?'bad':p.days<=7?'warn':''}`}>{dayLabel(p.days)}</span>
                    </div>
                  );
                })}
              </div>
            : <div className="none-row">Sin pagos próximos</div>}
        </section>

        <section>
          <div className="h2">Tarjetas</div>
          <div className="wallet">
            {cards.map(c=>{
              const ci = COLORS.find(x=>x.id===c.color)||COLORS[2];
              const t = computeCardTotals(c, expenses.filter(e=>e.cardId===c.id), msis.filter(m=>m.cardId===c.id), payments.filter(p=>p.cardId===c.id));
              return (
                <button key={c.id} className="w-row" onClick={()=>onOpenCard(c)}>
                  <span className={`w-chip ${ci.cls}`}/>
                  <span className="w-main"><span className="w-name">{c.name||'Sin nombre'}</span><div className="w-use"><i style={{width:`${Math.min(100,Math.max(0,t.usedPct))}%`}}/></div></span>
                  <span className="w-amt"><b>{fmt0(t.totalToPay)}</b><span>este mes {fmt0(t.thisCycle)}</span></span>
                </button>
              );
            })}
          </div>
        </section>

        {loanRows.length>0 && (
          <section>
            <div className="h2"><span>Préstamos</span><button className="link-btn" onClick={onOpenLoans}>Ver todo</button></div>
            <div className="wallet">
              {loanRows.map(({l,i})=>(
                <button key={l.id} className="w-row" onClick={onOpenLoans}>
                  <span className="w-chip" style={{background:'linear-gradient(135deg,#0f9d6e,#0b7a55)'}}/>
                  <span className="w-main"><span className="w-name">{l.desc}</span><div className="w-use"><i style={{width:`${i.pct}%`,background:'var(--ok)'}}/></div></span>
                  <span className="w-amt"><b>{fmt(i.owed)}</b><span>{i.done} de {i.total} pagos</span></span>
                </button>
              ))}
            </div>
          </section>
        )}
        <button className="more-btn" onClick={()=>setMore(m=>!m)}>{more?'Ocultar desglose':'Ver desglose por mes y categoría'}</button>
        {more && (<>
        {flow.length>1 && (
          <section>
            <div className="h2">A pagar por mes</div>
            <MonthRows items={flow}/>
          </section>
        )}

        {catTotal>0 && (
          <section className="wide">
            <div className="h2">Deuda por categoría</div>
            <div className="donut-card">
              <div className="donut-row">
                <Donut data={catData} total={catTotal} sel={selCat} onSel={setSelCat}/>
                <div className="legend">
                  {catData.map(d=>(
                    <button key={d.label} className="lg-row" style={{opacity:selCat&&selCat!==d.label?.45:1}} onClick={()=>setSelCat(selCat===d.label?null:d.label)}>
                      <span className="lg-dot" style={{background:d.color}}/>
                      <span className="lg-name">{d.label}</span>
                      <span className="lg-pct">{Math.round(d.value/catTotal*100)}%</span>
                    </button>
                  ))}
                </div>
              </div>
              {selCat && catItems[selCat] && (
                <div className="lg-detail">
                  {catItems[selCat].slice().sort((a,b)=>b.amount-a.amount).map((it,i)=>(<div key={i}><span>{it.desc}</span><span>{fmt(it.amount)}</span></div>))}
                </div>
              )}
              {hasAbonos && <div className="bar-note" style={{marginTop:12}}>Ya descontando tus abonos</div>}
            </div>
          </section>
        )}
        </>)}
      </div>
    </>
  );
}

// ─── TARJETA FÍSICA ──────────────────────────────────────────────────────────
function PlasticCard({ card, expenses, msis, payments, onClick, full }) {
  const ci = COLORS.find(c=>c.id===card.color)||COLORS[2];
  const t = computeCardTotals(card, expenses, msis, payments);
  const pct = Math.min(100, Math.max(0, t.usedPct));
  return (
    <div className={`pcard ${ci.cls} ${full?'full':''}`} onClick={onClick} role={onClick?'button':undefined}>
      <div className="pc-top">
        <div className="pc-name">{card.name||'Sin nombre'}</div>
        <div className="pc-month"><b>{fmt0(t.thisCycle)}</b><span>este mes</span></div>
      </div>
      <div className="pc-body">
        <span className="pc-chip"/>
        <div className="pc-debt"><span>Deuda total</span><b>{fmt(t.totalToPay)}</b></div>
        <div className="pc-foot">
          <span className="pc-pill">Corte {card.cutDay||'—'}</span>
          <span className="pc-pill">Pago {card.payDay||'—'}</span>
          <span className="pc-use"><i style={{width:`${pct}%`}}/></span>
          <span className="pc-pct">{Math.round(pct)}%</span>
        </div>
      </div>
    </div>
  );
}

// ─── LÍNEA DEL CICLO: corte, hoy y pago dentro del mes ───────────────────────
function CycleBar({ card }) {
  const dim = new Date(currentYear, currentMonth+1, 0).getDate();
  const cut = Math.min(dim, parseInt(card.cutDay)||1), pay = Math.min(dim, parseInt(card.payDay)||15), td = today.getDate();
  const pos = d => `${(d-1)/(dim-1)*100}%`;
  const cd = daysUntil(parseInt(card.cutDay)||1), pd = daysUntil(parseInt(card.payDay)||15);
  const col = d => d<=3?'var(--bad)':d<=7?'var(--warn)':'var(--ink2)';
  return (
    <div className="cyc">
      <div className="cyc-track">
        <i className="cyc-fill" style={{width:pos(td)}}/>
        <span className="cyc-mk cut" style={{left:pos(cut)}}><em>Corte {cut}</em></span>
        <span className="cyc-mk pay" style={{left:pos(pay)}}><em>Pago {pay}</em></span>
        <span className="cyc-now" style={{left:pos(td)}}/>
      </div>
      <div className="cyc-info">
        <div><span style={{color:col(cd)}}>{dayLabel(cd)}</span>corte</div>
        <div><span style={{color:col(pd)}}>{dayLabel(pd)}</span>pago</div>
      </div>
      {(()=>{ const c0=parseInt(card.cutDay)||1, p0=parseInt(card.payDay)||15; const best=c0>=dim?1:c0+1; const gap=p0>c0?p0-c0:p0+30-c0;
        return <div className="cyc-best">Mejor día para comprar: <b>el {best}</b> · te da ≈ <b>{gap} días</b> para pagarlo.</div>; })()}
    </div>
  );
}

// ─── DETALLE: GASTOS ─────────────────────────────────────────────────────────
function ExpensesTab({ expenses: allExp, cutDay, payDay, onToggle, onEdit, onAdd, onPayCycle }) {
  const cycleItems = allExp.filter(e=>!e.paid && dueMonthsAway(e.date,cutDay,payDay)<=0);
  const cycleTotal = cycleItems.reduce((a,e)=>a+(parseFloat(e.amount)||0),0);
  const [q, setQ] = useState('');
  const qq = q.trim().toLowerCase();
  const expenses = qq ? allExp.filter(e=>`${e.desc||''} ${e.cat||''} ${e.note||''}`.toLowerCase().includes(qq)) : allExp;
  const amt = e => parseFloat(e.amount)||0;
  const byDate = (a,b)=>(b.date||'').localeCompare(a.date||'');
  const unpaid = expenses.filter(e=>!e.paid);
  const thisC = unpaid.filter(e=>dueMonthsAway(e.date,cutDay,payDay)<=0).sort(byDate);
  const nextC = unpaid.filter(e=>dueMonthsAway(e.date,cutDay,payDay)>=1).sort(byDate);
  const paid  = expenses.filter(e=>e.paid).sort(byDate);
  const sum = l => l.reduce((a,e)=>a+amt(e),0);
  const sT=sum(thisC), sN=sum(nextC), sP=sum(paid), all=Math.max(1,sT+sN+sP);
  const dueTag = e => { const a=dueMonthsAway(e.date,cutDay,payDay); if(a<1) return ''; const d=new Date(currentYear,currentMonth+a,1); return ` · paga ${MONTHS[d.getMonth()]}`; };
  const Row = ({e}) => (
    <div className={`item ${e.paid?'done':''}`} onClick={()=>onEdit(e)}>
      <div className="bub">{e.cat.split(' ')[0]}</div>
      <div className="it-main">
        <span className="it-t">{e.desc}</span>
        <span className="it-s">{fmtDateLabel(e.date)} · {e.cat.split(' ').slice(1).join(' ')}{e.paid?'':dueTag(e)}{e.note?` · ${e.note}`:''}</span>
      </div>
      <span className="it-amt">{fmt(e.amount)}</span>
      <CheckBtn checked={e.paid} onToggle={()=>onToggle(e.id)}/>
    </div>
  );
  const Sec = ({title,total,items,color}) => items.length===0 ? null : (
    <>
      <div className="sec-h"><span><i style={{background:color}}/>{title}</span><b>{fmt(total)}</b></div>
      <div className="list">{items.map(e=><Row key={e.id} e={e}/>)}</div>
    </>
  );
  return (
    <>
      <button className="add-row" onClick={onAdd}><IconPlus/>Agregar gasto</button>
      {allExp.length>6 && <div className="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg><input value={q} onChange={e=>setQ(e.target.value)} placeholder="Buscar gasto"/></div>}
      {expenses.length===0
        ? <div className="empty"><div className="icon">🧾</div><b>{qq?'Sin resultados':'Sin gastos'}</b>{qq?'Prueba con otro nombre.':'Los gastos de esta tarjeta aparecerán aquí.'}</div>
        : <>
            <div className="stackbar">
              <div className="sb-bar">
                <i style={{flex:sT/all,background:'var(--bad)'}}/><i style={{flex:sN/all,background:'var(--brand)'}}/><i style={{flex:sP/all,background:'var(--ok)'}}/>
              </div>
              <div className="sb-leg">
                <span><i style={{background:'var(--bad)'}}/>Este ciclo</span>
                <span><i style={{background:'var(--brand)'}}/>Siguiente</span>
                <span><i style={{background:'var(--ok)'}}/>Pagado</span>
              </div>
            </div>
            <Sec title="Este ciclo" total={sT} items={thisC} color="var(--bad)"/>
            {!qq && cycleItems.length>0 && onPayCycle && (
              <button className="pay-cycle" onClick={()=>onPayCycle(cycleItems)}>
                <span><b>Ya pagué este ciclo</b><small>Marcar {cycleItems.length} {cycleItems.length===1?'gasto':'gastos'} como pagados · {fmt(cycleTotal)}</small></span>
                <span className="chk"><IconCheck/></span>
              </button>
            )}
            <Sec title="Siguiente ciclo" total={sN} items={nextC} color="var(--brand)"/>
            <Sec title="Pagados" total={sP} items={paid} color="var(--ok)"/>
          </>}
    </>
  );
}

// ─── DETALLE: MSI ────────────────────────────────────────────────────────────
function MsiTab({ msis, onTogglePaid, onEdit, onAdd }) {
  return (
    <>
      <button className="add-row" onClick={onAdd}><IconPlus/>Agregar MSI</button>
      {!msis.length && <div className="empty"><div className="icon">📅</div><b>Sin MSI</b>Las compras a meses sin intereses aparecerán aquí.</div>}
      {msis.map(item=>{
        const total=parseInt(item.total)||0, monthly=parseFloat(item.monthly)||0, paidKeys=item.paid||[];
        const remaining = Math.max(0,total-paidKeys.length);
        const sM=parseInt(item.startMonth)||0, sY=parseInt(item.startYear)||currentYear;
        const eIdx=Math.max(0,total-1), eMi=(sM+eIdx)%12, eYi=sY+Math.floor((sM+eIdx)/12);
        const curKey = monthKey(currentYear,currentMonth);
        const months = Array.from({length:total},(_,i)=>{
          const mi=(sM+i)%12, yi=sY+Math.floor((sM+i)/12);
          return { num:i+1, key:monthKey(yi,mi), label:MONTHS[mi], yr:yi };
        });
        return (
          <div key={item.id} className="msi">
            <div className="msi-top">
              <Ring pct={total?paidKeys.length/total:0} size={64} stroke={8} color="var(--ok)"><span style={{fontSize:14}}>{paidKeys.length}/{total}</span></Ring>
              <div className="msi-info">
                <div className="msi-t">{item.desc}</div>
                <div className="msi-s">{fmt(monthly)} al mes · termina {MONTHS[eMi]} {eYi}</div>
              </div>
              <button className="pill-btn" onClick={()=>onEdit(item)}>{remaining===0?'✓ Pagado':'Editar'}</button>
            </div>
            <div className="msi-nums">
              <div><b>{fmt0(paidKeys.length*monthly)}</b><span>Pagado</span></div>
              <div><b style={{color:remaining?'var(--ink)':'var(--ok)'}}>{fmt0(remaining*monthly)}</b><span>Por pagar</span></div>
              <div><b>{fmt0(total*monthly)}</b><span>Total</span></div>
            </div>
            <div className="cuo-grid">
              {months.map(m=>{
                const isPaid = paidKeys.includes(m.key);
                return (
                  <button key={m.num} className={`cuo ${isPaid?'on':''} ${m.key===curKey?'cur':''}`}
                    onClick={isPaid?undefined:()=>onTogglePaid(item.id,m.key)}
                    title={isPaid?`Cuota ${m.num} · pagada`:`Cuota ${m.num} · toca para marcar pagada`} aria-label={`Cuota ${m.num} ${m.label} ${m.yr}`}>
                    <small>{m.num}</small>{m.label}{m.yr!==currentYear?<small>{String(m.yr).slice(2)}</small>:null}
                  </button>
                );
              })}
            </div>
          </div>
        );
      })}
    </>
  );
}
