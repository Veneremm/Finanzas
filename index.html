// ─── DETALLE DE TARJETA ──────────────────────────────────────────────────────
function CardDetail({ card, expenses, msis, payments, onBack, onEditCard, onPayCycle,
    onToggleExpense, onEditExpense, onAddExpense, onToggleMsiPaid, onEditMsi, onAddMsi, onEditPayment, onAddPayment }) {
  const [activeTab, setActiveTab] = useState('gastos');
  const { realAvail, usedPct, totalToPay, totalCredit, extension, thisCycle } = computeCardTotals(card, expenses, msis, payments);
  const nextMonths = cardMonthsToPay(card, expenses, msis);
  const sched = useMemo(()=>cardSchedule(card, expenses, msis, payments), [card, expenses, msis, payments]);
  const tabs = [['gastos','Gastos',expenses.length],['msi','MSI',msis.length],['categorias','Categorías',null]];
  return (
    <>
      <div className="detail-top">
        <button className="pill-link" onClick={onBack}><IconChevronLeft/>Tarjetas</button>
        <button className="pill-link solo" onClick={()=>onEditCard(card)}>Editar</button>
      </div>
      <div className="detail-wrap">
        <div className="banner-wrap"><PlasticCard card={card} expenses={expenses} msis={msis} payments={payments} full/></div>

        <div className="avail">
          <div className="avail-row">
            <div><b>{fmt(realAvail)}</b><span>Disponible</span></div>
            <div><b>{fmt0(totalCredit+extension)}</b><span>Crédito total</span></div>
          </div>
          <ProgressBar pct={usedPct}/>
          <div className="bar-note">Usado {Math.round(usedPct)}%</div>
          <div className="divider"/>
          <CycleBar card={card}/>
        </div>

        {(() => {
          const trio = (flat) => (
            <div className={`trio ${flat?'flat':''}`}>
              <div><b>{fmt0(thisCycle)}</b><span>Este mes</span></div>
              {nextMonths.map((m,i)=>(<div key={i}><b>{fmt0(m.amount)}</b><span>{m.label}</span></div>))}
            </div>
          );
          return totalToPay>0.005
            ? <div className="route-card"><RouteChart sched={sched} total={totalToPay} tone="card"/>{trio(true)}</div>
            : trio(false);
        })()}

        <div className="utabs">
          {tabs.map(([k,l,n])=>(
            <button key={k} className={activeTab===k?'on':''} onClick={()=>setActiveTab(k)}>{l}{n!==null && n>0 && <em>{n}</em>}</button>
          ))}
        </div>

        <div style={{marginTop:10}}>
          {activeTab==='gastos'     && <ExpensesTab expenses={expenses} cutDay={card.cutDay} payDay={card.payDay} onToggle={onToggleExpense} onEdit={exp=>onEditExpense(exp,card.id)} onAdd={()=>onAddExpense(card.id)} onPayCycle={onPayCycle}/>}
          {activeTab==='msi'        && <MsiTab msis={msis} onTogglePaid={onToggleMsiPaid} onEdit={item=>onEditMsi(item,card.id)} onAdd={()=>onAddMsi(card.id)}/>}
          {activeTab==='categorias' && <CategoriesTab expenses={expenses}/>}
        </div>
      </div>
    </>
  );
}

  const selCard = (cards||[]).find(c=>c.id===cid);
  const cutDay = selCard ? selCard.cutDay : cutDay0, payDay = selCard ? selCard.payDay : payDay0;
  const set = k => e => setF(p=>({...p,[k]:e.target.value}));
  const away = dueMonthsAway(f.date, cutDay, payDay);
  const dueD = new Date(currentYear, currentMonth + Math.max(0,away), 1);
  const dueLabel = away<=0 ? 'este mes' : `${MONTHS[dueD.getMonth()]}${dueD.getFullYear()!==currentYear?` '${String(dueD.getFullYear()).slice(2)}`:''}`;
  const amt = parseFloat(f.amount)||0;

  const t = isoLocal(new Date()), y = isoLocal(new Date(Date.now()-86400000));
  const customDate = f.date!==t && f.date!==y;
  const recents = useMemo(()=>{

    [...(history||[])].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).forEach(e=>{
      const k=(e.desc||'').trim().toLowerCase(); if (!k || seen.has(k)) return; seen.add(k); out.push(e);
    });

  },[history]);
  const setName = v => setF(p=>{
    const m = (history||[]).find(e=>(e.desc||'').trim().toLowerCase()===v.trim().toLowerCase());

        )}
        <AmountBox value={f.amount} onChange={set('amount')}/>
        {!initial && cards && cards.length>1 && (
          <div className="xp-row wrap" style={{marginBottom:6}}>
            {cards.map(c=>{ const ci=COLORS.find(x=>x.id===c.color)||COLORS[2];
              return (<button type="button" key={c.id} className={`xp-chip ${cid===c.id?'on':''}`} onClick={()=>setCid(c.id)}><i className={ci.cls}/>{c.name||'Sin nombre'}</button>);
            })}
          </div>
        )}
        <div className="xp-label">Categoría</div>
        <div className="xp-cats">
          {CATS.map(c=>{ const p=c.split(' '); return (
            <button type="button" key={c} className={`xp-cat ${f.cat===c?'on':''}`} onClick={()=>setF(s=>({...s,cat:c}))}><span>{p[0]}</span>{p.slice(1).join(' ')}</button>

          <button type="button" className="xp-cat edit" onClick={onCats}>✎ Editar</button>

        <div className="xp-label">Fecha</div>

}

// ─── FORMULARIO DE MSI ───────────────────────────────────────────────────────
function MsiForm({ initial, onSave, onDelete, onClose }) {
  const blank = { desc:'', monthly:'', total:'', startMonth:currentMonth, startYear:currentYear, paid:[], paidCount:'' };
  const [f, setF] = useState(initial
    ? { ...initial, monthly: initial.monthly===0?'':initial.monthly, total: initial.total===0?'':initial.total, paidCount:'' }
    : blank);
  const [mode, setMode] = useState(initial ? 'monthly' : 'price');   // qué dato tienes: precio total o cuota
  const [price, setPrice] = useState('');
  const set = k => e => setF(p=>({...p,[k]:e.target.value}));
  const totalNum  = parseInt(f.total)||0;
  const paidNum   = Math.min(parseInt(f.paidCount)||0, totalNum);
  const isEditing = !!initial;
  const monthlyNum = mode==='price'
    ? (totalNum>0 ? Math.round(((parseFloat(price)||0)/totalNum)*100)/100 : 0)
    : (parseFloat(f.monthly)||0);
  const sMv = parseInt(f.startMonth)||0, sYv = parseInt(f.startYear)||currentYear;
  const lastIdx = Math.max(0, totalNum-1);
  const lMi = (sMv+lastIdx)%12, lYi = sYv + Math.floor((sMv+lastIdx)/12);
  const nextM = new Date(currentYear, currentMonth+1, 1);
  const startIs = (m,yv) => sMv===m && sYv===yv;
  const setStart = (m,yv) => setF(p=>({...p,startMonth:m,startYear:yv}));
  const customStart = !startIs(currentMonth,currentYear) && !startIs(nextM.getMonth(),nextM.getFullYear());
  const OPTS = [3,6,9,12,18,24];
  const switchMode = m => {
    if (m===mode) return;
    if (m==='price' && !price && monthlyNum>0 && totalNum>0) setPrice(String(Math.round(monthlyNum*totalNum*100)/100));
    if (m==='monthly' && monthlyNum>0) setF(p=>({...p,monthly:monthlyNum}));
    setMode(m);
  };
  const ready = !!f.desc && monthlyNum>0 && totalNum>0;
  return (
    <Sheet title={initial?'Editar MSI':'Nuevo MSI'} onClose={onClose}>
      <div className="sheet-body">
        <input className="xp-name" value={f.desc} onChange={set('desc')} placeholder="¿Qué compraste? ej. MacBook" autoFocus={!initial}/>

        <div className="seg" style={{marginTop:16}}>
          <button type="button" className={mode==='price'?'on':''} onClick={()=>switchMode('price')}>Precio total</button>
          <button type="button" className={mode==='monthly'?'on':''} onClick={()=>switchMode('monthly')}>Cuota mensual</button>
        </div>
        <div style={{marginTop:14}}>
          <AmountBox value={mode==='price'?price:f.monthly} onChange={e=>mode==='price'?setPrice(e.target.value):set('monthly')(e)}/>
        </div>

        <div className="xp-label" style={{marginTop:4}}>¿A cuántos meses?</div>
        <div className="mo-grid">
          {OPTS.map(n=>(<button type="button" key={n} className={totalNum===n?'on':''} onClick={()=>setF(p=>({...p,total:n}))}><b className="num">{n}</b><span>meses</span></button>))}
          <label className={`other ${totalNum>0 && !OPTS.includes(totalNum)?'on':''}`}>
            <input type="number" inputMode="numeric" min="1" max="60" placeholder="Otro" value={OPTS.includes(totalNum)?'':f.total} onChange={set('total')}/>
          </label>
        </div>

        <div className={`msi-res ${ready?'':'idle'}`}>
          {ready ? (<>
            <div className="mr-main"><b className="num">{fmt(monthlyNum)}</b><span>al mes</span></div>
            <div className="mr-sub">{totalNum} cuotas · total {fmt(monthlyNum*totalNum)}</div>
            <div className="mr-line"><span>{MONTHS[sMv]} {sYv}</span><i/><span>{MONTHS[lMi]} {lYi}</span></div>
          </>) : <div className="mr-sub">Escribe el monto y los meses para ver tu cuota</div>}
        </div>

        <div className="xp-label">¿Cuándo es la primera cuota?</div>
        <div className="xp-row">
          <button type="button" className={`xp-chip ${startIs(currentMonth,currentYear)?'on':''}`} onClick={()=>setStart(currentMonth,currentYear)}>Este mes</button>
          <button type="button" className={`xp-chip ${startIs(nextM.getMonth(),nextM.getFullYear())?'on':''}`} onClick={()=>setStart(nextM.getMonth(),nextM.getFullYear())}>{MONTHS[nextM.getMonth()]}</button>
          <span className={`xp-chip sel ${customStart?'on':''}`}>
            <select value={sMv} onChange={e=>setStart(parseInt(e.target.value),sYv)}>{MONTHS.map((m,i)=><option key={i} value={i}>{m}</option>)}</select>
            <input type="number" min="2020" max="2035" value={f.startYear} onChange={set('startYear')}/>
          </span>
        </div>

        {!isEditing && (
          <div className="paid-row">
            <span>Cuotas que ya pagaste</span>
            <div className="stepper mini">
              <button type="button" onClick={()=>setF(p=>({...p,paidCount:Math.max(0,(parseInt(p.paidCount)||0)-1)}))} aria-label="Menos">−</button>
              <b className="num">{paidNum}</b>
              <button type="button" onClick={()=>setF(p=>({...p,paidCount:Math.min(totalNum||60,(parseInt(p.paidCount)||0)+1)}))} aria-label="Más">+</button>
            </div>
          </div>
        )}
      </div>
      <div className="sheet-actions">
        {initial && <button className="btn-danger" onClick={()=>{onDelete(initial.id);onClose();}}>Eliminar</button>}
        <button className="btn-secondary" onClick={onClose}>Cancelar</button>
        <button className={`btn-primary ${ready?'':'off'}`} onClick={()=>{
          if (!ready) return;
          const keyAt = (i)=>{
            const mi=(parseInt(f.startMonth)+i)%12;
            const yi=(parseInt(f.startYear)||currentYear)+Math.floor((parseInt(f.startMonth)+i)/12);
            return monthKey(yi,mi);
          };
          const paidN = isEditing
            ? Math.min((parseInt(initial.paidCount)|| (initial.paid? initial.paid.length:0)), totalNum)
            : paidNum;
          const prePaid = Array.from({length: Math.max(0,paidN)}, (_,i)=>keyAt(i));
          onSave({...f, monthly: monthlyNum, paid: prePaid, paidCount: paidN});
          onClose();
        }}>Guardar</button>
      </div>
    </Sheet>
  );
}

const compactN = n => new Intl.NumberFormat('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Math.abs(n||0));

function CommitmentsScreen({ commits, cards, expenses, msis, payments, incomes, cash, onEditCash, onEdit, onEditIncome, onTogglePaid, onToggleReceived, onOpenCard, onNotify, selMonth, setSelMonth }) {
  const [view, setView] = useStorage('fp_calview', 'days');
  const [showPast, setShowPast] = useState(false);
  const [leaving, setLeaving] = useState({});
  const [selDay, setSelDay] = useState(null);
  const [selQ, setSelQ] = useState(null);
  const ribRef = useRef(null);
  const [y, mIdx] = selMonth.split('-').map(Number);
  const dim = new Date(y, mIdx+1, 0).getDate();
  const isCurMonth = selMonth === monthKey(currentYear, currentMonth);
  const todayD = today.getDate();
  const k = (y*12 + mIdx) - (currentYear*12 + currentMonth);
  const activeIn = (sm, mths) => {
    const endDate = new Date(parseInt(sm.split('-')[0]), parseInt(sm.split('-')[1])+(parseInt(mths)||1)-1, 1);
    return sm<=selMonth && selMonth<=monthKey(endDate.getFullYear(), endDate.getMonth());
  };
  const activeCommits = commits.filter(c=> activeIn(monthKey(parseInt(c.year),parseInt(c.month)), c.repeat));
  const activeIncomes = (incomes||[]).filter(c=> activeIn(monthKey(parseInt(c.year),parseInt(c.month)), c.repeat));
  function cardAmountForMonth(cd){
    let amt=0;
    (msis||[]).filter(m=>m.cardId===cd.id).forEach(m=>{
      const total=parseInt(m.total)||0, monthly=parseFloat(m.monthly)||0, paid=m.paid||[];
      for(let i=0;i<total;i++){
        const mi=(parseInt(m.startMonth)+i)%12;
        const yi=(parseInt(m.startYear)||currentYear)+Math.floor((parseInt(m.startMonth)+i)/12);
        const ck=monthKey(yi,mi);
        if(ck===selMonth && !paid.includes(ck)) amt+=monthly;
      }
    });
    (expenses||[]).filter(e=>e.cardId===cd.id && !e.paid).forEach(e=>{
      if(dueMonthsAway(e.date, cd.cutDay, cd.payDay)===k) amt+=parseFloat(e.amount)||0;
    });
    return amt;
  }
  const events = [];
  activeCommits.forEach(c=>events.push({ day:Math.min(dim,parseInt(c.day)||1), kind:'commit', sign:-1, emoji:(c.cat||'📦 Otro').split(' ')[0], label:c.desc,
    sub:c.isLoan?(c.lender||'Préstamo'):((c.cat||'').split(' ').slice(1).join(' ')||'Pago fijo'), amount:parseFloat(c.amount)||0, done:(c.paidMonths||[]).includes(selMonth), ref:c }));
  (cards||[]).forEach(cd=>{ const a=cardAmountForMonth(cd); if (a>0) events.push({ day:Math.min(dim,parseInt(cd.payDay)||1), kind:'card', sign:-1, emoji:'💳', color:(COLORS.find(x=>x.id===cd.color)||COLORS[2]).hex,
    label:`Pago ${cd.name||'tarjeta'}`, sub:'Pago de tarjeta', amount:a, done:false, ref:cd }); });
  activeIncomes.forEach(c=>events.push({ day:Math.min(dim,parseInt(c.day)||1), kind:'income', sign:1, emoji:'💰', label:c.desc,
    sub:'Ingreso', amount:parseFloat(c.amount)||0, done:(c.receivedMonths||[]).includes(selMonth), ref:c }));

  const cashVal = parseFloat(cash)||0;
  const showBal = isCurMonth && cashVal>0;
  const sortFn = (a,b)=> a.day-b.day || b.sign-a.sign;
  const pending = events.filter(e=>!e.done).sort(sortFn);
  const doneList = events.filter(e=>e.done).sort(sortFn);
  const payTotal = pending.filter(e=>e.sign<0).reduce((a,e)=>a+e.amount,0);
  const incTotal = pending.filter(e=>e.sign>0).reduce((a,e)=>a+e.amount,0);
  const closing = (showBal?cashVal:0) + incTotal - payTotal;

  // por día (solo lo pendiente: lo marcado desaparece del calendario)
  const dayPay = {}, dayInc = {}, dayOver = {};
  pending.forEach(e=>{
    if (e.sign<0) { dayPay[e.day]=(dayPay[e.day]||0)+e.amount; if (isCurMonth && e.day<todayD) dayOver[e.day]=true; }
    else dayInc[e.day]=(dayInc[e.day]||0)+e.amount;
  });
  const maxPay = Math.max(1, ...Object.values(dayPay));

  // quincenas
  const qs = [{n:1,from:1,to:Math.min(15,dim)},{n:2,from:16,to:dim}].map(q=>{
    const l = pending.filter(e=>e.day>=q.from && e.day<=q.to);
    const pay = l.filter(e=>e.sign<0).reduce((a,e)=>a+e.amount,0), inc = l.filter(e=>e.sign>0).reduce((a,e)=>a+e.amount,0);
    return { ...q, pay, inc, net:inc-pay, count:l.length, cur: isCurMonth && todayD>=q.from && todayD<=q.to };
  });

  const inFilter = e => selDay ? e.day===selDay : selQ ? (e.day>=qs[selQ-1].from && e.day<=qs[selQ-1].to) : true;
  const fPending = pending.filter(inFilter), fDone = doneList.filter(inFilter);
  const MONTHS_FULL = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const WD = ['dom','lun','mar','mié','jue','vie','sáb'];
  const WDFULL = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const filterLabel = selDay ? `${WDFULL[new Date(y,mIdx,selDay).getDay()]} ${selDay}` : selQ ? `${selQ===1?'1ª':'2ª'} quincena · ${qs[selQ-1].from}–${qs[selQ-1].to}` : null;

  const navMonth = delta => { const d=new Date(y, mIdx+delta, 1); setSelMonth(monthKey(d.getFullYear(), d.getMonth())); setShowPast(false); setSelDay(null); setSelQ(null); };
  const goToday = () => { setSelMonth(monthKey(currentYear, currentMonth)); setSelDay(null); setSelQ(null); };
  const pickDay = d => { setSelQ(null); setSelDay(selDay===d?null:d); };
  const pickQ = n => { setSelDay(null); setSelQ(selQ===n?null:n); };

  // centrar la tira en hoy (o en el día elegido)
  useEffect(()=>{
    const el = ribRef.current; if (!el) return;
    const target = selDay || (isCurMonth ? todayD : 1);
    const c = el.querySelector(`[data-d="${target}"]`); if (!c) return;
    el.scrollTo({ left: Math.max(0, c.offsetLeft - el.clientWidth/2 + c.offsetWidth/2), behavior: 'auto' });
  }, [selMonth, view]);

  const rel = e => { if (!isCurMonth) return `día ${e.day}`; const d=e.day-todayD; return d<0?`atrasado ${-d} ${-d===1?'día':'días'}`:d===0?'hoy':d===1?'mañana':`en ${d} días`; };
  const toggle = it => {
    const isInc = it.kind==='income', fn = isInc ? onToggleReceived : onTogglePaid;
    if (it.done) { fn(it.ref.id, selMonth); return; }
    const key = it.kind+it.ref.id;
    setLeaving(l=>({...l,[key]:true}));
    setTimeout(()=>{
      fn(it.ref.id, selMonth);
      setLeaving(l=>{ const n={...l}; delete n[key]; return n; });
      onNotify && onNotify(`${it.label} · ${isInc?'recibido':'pagado'}`, ()=>fn(it.ref.id, selMonth));
    }, 230);
  };

  const Due = ({it}) => {
    const isInc = it.kind==='income';
    const overdue = isCurMonth && !it.done && it.day<todayD;
    const soon = !it.done && !isInc && isCurMonth && it.day>=todayD && it.day-todayD<=3;
    const editable = it.kind==='commit' || isInc;
    const openable = it.kind==='card' && onOpenCard;
    const tone = isInc?'ok':(overdue||soon)?'bad':'';
    const act = editable ? ()=>(isInc?onEditIncome(it.ref):onEdit(it.ref)) : openable ? ()=>onOpenCard(it.ref) : undefined;
    return (
      <div className={`due ${tone} ${it.done?'done':''} ${leaving[it.kind+it.ref.id]?'leaving':''}`} style={it.color?{'--ac':it.color}:null}>
        <div className="due-d"><b className="num">{it.day}</b><span>{WD[new Date(y,mIdx,it.day).getDay()]}</span></div>
        <div className="it-main" style={{cursor:act?'pointer':'default'}} onClick={act}>
          <span className="it-t">{it.emoji} {it.label}</span>
          <span className={`it-s ${(overdue||soon)?'hot':''}`}>{it.done?(isInc?'recibido':'pagado'):rel(it)} · {it.sub}</span>
        </div>
        <span className="it-amt" style={{color:isInc?'var(--ok)':'var(--ink)'}}>{isInc?'+':''}{fmt(it.amount)}</span>
        {editable ? <CheckBtn checked={it.done} onToggle={()=>toggle(it)}/> : <span style={{width:6}}/>}
      </div>
    );
  };
  const net = l => l.reduce((a,e)=>a+e.sign*e.amount,0);
  const buckets = filterLabel ? [{ t:filterLabel, items:fPending }]
    : isCurMonth ? [
        { t:'Atrasados',    items:fPending.filter(e=>e.day<todayD), hot:true },
        { t:'Esta semana',  items:fPending.filter(e=>e.day>=todayD && e.day<=todayD+6) },
        { t:'Más adelante', items:fPending.filter(e=>e.day>todayD+6) },
      ] : [{ t: k<0?'Sin marcar':'Del mes', items:fPending }];

  // celdas
  const offset = (new Date(y, mIdx, 1).getDay()+6)%7;
  const days = Array.from({length:dim},(_,i)=>i+1);
  const cellInfo = d => {
    const pay=dayPay[d]||0, inc=dayInc[d]||0, over=!!dayOver[d];
    return { pay, inc, over, isToday:isCurMonth&&d===todayD, isSel:selDay===d, past:isCurMonth&&d<todayD && !over };
  };

  return (
    <div className="page cal-wrap">
      <div className="cal-head">
        <div>
          <div className="cal-month">{MONTHS_FULL[mIdx]} <span>{y}</span></div>
          <div className="cal-sub">
            <span>Por pagar <b>{fmt0(payTotal)}</b></span>
            <span>Por recibir <b className="ok">{fmt0(incTotal)}</b></span>
          </div>
        </div>
        <div className="cal-nav" style={{display:'flex',gap:8,alignItems:'center'}}>
          {!isCurMonth && <button className="today-btn" onClick={goToday}>Hoy</button>}
          <button className="round-btn" onClick={()=>navMonth(-1)} aria-label="Mes anterior"><IconChevronLeft/></button>
          <button className="round-btn" onClick={()=>navMonth(1)} aria-label="Mes siguiente"><IconChevronRight/></button>
        </div>
      </div>
      {showBal && (
        <button className={`cierre ${closing<0?'bad':''}`} onClick={onEditCash}>
          <span>Con tu disponible de {fmt0(cashVal)}, al cierre del mes</span>
          <b className="num">{closing<0?`te faltan ${fmt0(-closing)}`:`te sobran ${fmt0(closing)}`}</b>
        </button>
      )}
      {isCurMonth && !showBal && <button className="cierre add" onClick={onEditCash}><span>Agrega tu dinero disponible para ver si te alcanza</span><b>＋</b></button>}

      <div className="qns">
        {qs.map(q=>(
          <button key={q.n} className={`qn ${selQ===q.n?'sel':''} ${q.cur?'cur':''} ${q.count===0?'empty':''}`} onClick={()=>pickQ(q.n)} aria-pressed={selQ===q.n}>
            <div className="qn-h"><b>{q.n===1?'1ª':'2ª'} quincena</b><span>{q.from}–{q.to}</span></div>
            {q.count===0
              ? <div className="qn-net">Sin pendientes</div>
              : <><div className={`qn-net num ${q.net<0?'neg':'pos'}`}>{q.net<0?'−':'+'}{fmt0(Math.abs(q.net))}</div>
                  <div className="qn-sub"><span>−{compactN(q.pay)}</span><span>+{compactN(q.inc)}</span></div></>}
          </button>
        ))}
      </div>

      <div className="vseg">
        <button className={view==='days'?'on':''} onClick={()=>setView('days')}>Días</button>
        <button className={view==='month'?'on':''} onClick={()=>setView('month')}>Mes</button>
      </div>

      {view==='days' ? (
        <div className="ribbon" ref={ribRef}>
          {days.map(d=>{
            const c = cellInfo(d), wd = new Date(y,mIdx,d).getDay();
            return (
              <button key={d} data-d={d} className={`rb ${c.isToday?'today':''} ${c.isSel?'sel':''} ${c.past?'past':''} ${wd===0||wd===6?'we':''}`} onClick={()=>pickDay(d)} aria-label={`Día ${d}`}>
                <small>{WD[wd]}</small>
                <b className="num">{d}</b>
                <span className={`rb-amt ${c.pay>0?(c.over?'bad':'pay'):c.inc>0?'inc':'none'}`}>{c.pay>0?compactN(c.pay):c.inc>0?'+'+compactN(c.inc):'·'}</span>
                {c.pay>0 && <i className="rb-bar"><s className={c.over?'bad':''} style={{height:`${Math.max(18,c.pay/maxPay*100)}%`}}/></i>}
              </button>
            );
          })}
        </div>
      ) : (
        <div className="mbox">
          <div className="mg">
            {['L','M','M','J','V','S','D'].map((w,i)=><div key={i} className="mg-w">{w}</div>)}
            {Array.from({length:offset},(_,i)=><div key={'b'+i}/>)}
            {days.map(d=>{
              const c = cellInfo(d), h = c.pay>0 ? .18+.82*(c.pay/maxPay) : 0;
              return (
                <button key={d} className={`mg-d ${h>.55?'hot':''} ${c.over?'over':''} ${c.isToday?'today':''} ${c.isSel?'sel':''} ${c.past?'past':''}`} style={h>0?{'--h':h}:null} onClick={()=>pickDay(d)} aria-label={`Día ${d}`}>
                  <b className="num">{d}</b>
                  <span>{c.pay>0?compactN(c.pay):c.inc>0?'+'+compactN(c.inc):''}</span>
                  {c.inc>0 && c.pay>0 && <i/>}
                </button>
              );
            })}
          </div>
          <div className="cal-legend"><span><i/>Pagos (más oscuro = más)</span><span><i className="g"/>Ingreso</span><span><i className="m"/>Hoy</span></div>
        </div>
      )}

      {filterLabel && <div className="filt"><span>{filterLabel}{fPending.length>0 && <b className="num">{net(fPending)>=0?'+':'−'}{fmt0(Math.abs(net(fPending)))}</b>}</span><button onClick={()=>{setSelDay(null);setSelQ(null);}}>Ver todo el mes ✕</button></div>}

      {buckets.map(b=> b.items.length===0 ? null : (
        <div key={b.t}>
          {!filterLabel && <div className={`sec-h ${b.hot?'hot':''}`}><span>{b.t}<em>{b.items.length}</em></span><b>{net(b.items)>=0?'+':'−'}{fmt0(Math.abs(net(b.items)))}</b></div>}
          <div className="list" style={{margin:filterLabel?'10px 0 0':0}}>{b.items.map(it=><Due key={it.kind+it.ref.id} it={it}/>)}</div>
        </div>
      ))}
      {fPending.length===0 && <div className="empty"><div className="icon">{filterLabel?'🌤️':'✅'}</div><b>{filterLabel?'Nada pendiente aquí':'Nada pendiente'}</b>{filterLabel?'Ese día o quincena está libre.':events.length?'Ya marcaste todo como hecho este mes.':'Sin pagos ni ingresos este mes.'}</div>}

      {fDone.length>0 && (<>
        <button className="tl-past" onClick={()=>setShowPast(s=>!s)} aria-expanded={showPast}>
          Hechos · {fDone.length}<span className={showPast?'open':''}><IconChevronRight/></span>
        </button>
        {showPast && <div className="list" style={{margin:'8px 0 0'}}>{fDone.map(it=><Due key={'d'+it.kind+it.ref.id} it={it}/>)}</div>}
      </>)}
    </div>
  );
}

// ─── GASTOS: análisis, presupuestos y movimientos ────────────────────────────
const monthCatSpend = (expenses, key) => {
  const map = {};
  (expenses||[]).forEach(e=>{ if((e.date||'').slice(0,7)===key){ const c=e.cat||'📦 Otro'; map[c]=(map[c]||0)+(parseFloat(e.amount)||0); } });
  return map;
};

function BudgetSheet({ cats, budgets, spent, onSave, onClose }) {
  const [vals, setVals] = useState(()=>{ const o={}; cats.forEach(c=>{ o[c]=budgets[c]?String(budgets[c]):''; }); return o; });
  return (
    <Sheet title="Presupuesto mensual" onClose={onClose}>
      <div className="set-s" style={{marginBottom:12}}>Pon un límite por categoría. Déjalo vacío si no quieres controlarla.</div>
      <div className="bud-list">
        {cats.map(c=>{
          const p=c.split(' ');
          return (
            <label key={c} className="bud-row">
              <span className="bub">{p[0]}</span>
              <span className="bud-n">{p.slice(1).join(' ')}<small>Este mes: {fmt(spent[c]||0)}</small></span>
              <span className="bud-in"><i>$</i><input type="number" inputMode="decimal" placeholder="0.00" value={vals[c]} onChange={e=>setVals(v=>({...v,[c]:e.target.value}))}/></span>
            </label>
          );
        })}
      </div>
      <div className="btn-row" style={{marginTop:16}}>
        <button className="btn-primary" onClick={()=>{ const o={}; cats.forEach(c=>{ const n=parseFloat(vals[c]); if(n>0) o[c]=n; }); onSave(o); onClose(); }}>Guardar presupuesto</button>
      </div>
    </Sheet>
  );
}

function InsightsScreen({ expenses, cards, cats, budgets, setBudgets, onEditExpense }) {
  const [off, setOff] = useState(0);
  const [q, setQ] = useState('');
  const [budOpen, setBudOpen] = useState(false);
  const amt = e => parseFloat(e.amount)||0;
  const base = new Date(currentYear, currentMonth - off, 1);
  const mk = d => monthKey(d.getFullYear(), d.getMonth()+1);
  const selKey = mk(base);
  const series = [];
  for (let i=5;i>=0;i--) {
    const d = new Date(base.getFullYear(), base.getMonth()-i, 1), k = mk(d);
    series.push({ k, d, label: MONTHS[d.getMonth()], total: expenses.filter(e=>(e.date||'').slice(0,7)===k).reduce((a,e)=>a+amt(e),0), off: off+i });
  }
  const sel = series[5], prev = series[4];
  const maxV = Math.max(1, ...series.map(s=>s.total));
  const delta = sel.total - prev.total;
  const dim = new Date(base.getFullYear(), base.getMonth()+1, 0).getDate();
  const isCur = off===0, dayN = isCur ? today.getDate() : dim;
  const perDay = sel.total / Math.max(1,dayN);
  const proj = isCur ? perDay*dim : null;
  const spent = monthCatSpend(expenses, selKey);
  const catRows = Array.from(new Set([...Object.keys(spent), ...Object.keys(budgets).filter(c=>cats.includes(c))]))
    .map(c=>({ c, v:spent[c]||0, b:budgets[c]||0 })).sort((a,b)=>b.v-a.v);
  const budTotal = catRows.reduce((a,r)=>a+r.b,0), budSpent = catRows.filter(r=>r.b>0).reduce((a,r)=>a+r.v,0);
  const mExp = expenses.filter(e=>(e.date||'').slice(0,7)===selKey);
  const qq = q.trim().toLowerCase();
  const list = (qq ? mExp.filter(e=>`${e.desc||''} ${e.cat||''} ${e.note||''}`.toLowerCase().includes(qq)) : mExp).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const groups = []; list.forEach(e=>{ const g=groups[groups.length-1]; if(g&&g.date===e.date) g.items.push(e); else groups.push({date:e.date, items:[e]}); });
  const biggest = mExp.reduce((m,e)=>amt(e)>(m?amt(m):0)?e:m, null);
  const cardName = id => (cards.find(c=>c.id===id)||{}).name || '';
  const monthName = base.toLocaleDateString('es-MX',{month:'long',year:'numeric'});
  const barColor = r => r.b<=0 ? 'var(--brand)' : r.v>r.b ? 'var(--bad)' : r.v>=r.b*.8 ? 'var(--warn)' : 'var(--ok)';

  return (
    <div className="ins">
      <div className="cal-nav" style={{marginBottom:12}}>
        <button className="round-btn" onClick={()=>setOff(o=>o+1)} aria-label="Mes anterior">‹</button>
        <div className="cal-title">{monthName.charAt(0).toUpperCase()+monthName.slice(1).replace(' de ',' ')}</div>
        <button className="round-btn" disabled={off===0} style={{opacity:off===0?.35:1}} onClick={()=>setOff(o=>Math.max(0,o-1))} aria-label="Mes siguiente">›</button>
      </div>

      <section className="ins-hero">
        <div className="k">Gastado en el mes</div>
        <div className="v num">{fmt(sel.total)}</div>
        <div className={`ins-delta ${delta>0?'up':'down'}`}>
          {prev.total>0 || sel.total>0
            ? <>{delta>0?'▲':'▼'} {fmt(Math.abs(delta))} {delta>0?'más':'menos'} que {prev.label.toLowerCase()}{prev.total>0 && <> · {Math.round(Math.abs(delta)/prev.total*100)}%</>}</>
            : 'Sin gastos registrados'}
        </div>
        <div className="ins-bars" role="img" aria-label="Gasto de los últimos 6 meses">
          {series.map((s,i)=>(
            <button key={s.k} className={`ins-bar ${i===5?'on':''}`} title={`${s.label}: ${fmt(s.total)}`} onClick={()=>setOff(s.off)}>
              <em className="num">{i===5 ? '' : ''}</em>
              <span className="ins-col"><s style={{height:`${Math.max(s.total>0?6:2, s.total/maxV*100)}%`}}/></span>
              <b>{s.label}</b>
              <small className="num">{s.total>0?fmt(s.total):'—'}</small>
            </button>
          ))}
        </div>
      </section>

      <section className="ins-facts">
        <div><span>Promedio por día</span><b className="num">{fmt(perDay)}</b></div>
        {proj!==null && <div><span>Proyección al cierre</span><b className="num">{fmt(proj)}</b></div>}
        {biggest && <div className="wide2"><span>Compra más grande</span><b className="num">{fmt(amt(biggest))}</b><em>{biggest.desc}</em></div>}
      </section>

      <div className="h2" style={{marginTop:26}}><span>Por categoría</span><button className="link-btn" onClick={()=>setBudOpen(true)}>{budTotal>0?'Editar presupuesto':'Poner presupuesto'}</button></div>
      {budTotal>0 && (
        <div className={`ins-bt ${budSpent>budTotal?'over':''}`}>
          <div><span>Presupuesto del mes</span><b className="num">{fmt(budSpent)} <small>de {fmt(budTotal)}</small></b></div>
          <div className="bar-bg"><i style={{width:`${Math.min(100,budSpent/budTotal*100)}%`, background: budSpent>budTotal?'var(--bad)':budSpent>=budTotal*.8?'var(--warn)':'var(--ok)'}}/></div>
          <small>{budSpent<=budTotal ? `Te quedan ${fmt(budTotal-budSpent)}` : `Te pasaste por ${fmt(budSpent-budTotal)}`}</small>
        </div>
      )}
      {catRows.length===0
        ? <div className="none-row">Sin gastos este mes</div>
        : <div className="list" style={{margin:0}}>
            {catRows.map(r=>{
              const p=r.c.split(' ');
              const share = sel.total>0 ? r.v/sel.total*100 : 0;
              return (
                <button key={r.c} className="cat-line ins-cat" onClick={()=>setBudOpen(true)}>
                  <span className="bub">{p[0]}</span>
                  <span className="it-main">
                    <span className="ins-cat-top"><span className="it-t">{p.slice(1).join(' ')}</span><b className="num">{fmt(r.v)}</b></span>
                    <span className="bar-bg"><i style={{width:`${r.b>0?Math.min(100,r.v/r.b*100):share}%`, background:barColor(r)}}/></span>
                    <span className="it-s">{r.b>0 ? (r.v>r.b ? `Excedido por ${fmt(r.v-r.b)}` : `Quedan ${fmt(r.b-r.v)} de ${fmt(r.b)}`) : `${Math.round(share)}% del gasto`}</span>
                  </span>
                </button>
              );
            })}
          </div>}

      <div className="h2" style={{marginTop:26}}><span>Movimientos</span><em className="h2-n">{mExp.length}</em></div>
      <div className="ins-search"><input value={q} onChange={e=>setQ(e.target.value)} placeholder="Buscar gasto o categoría" aria-label="Buscar"/>{q && <button onClick={()=>setQ('')} aria-label="Limpiar">✕</button>}</div>
      {groups.length===0
        ? <div className="none-row">{qq?'Sin resultados':'Aún no hay gastos este mes'}</div>
        : groups.map(g=>(
            <div key={g.date}>
              <div className="sec-h"><span>{fmtDateLabel(g.date)}</span><b>{fmt(g.items.reduce((a,e)=>a+amt(e),0))}</b></div>
              <div className="list" style={{margin:0}}>
                {g.items.map(e=>(
                  <div key={e.id} className={`item ${e.paid?'done':''}`} onClick={()=>onEditExpense(e, e.cardId)}>
                    <div className="bub">{(e.cat||'📦').split(' ')[0]}</div>
                    <div className="it-main"><span className="it-t">{e.desc}</span><span className="it-s">{cardName(e.cardId)} · {(e.cat||'').split(' ').slice(1).join(' ')}{e.paid?' · pagado':''}</span></div>
                    <span className="it-amt">{fmt(e.amount)}</span>
                  </div>
                ))}
              </div>
            </div>
          ))}
      {budOpen && <BudgetSheet cats={cats} budgets={budgets} spent={spent} onSave={setBudgets} onClose={()=>setBudOpen(false)}/>}
    </div>
  );
}

// ─── PRÉSTAMOS ───────────────────────────────────────────────────────────────
// Un préstamo se guarda con la forma de un pago fijo (desc, amount, day, month, year, repeat, paidMonths)
// para que aparezca solo en el calendario y en "Próximos pagos".
const loanInfo = l => {
  const rep = parseInt(l.repeat)||0, paid = l.paidMonths||[], left = Math.max(0, rep - paid.length), m = parseFloat(l.amount)||0;
  const total = Math.max(left, parseInt(l.total)||rep);
  let nextKey = null, next = null;
  for (let i=0;i<rep;i++) {
    const d = new Date(parseInt(l.year), parseInt(l.month)+i, 1), k = monthKey(d.getFullYear(), d.getMonth());
    if (!paid.includes(k)) { nextKey = k; const dim = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); next = new Date(d.getFullYear(), d.getMonth(), Math.min(dim, parseInt(l.day)||1)); break; }
  }
  return { left, owed:left*m, total, done:total-left, monthly:m, next, nextKey, pct: total>0 ? (total-left)/total*100 : 0 };
};

function LoanForm({ initial, onSave, onDelete, onClose }) {
  const nd = (()=>{ const d=new Date(currentYear,currentMonth,today.getDate()+1); return d; })();
  const info0 = initial ? loanInfo(initial) : null;
  const [f, setF] = useState(initial
    ? { ...initial, amount: initial.amount||'', left: String(info0.left), total: initial.total||'' }
    : { desc:'', lender:'', amount:'', left:'', total:'', day:nd.getDate(), month:nd.getMonth(), year:nd.getFullYear(), paidMonths:[] });
  const set = k => e => setF(p=>({...p,[k]:e.target.value}));
  const dateVal = `${f.year}-${String((parseInt(f.month)||0)+1).padStart(2,'0')}-${String(parseInt(f.day)||1).padStart(2,'0')}`;
  const setDate = e => { if(!e.target.value) return; const [Y,M,D]=e.target.value.split('-').map(Number); setF(p=>({...p, year:Y, month:M-1, day:D})); };
  const left = parseInt(f.left)||0, mo = parseFloat(f.amount)||0;
  const ok = f.desc.trim() && mo>0 && left>0;
  const save = () => {
    if(!ok) return;
    const paidN = (f.paidMonths||[]).length;
    // si se edita, la fecha base se mantiene salvo que el usuario la cambie: recalculamos desde "próximo pago"
    const out = { ...f, cat:'🏦 Préstamo', isLoan:true, amount:mo, repeat:left+(initial?paidN:0), total: parseInt(f.total)||'' };
    delete out.left;
    onSave(out); onClose();
  };
  return (
    <Sheet title={initial?'Editar préstamo':'Nuevo préstamo'} onClose={onClose}>
      <div className="sheet-body">
        <div className="field"><label>Nombre</label><input value={f.desc} onChange={set('desc')} placeholder="ej. Préstamo personal, Coche…" autoFocus={!initial}/></div>
        <div className="field"><label>Banco o a quién le debes (opcional)</label><input value={f.lender||''} onChange={set('lender')} placeholder="ej. BBVA, Mamá, Coppel…"/></div>
        <label className="fl-lbl">Pago mensual</label>
        <AmountBox value={f.amount} onChange={set('amount')}/>
        <div className="field-row">
          <div className="field"><label>Pagos que faltan</label><input type="number" inputMode="numeric" min="1" value={f.left} onChange={set('left')} placeholder="ej. 18"/></div>
          <div className="field"><label>Pagos totales (opcional)</label><input type="number" inputMode="numeric" min="1" value={f.total} onChange={set('total')} placeholder="ej. 24"/></div>
        </div>
        <div className="field"><label>Próximo pago</label><input type="date" value={dateVal} onChange={setDate}/></div>
        {mo>0 && left>0 && <div className="loan-sum">Te falta pagar <b className="num">{fmt(mo*left)}</b> en {left} {left===1?'pago':'pagos'}.</div>}
      </div>
      <div className="sheet-actions">
        {initial && <button className="btn-danger" onClick={()=>{onDelete(initial.id);onClose();}}>Eliminar</button>}
        <button className="btn-secondary" onClick={onClose}>Cancelar</button>
        <button className={`btn-primary ${ok?'':'off'}`} onClick={save}>Guardar</button>
      </div>
    </Sheet>
  );
}

function LoansScreen({ loans, onAdd, onEdit, onPay }) {
  const infos = loans.map(l=>({ l, i: loanInfo(l) })).sort((a,b)=> (a.i.next||0)-(b.i.next||0));
  const owed = infos.reduce((a,x)=>a+x.i.owed,0), monthly = infos.filter(x=>x.i.left>0).reduce((a,x)=>a+x.i.monthly,0);
  const fmtD = d => d ? d.toLocaleDateString('es-MX',{day:'numeric',month:'short'}) : '';
  if (loans.length===0) return (
    <div className="empty"><div className="icon">🏦</div><b>Sin préstamos</b>Agrega uno para ver cuánto te falta y cuándo pagas.
      <div><button className="ghost" style={{marginTop:14,padding:'0 22px'}} onClick={onAdd}>Agregar préstamo</button></div></div>
  );
  return (
    <div className="loans">
      <section className="ins-hero">
        <div className="k">Te falta pagar en préstamos</div>
        <div className="v num">{fmt(owed)}</div>
        <div className="ins-delta">{fmt(monthly)} al mes · {infos.filter(x=>x.i.left>0).length} activos</div>
      </section>
      {infos.map(({l,i})=>(
        <div key={l.id} className={`loan ${i.left===0?'fin':''}`} onClick={()=>onEdit(l)}>
          <div className="loan-top">
            <span className="bub">🏦</span>
            <span className="it-main"><span className="it-t">{l.desc}</span><span className="it-s">{l.lender||'Préstamo'}{i.left>0 && i.next ? ` · próximo ${fmtD(i.next)}` : ''}</span></span>
            <span className="loan-amt num"><b>{fmt(i.owed)}</b><small>por pagar</small></span>
          </div>
          <div className="bar-bg"><i style={{width:`${i.pct}%`, background:'var(--ok)'}}/></div>
          <div className="loan-foot">
            <span>{i.left===0 ? '¡Liquidado!' : `${i.done} de ${i.total} pagos · faltan ${i.left}`}</span>
            {i.left>0 && <button className="loan-pay" onClick={e=>{e.stopPropagation(); onPay(l,i);}}>Pagué {fmt(i.monthly)} ✓</button>}
          </div>
        </div>
      ))}
    </div>
  );
}

const EMOJIS = ['🛒','🍽️','☕','🍔','🍕','🍻','⛽','🚗','🚌','🏥','💊','🎬','🎮','👕','👟','🏠','🔧','💡','📱','✈️','🏖️','🎓','📚','💼','🧾','🐶','🎁','💈','🏋️','🧴','🛠️','📦'];
const splitCat = c => { const i=(c||'').indexOf(' '); return i<0 ? {emoji:'📦', name:c||''} : {emoji:c.slice(0,i), name:c.slice(i+1)}; };

function CatManager({ cats, onSave, onClose }) {
  const [rows, setRows] = useState(()=>cats.map(c=>({ ...splitCat(c), orig:c, key:uid() })));
  const [pick, setPick] = useState(null);
  const upd = (key, patch) => setRows(r=>r.map(x=>x.key===key?{...x,...patch}:x));
  const valid = rows.some(r=>r.name.trim());
  const save = () => {
    const seen = new Set(), list = [], renames = {};
    rows.forEach(r=>{
      const name = r.name.trim(); if (!name) return;
      const c = `${r.emoji||'📦'} ${name}`;
      if (seen.has(c)) return; seen.add(c); list.push(c);
      if (r.orig && r.orig!==c) renames[r.orig]=c;
    });
    onSave(list, renames); onClose();
  };
  return (
    <Sheet title="Mis categorías" onClose={onClose}>
      <div className="sheet-body">
        <div className="cm-list">
          {rows.map(r=>(
            <div key={r.key}>
              <div className="cm-row">
                <button type="button" className={`cm-emoji ${pick===r.key?'on':''}`} onClick={()=>setPick(pick===r.key?null:r.key)} aria-label="Elegir emoji">{r.emoji}</button>
                <input value={r.name} onChange={e=>upd(r.key,{name:e.target.value})} placeholder="Nombre de la categoría" autoFocus={!r.orig}/>
                <button type="button" className="cm-del" onClick={()=>setRows(x=>x.filter(y=>y.key!==r.key))} aria-label="Quitar"><IconClose/></button>
              </div>
              {pick===r.key && (
                <div className="cm-grid">
                  {EMOJIS.map(em=>(<button type="button" key={em} onClick={()=>{upd(r.key,{emoji:em});setPick(null);}}>{em}</button>))}
                </div>
              )}
            </div>
          ))}
        </div>
        <button type="button" className="add-row" style={{width:'100%',margin:'12px 0 4px'}} onClick={()=>{ const key=uid(); setRows(r=>[...r,{key,orig:null,emoji:'📦',name:''}]); setPick(key); }}><IconPlus/>Nueva categoría</button>
        <div className="xp-hint">Si cambias el nombre de una categoría, tus gastos anteriores se actualizan. Si la quitas, tus gastos la conservan.</div>
      </div>
      <div className="sheet-actions">
        <button className="btn-secondary" onClick={onClose}>Cancelar</button>
        <button className={`btn-primary ${valid?'':'off'}`} onClick={()=>{ if(valid) save(); }}>Guardar</button>
      </div>
    </Sheet>
  );
}

    else setExpenses(p=>[...p,{...f,id:uid(),cardId,paid:false}]);
  };
  const deleteExpense = id => setExpenses(p=>p.filter(x=>x.id!==id));
  const toggleExpense = id => setExpenses(p=>p.map(x=>x.id===id?{...x,paid:!x.paid}:x));

  // ── MSI CRUD ── (card.available is NEVER touched — everything is derived)
  const saveMsi = (f, cardId) => {
    if (f.id) setMsis(p=>p.map(x=>x.id===f.id?{...f,cardId}:x));
    else setMsis(p=>[...p,{...f,id:uid(),cardId}]);
  };
  const deleteMsi = id => setMsis(p=>p.filter(x=>x.id!==id));
  const toggleMsiPaid = (id, mk) => {
    setMsis(p=>p.map(x=>{
      if(x.id!==id) return x;
      const paid=[...(x.paid||[])];
      const nowPaid = !paid.includes(mk);
      return {...x, paid: nowPaid ? [...paid,mk] : paid.filter(k=>k!==mk)};
    }));
  };

  // ── Payment CRUD ── (abonos a la tarjeta — suben disponible, bajan deuda)
  const savePayment = (f, cardId) => {
    if (f.id) setPayments(p=>p.map(x=>x.id===f.id?{...f,cardId}:x));
    else setPayments(p=>[...p,{...f,id:uid(),cardId}]);
  };
  const deletePayment = id => setPayments(p=>p.filter(x=>x.id!==id));

  // ── Commitments CRUD ──
  const saveCommit = f => {

    else setCommits(p=>[...p,{...f,id:uid(),paidMonths:[]}]);

  const saveLoan = f => { if(f.id) setLoans(p=>p.map(x=>x.id===f.id?{...f}:x)); else setLoans(p=>[...p,{...f,id:uid(),paidMonths:[]}]); };
  const deleteLoan = id => { setLoans(p=>p.filter(x=>x.id!==id)); setLoanModal(null); };
  const toggleLoanPaid = (id,mk) => setLoans(p=>p.map(x=>{ if(x.id!==id) return x; const pm=x.paidMonths||[]; return {...x,paidMonths:pm.includes(mk)?pm.filter(k=>k!==mk):[...pm,mk]}; }));
  const payLoan = (l,i) => { if(!i.nextKey) return; toggleLoanPaid(l.id,i.nextKey); notify(`Pago de ${l.desc} marcado`, ()=>toggleLoanPaid(l.id,i.nextKey)); };
  const toggleCommitPaid = (id,mk) => setCommits(p=>p.map(x=>{
    if(x.id!==id) return x;
    const pm=x.paidMonths||[];
    return {...x,paidMonths:pm.includes(mk)?pm.filter(k=>k!==mk):[...pm,mk]};
  }));

  // ── Incomes (ingresos) CRUD ──
  const saveIncome2 = f => {
    if(f.id) setIncomes(p=>p.map(x=>x.id===f.id?{...f}:x));
    else setIncomes(p=>[...p,{...f,id:uid(),receivedMonths:[]}]);
  };
  const deleteIncome2 = id => { setIncomes(p=>p.filter(x=>x.id!==id)); setIncomeEvtModal(null); };
  const toggleIncomeReceived = (id,mk) => setIncomes(p=>p.map(x=>{
    if(x.id!==id) return x;
    const rm=x.receivedMonths||[];
    return {...x,receivedMonths:rm.includes(mk)?rm.filter(k=>k!==mk):[...rm,mk]};
  }));

  // ── FAB — only for list screens ──
  const handleFab = () => {
    if (tab==='cards') setCardModal('new');
    else setAddChooser(true);
  };

  const showDetail = detailCard !== null;

  // ── Totales del inicio (todas las tarjetas) ──
  const homeTotals = useMemo(()=>{
    let grandTotal=0, thisMonth=0;
    cards.forEach(c=>{
      const t = computeCardTotals(
        c,
        expenses.filter(e=>e.cardId===c.id),
        msis.filter(m=>m.cardId===c.id),
        payments.filter(p=>p.cardId===c.id)
      );
      grandTotal += t.totalToPay;
      thisMonth  += t.thisCycle;
    });
    // Pagos fijos activos este mes y no pagados → suman a "Este mes" (no a la deuda total)
    const curMK = monthKey(currentYear, currentMonth);
    allCommits.forEach(c=>{
      const sm = monthKey(parseInt(c.year), parseInt(c.month));
      const mths = parseInt(c.repeat)||1;
      const end = new Date(parseInt(c.year), parseInt(c.month)+mths-1, 1);
      const endMK = monthKey(end.getFullYear(), end.getMonth());
      if (sm <= curMK && curMK <= endMK && !((c.paidMonths||[]).includes(curMK))) {
        thisMonth += parseFloat(c.amount)||0;
      }
    });
    return { grandTotal, thisMonth, weekly: thisMonth/4 };
  }, [cards, expenses, msis, payments, allCommits]);

  // ── A pagar por mes — GENERAL (próximos 2 meses, todas las tarjetas) ──
  const monthsToPay = useMemo(()=>{
    const out = [];
    for (let k=1;k<=2;k++){
      const d  = new Date(currentYear, currentMonth+k, 1);
      const mk = monthKey(d.getFullYear(), d.getMonth());
      let amount = 0;
      msis.forEach(m=>{
        const total=parseInt(m.total)||0, monthly=parseFloat(m.monthly)||0, paid=m.paid||[];
        for (let i=0;i<total;i++){
          const mi=(parseInt(m.startMonth)+i)%12;
          const yi=parseInt(m.startYear)+Math.floor((parseInt(m.startMonth)+i)/12);
          const cuotaMk=monthKey(yi,mi);
          if (cuotaMk===mk && !paid.includes(cuotaMk)) amount += monthly;
        }
      });
      expenses.forEach(e=>{
        if (e.paid) return;
        const card = cards.find(c=>c.id===e.cardId);
        const cut = card ? card.cutDay : 1, pay = card ? card.payDay : 15;
        if (dueMonthsAway(e.date, cut, pay) === k) amount += parseFloat(e.amount)||0;
      });
      // Pagos fijos activos ese mes y no pagados (suman al mes, no a la deuda)
      allCommits.forEach(c=>{
        const sm = monthKey(parseInt(c.year), parseInt(c.month));
        const mths = parseInt(c.repeat)||1;
        const end = new Date(parseInt(c.year), parseInt(c.month)+mths-1, 1);
        const endMK = monthKey(end.getFullYear(), end.getMonth());
        if (sm <= mk && mk <= endMK && !((c.paidMonths||[]).includes(mk))) amount += parseFloat(c.amount)||0;
      });
      out.push({ mk, label: MONTHS[d.getMonth()], year: d.getFullYear(), amount });
    }
    return out;
  }, [cards, expenses, msis, payments, allCommits]);

  // ── Próximos pagos (tarjetas que vencen dentro de 15 días) ──
  const upcomingPayments = useMemo(()=>{
    const list = [];
    cards.forEach(c=>{
      const t = computeCardTotals(
        c,
        expenses.filter(e=>e.cardId===c.id),
        msis.filter(m=>m.cardId===c.id),
        payments.filter(p=>p.cardId===c.id)
      );
      const days = daysUntil(parseInt(c.payDay)||15);
      if (days <= 15 && t.thisCycle > 0) {
        const dd = parseInt(c.payDay)||15;
        const date = dd >= today.getDate()
          ? new Date(currentYear, currentMonth, dd)
          : new Date(currentYear, currentMonth+1, dd);
        const ci = COLORS.find(x=>x.id===c.color)||COLORS[2];
        list.push({ id:c.id, name:c.name||'Sin nombre', hex:ci.hex, amount:t.thisCycle, days, date });
      }
    });
    // Pagos fijos (apartado Pagos) activos este mes y no pagados
    const curMK = monthKey(currentYear, currentMonth);
    allCommits.forEach(c=>{
      const sm = monthKey(parseInt(c.year), parseInt(c.month));
      const mths = parseInt(c.repeat)||1;
      const end = new Date(parseInt(c.year), parseInt(c.month)+mths-1, 1);
      const endMK = monthKey(end.getFullYear(), end.getMonth());
      const activeNow = sm <= curMK && curMK <= endMK;
      const paid = (c.paidMonths||[]).includes(curMK);
      if (activeNow && !paid && (parseFloat(c.amount)||0) > 0) {
        const dd = parseInt(c.day)||1;
        const date = dd >= today.getDate()
          ? new Date(currentYear, currentMonth, dd)
          : new Date(currentYear, currentMonth+1, dd);
        list.push({ id:'commit-'+c.id, name:c.desc||'Pago', amount:parseFloat(c.amount)||0,
          emoji:(c.cat||'📦 Otro').split(' ')[0], isCommit:true, date, days:daysUntil(dd) });
      }
    });
    list.sort((a,b)=>a.days-b.days);
    return list;
  }, [cards, expenses, msis, payments, allCommits]);

  // Alertas: pagos que vencen en ≤3 días
  const dueSoonCount = upcomingPayments.filter(p=>p.days<=3).length;

  // ── Respaldo de datos ──
  const BK_KEYS = ['fp_cards','fp_expenses','fp_msis','fp_payments','fp_commits','fp_incomes','fp_cash','fp_income','fp_cats','fp_budgets','fp_loans'];
  const [restoreData, setRestoreData] = useState(null); // datos en espera de confirmación
  const [bkMsg, setBkMsg] = useState('');
  const exportData = () => {
    const data = {};
    BK_KEYS.forEach(k=>{ const v=localStorage.getItem(k); if(v!==null) data[k]=v; });
    const payload = { app:'finanzas', version:1, exportedAt:new Date().toISOString(), data };
    const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `finanzas-respaldo-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
    setBkMsg('✓ Respaldo descargado');
  };
  const importData = (file) => {
    setBkMsg('');
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        const data = parsed && parsed.data ? parsed.data : parsed;
        if (!data || !BK_KEYS.some(k=>k in data)) { setBkMsg('⚠️ Ese archivo no parece un respaldo válido.'); return; }
        setRestoreData(data); // abre confirmación dentro de la app
      } catch(e){ setBkMsg('⚠️ No se pudo leer el archivo: '+e.message); }
    };
    reader.onerror = () => setBkMsg('⚠️ No se pudo abrir el archivo.');
    reader.readAsText(file);
  };
  const applyRestore = () => {
    const data = restoreData; if (!data) return;
    const pv = (v, def) => { try { return typeof v==='string'?JSON.parse(v):v; } catch { return def; } };
    if ('fp_cards'    in data) setCards(pv(data.fp_cards, []));
    if ('fp_expenses' in data) setExpenses(pv(data.fp_expenses, []));
    if ('fp_msis'     in data) setMsis(pv(data.fp_msis, []));
    if ('fp_payments' in data) setPayments(pv(data.fp_payments, []));
    if ('fp_commits'  in data) setCommits(pv(data.fp_commits, []));
    if ('fp_incomes'  in data) setIncomes(pv(data.fp_incomes, []));
    if ('fp_cash'     in data) setCash(pv(data.fp_cash, ''));
    if ('fp_income'   in data) setIncome(pv(data.fp_income, ''));
    if ('fp_cats'     in data) setCats(pv(data.fp_cats, DEFAULT_CATS));
    if ('fp_loans'    in data) setLoans(pv(data.fp_loans, []));
    if ('fp_budgets'  in data) setBudgets(pv(data.fp_budgets, {}));
    setRestoreData(null);
    setBkMsg('✓ Datos restaurados correctamente');
  };

  // ── Categorías editables ──
  const [cats, setCats] = useStorage('fp_cats', DEFAULT_CATS);
  CATS.splice(0, CATS.length, ...cats);
  const [catModal, setCatModal] = useState(false);
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [budgets, setBudgets] = useStorage('fp_budgets', {});
  const [toast, setToast] = useState(null);
  const toastT = useRef(null);
  const notify = (msg, undo) => { clearTimeout(toastT.current); setToast({msg, undo}); toastT.current = setTimeout(()=>setToast(null), 6500); };
  const [confirmPay, setConfirmPay] = useState(null);
  const payMany = ids => {
    setExpenses(p=>p.map(x=>ids.includes(x.id)?{...x,paid:true}:x));
    notify(`${ids.length} ${ids.length===1?'gasto marcado':'gastos marcados'} como pagados`, ()=>setExpenses(p=>p.map(x=>ids.includes(x.id)?{...x,paid:false}:x)));
  };
  const saveCats = (list, renames) => {
    setCats(list);
    if (Object.keys(renames).length) {
      setExpenses(p=>p.map(e=>renames[e.cat]?{...e,cat:renames[e.cat]}:e));
      setCommits(p=>p.map(c=>renames[c.cat]?{...c,cat:renames[c.cat]}:c));
    }
  };
  // ── Tema (auto / claro / oscuro) ──
  const [theme, setTheme] = useStorage('fp_theme', 'auto');
  useEffect(()=>{
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const apply = () => { document.documentElement.dataset.theme = theme==='auto' ? (mq.matches?'dark':'light') : theme; };
    apply(); mq.addEventListener && mq.addEventListener('change', apply);
    return ()=>{ mq.removeEventListener && mq.removeEventListener('change', apply); };
  }, [theme]);
  const goTab = t => { setTab(t); setDetail(null); };

  const settingsBlock = (
    <div>
      <div className="settings">
        <div className="set-t">Apariencia</div>
        <div className="seg three" style={{marginTop:12}}>
          {[['auto','Auto'],['light','Claro'],['dark','Oscuro']].map(([k,l])=>(<button key={k} className={theme===k?'on':''} onClick={()=>setTheme(k)}>{l}</button>))}
        </div>
      </div>
      <div className="settings">
        <div className="set-t">Vista</div>
        <div className="seg" style={{marginTop:12}}>
          {[['mobile','Móvil'],['pc','PC']].map(([k,l])=>(<button key={k} className={view===k?'on':''} onClick={()=>setView(k)}>{l}</button>))}
        </div>
      </div>
      <div className="settings">
        <div className="set-t">Categorías</div>
        <div className="set-s">Agrega, renombra o quita las categorías de tus gastos.</div>
        <div className="btn-row"><button className="ghost" onClick={()=>setCatModal(true)}>Editar categorías</button></div>
      </div>
      <div className="settings">
        <div className="set-t">Respaldo de datos</div>
        <div className="set-s">Guarda el archivo en un lugar seguro. Puedes restaurarlo aquí o en otro equipo.</div>
        <div className="btn-row">
          <button className="ghost fill" onClick={exportData}>Exportar</button>
          <button className="ghost" onClick={()=>document.getElementById('bk-import').click()}>Restaurar</button>
        </div>
        <input id="bk-import" type="file" accept="application/json,.json" style={{display:'none'}}
          onChange={e=>{ const f=e.target.files&&e.target.files[0]; if(f) importData(f); e.target.value=''; }}/>
        {bkMsg && <div className={`bk-msg ${bkMsg[0]==='⚠'?'err':'ok'}`}>{bkMsg}</div>}
      </div>
    </div>
  );

  return (
    <div className={`app-root ${view==='pc'?'as-pc':'as-mobile'}`}>
      <div className="app-stack">
        <div key={tab} className={`screen-view ${showDetail ? 'slide-out' : 'slide-in'}`}>
          {tab==='home' && (cards.length===0
            ? <>
                <div className="route">
                  <div className="route-brand"><i><IconBrand/></i>Finanzas</div>
                  <button className="route-gear" onClick={()=>setSettingsOpen(true)} aria-label="Ajustes"><IconGear/></button>
                  <div className="home-empty">
                    <div className="route-lead">Aún no hay tarjetas</div>
                    <div className="route-amt num">$0<small>.00</small></div>
                    <button className="ghost" onClick={()=>setCardModal('new')}>Agregar tarjeta</button>
                  </div>
                </div>
              </>
            : <HomeSummary {...homeTotals} months={monthsToPay} upcoming={upcomingPayments} cash={cash} expenses={expenses} msis={msis} cards={cards} payments={payments} budgets={budgets} loans={loans} onOpenLoans={()=>{setCardsView('loans');goTab('cards');}}
                onEditCash={()=>setCashModal(true)} onOpenCard={c=>setDetail(c)} onGoTab={goTab} onOpenSettings={()=>setSettingsOpen(true)}/>)}

          {tab==='cards' && (
            <div className="cards-wrap">
              <div className="page-head"><div><h1>{cardsView==='loans'?'Préstamos':'Tarjetas'}</h1></div><button className="round-btn" onClick={()=>cardsView==='loans'?setLoanModal('new'):setCardModal('new')} aria-label="Agregar"><IconPlus/></button></div>
              <div className="seg-wrap"><div className="seg">{[['cards','Tarjetas'],['loans','Préstamos']].map(([k,l])=>(<button key={k} className={cardsView===k?'on':''} onClick={()=>setCardsView(k)}>{l}</button>))}</div></div>
              {cardsView==='loans' && <LoansScreen loans={loans} onAdd={()=>setLoanModal('new')} onEdit={l=>setLoanModal(l)} onPay={payLoan}/>}
              {cardsView==='cards' && cards.length===0 && <div className="empty"><div className="icon">💳</div><b>Sin tarjetas</b>Toca + para agregar la primera.</div>}
              {cardsView==='cards' && <div className="stack">
                {cards.map(card=>(
                  <PlasticCard key={card.id} card={card} expenses={expenses.filter(e=>e.cardId===card.id)} msis={msis.filter(m=>m.cardId===card.id)} payments={payments.filter(p=>p.cardId===card.id)} onClick={()=>setDetail(card)}/>
                ))}
              </div>}
            </div>
          )}

          {tab==='insights' && (
            <>
              <div className="page-head"><div><h1>Gastos</h1></div><button className="round-btn" onClick={()=>setQuickAdd(true)} aria-label="Agregar"><IconPlus/></button></div>
              <InsightsScreen expenses={expenses} cards={cards} cats={cats} budgets={budgets} setBudgets={setBudgets}
                onEditExpense={(exp,cid)=>setExpModal({cardId:cid, cutDay:cards.find(c=>c.id===cid)?.cutDay, payDay:cards.find(c=>c.id===cid)?.payDay, exp})}/>
            </>
          )}

          {tab==='commits' && (
            <>
              <div className="page-head cal-wrap"><div><h1>Pagos</h1></div><button className="round-btn" onClick={()=>setAddChooser(true)} aria-label="Agregar"><IconPlus/></button></div>
              <CommitmentsScreen onOpenCard={c=>setDetail(c)} onNotify={notify} cash={cash} onEditCash={()=>setCashModal(true)} commits={allCommits} cards={cards} expenses={expenses} msis={msis} payments={payments} incomes={incomes}
                onEdit={c=>c.isLoan?setLoanModal(c):setCommitModal(c)} onEditIncome={i=>setIncomeEvtModal(i)} onTogglePaid={(id,mk)=>loans.some(l=>l.id===id)?toggleLoanPaid(id,mk):toggleCommitPaid(id,mk)} onToggleReceived={toggleIncomeReceived}
                selMonth={selMonth} setSelMonth={setSelMonth}/>
            </>
          )}
        </div>

        {detailCard && (
          <div className="screen-view slide-in detail-enter" style={{zIndex:10, background:'var(--paper)'}}>
            <CardDetail
              card={cards.find(c=>c.id===detailCard.id)||detailCard}
              expenses={expenses.filter(e=>e.cardId===detailCard.id)}
              msis={msis.filter(m=>m.cardId===detailCard.id)}
              payments={payments.filter(p=>p.cardId===detailCard.id)}
              onBack={()=>setDetail(null)}
              onEditCard={c=>setCardModal(c)}
              onToggleExpense={toggleExpense}
              onPayCycle={items=>setConfirmPay(items)}
              onEditExpense={(exp,cid)=>setExpModal({cardId:cid, cutDay:cards.find(c=>c.id===cid)?.cutDay, payDay:cards.find(c=>c.id===cid)?.payDay, exp})}
              onAddExpense={cid=>setExpModal({cardId:cid, cutDay:cards.find(c=>c.id===cid)?.cutDay, payDay:cards.find(c=>c.id===cid)?.payDay})}
              onToggleMsiPaid={toggleMsiPaid}
              onEditMsi={(item,cid)=>setMsiModal({cardId:cid,item})}
              onAddMsi={cid=>setMsiModal({cardId:cid})}
              onEditPayment={(pay,cid)=>setPayModal({cardId:cid, pay})}
              onAddPayment={cid=>setPayModal({cardId:cid})}
            />
          </div>
        )}
      </div>

      <nav className="dock">
        <div className="dock-pill">
          {[['home','Inicio'],['cards','Tarjetas'],['commits','Pagos'],['insights','Gastos']].map(([k,l])=>(
            <button key={k} className={`dock-btn ${tab===k?'on':''}`} onClick={()=>goTab(k)} aria-label={l}>
              <NavIcon kind={k==='commits'?'cal':k} on={tab===k}/><span>{l}</span>
            </button>
          ))}
        </div>
        {!showDetail && <button className="dock-add" onClick={()=>setQuickAdd(true)} aria-label="Agregar"><IconPlus/></button>}
      </nav>

      {/* MODALS */}
      {(cardModal==='new'||(cardModal&&cardModal.id)) && (
        <CardForm
          initial={cardModal==='new'?null:cardModal}
          onSave={saveCard}
          onDelete={deleteCard}
          onClose={()=>setCardModal(null)}
        />
      )}
      {expModal && (
        <ExpenseForm
          initial={expModal.exp||null}
          cutDay={expModal.cutDay||1}
          payDay={expModal.payDay||15}
          cards={cards}
          cardId={expModal.cardId}
          history={expenses}
          onCats={()=>setCatModal(true)}
          onSave={(f,cid)=>{ const useId = cid||expModal.cardId; if(!f.id){ try{ localStorage.setItem('fp_lastcard', useId); }catch(e){} } saveExpense(f,useId); }}
          onDelete={deleteExpense}
          onClose={()=>setExpModal(null)}
        />
      )}
      {msiModal && (
        <MsiForm
          initial={msiModal.item||null}
          onSave={f=>saveMsi(f,msiModal.cardId)}
          onDelete={deleteMsi}
          onClose={()=>setMsiModal(null)}
        />
      )}
      {payModal && (
        <PaymentForm
          initial={payModal.pay||null}
          onSave={f=>savePayment(f,payModal.cardId)}
          onDelete={deletePayment}
          onClose={()=>setPayModal(null)}
        />
      )}
      {commitModal && (
        <CommitForm
          initial={commitModal==='new'?null:commitModal}
          onSave={saveCommit}
          onDelete={deleteCommit}
          onClose={()=>setCommitModal(null)}
        />
      )}
      {quickAdd && (
        <QuickAdd
          cards={cards}
          lastCard={(()=>{ try{ return localStorage.getItem('fp_lastcard'); }catch(e){ return null; } })()}
          onClose={()=>setQuickAdd(false)}
          onNewCard={()=>{ setQuickAdd(false); setCardModal('new'); }}
          onPick={(k,cid)=>{
            setQuickAdd(false);
            const cd = cards.find(c=>c.id===cid);
            if (k==='gasto') setExpModal({cardId:cid, cutDay:cd?.cutDay, payDay:cd?.payDay});
            else if (k==='msi') setMsiModal({cardId:cid});
            else if (k==='abono') setPayModal({cardId:cid});
            else if (k==='pago') setCommitModal('new');
            else setIncomeEvtModal('new');
          }}
        />
      )}
      {addChooser && (
        <AddChooser
          onClose={()=>setAddChooser(false)}
          onPick={t=>{ setAddChooser(false); if(t==='pago') setCommitModal('new'); else setIncomeEvtModal('new'); }}
        />
      )}
      {incomeEvtModal && (
        <IncomeEvtForm
          initial={incomeEvtModal==='new'?null:incomeEvtModal}
          onSave={saveIncome2}
          onDelete={deleteIncome2}
          onClose={()=>setIncomeEvtModal(null)}
        />
      )}
      {cashModal && (
        <CashForm
          initial={cash}
          onSave={v=>setCash(v)}
          onClose={()=>setCashModal(false)}
        />
      )}
      {incomeModal && (
        <IncomeForm
          initial={income}
          onSave={v=>setIncome(v)}
          onClose={()=>setIncomeModal(false)}
        />
      )}
      {toast && <div className="toast" role="status"><span>{toast.msg}</span>{toast.undo && <button onClick={()=>{ toast.undo(); setToast(null); }}>Deshacer</button>}</div>}
      {confirmPay && (
        <Sheet title="¿Ya pagaste este ciclo?" onClose={()=>setConfirmPay(null)}>
          <div className="sheet-body">
            <div className="cp-sum"><b className="num">{fmt(confirmPay.reduce((a,e)=>a+(parseFloat(e.amount)||0),0))}</b><span>{confirmPay.length} {confirmPay.length===1?'gasto se marcará':'gastos se marcarán'} como pagados</span></div>
            <div className="xp-hint" style={{textAlign:'center',marginTop:14}}>Al marcarlos pagados se libera ese crédito en tu disponible. Podrás deshacerlo.</div>
          </div>
          <div className="sheet-actions">
            <button className="btn-secondary" onClick={()=>setConfirmPay(null)}>Cancelar</button>
            <button className="btn-primary" onClick={()=>{ payMany(confirmPay.map(e=>e.id)); setConfirmPay(null); }}>Sí, ya pagué</button>
          </div>
        </Sheet>
      )}
      {loanModal && <LoanForm initial={loanModal==='new'?null:loanModal} onSave={saveLoan} onDelete={deleteLoan} onClose={()=>setLoanModal(null)}/>}
      {settingsOpen && <Sheet title="Ajustes" onClose={()=>setSettingsOpen(false)}>{settingsBlock}</Sheet>}
      {catModal && <CatManager cats={cats} onSave={saveCats} onClose={()=>setCatModal(false)}/>}
      {restoreData && (
        <Sheet title="Restaurar respaldo" onClose={()=>setRestoreData(null)}>
          <div className="sheet-body">
            <p style={{fontSize:14.5,color:'var(--text)',lineHeight:1.5,margin:'0 0 4px'}}>
              Esto <strong>reemplazará</strong> tus datos actuales (tarjetas, gastos, MSI y pagos) con los del archivo. Esta acción no se puede deshacer.
            </p>
          </div>
          <div className="sheet-actions">
            <button className="btn-secondary" onClick={()=>setRestoreData(null)}>Cancelar</button>
            <button className="btn-primary" onClick={applyRestore}>Restaurar</button>
          </div>
        </Sheet>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>
  // Registrar el service worker (PWA) — instalación e inicio offline
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
