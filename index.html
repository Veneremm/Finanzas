<!DOCTYPE html>
<html lang="es">

<meta name="theme-color" content="#2a3cff" />
<meta name="color-scheme" content="light dark" />
<link rel="apple-touch-icon" href="./icon-180.png" />
<link rel="icon" type="image/png" href="./icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Finanzas" />
<script>
  // Silenciar el aviso de "in-browser Babel transformer" (es solo informativo)
  (function(){
    var _w = console.warn;
    console.warn = function(){
      var m = arguments[0];
      if (typeof m === 'string' && m.indexOf('in-browser Babel transformer') !== -1) return;
      return _w.apply(console, arguments);
    };
  })();
</script>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.4/babel.min.js"></script>
<style>
  :root {
    --paper: #eef0f7;
    --surface: #ffffff;
    --surface2: #f4f5fb;
    --ink: #0d1230;
    --ink2: #586084;
    --ink3: #98a0be;
    --line: rgba(13,18,48,.08);
    --line2: rgba(13,18,48,.15);
    --brand: #2a3cff;
    --brand2: #1a25c4;
    --brand-soft: rgba(42,60,255,.09);
    --marigold: #ffb703;
    --ok: #0f9d6e;
    --ok-soft: rgba(15,157,110,.12);
    --warn: #d97a00;
    --warn-soft: rgba(229,138,0,.14);
    --bad: #e5304f;
    --bad-soft: rgba(229,48,79,.11);
    --glass: rgba(255,255,255,.80);
    --radius: 22px;
    --radius-sm: 12px;
    --shadow: 0 1px 0 rgba(13,18,48,.03), 0 14px 34px -22px rgba(13,18,48,.32);
    --ease-out: cubic-bezier(.23,1,.32,1);
    --ease-in-out: cubic-bezier(.77,0,.175,1);
    --ease-drawer: cubic-bezier(.32,.72,0,1);
    --nav-h: 84px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --font-ui: -apple-system, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
    --font-num: ui-rounded, "SF Pro Rounded", "Avenir Next Rounded", -apple-system, system-ui, sans-serif;
    /* nombres anteriores, para que los formularios heredados sigan bien */
    --bg: var(--paper); --card: var(--surface); --text: var(--ink); --text2: var(--ink2); --text3: var(--ink3);
    --sep: var(--line); --blue: var(--brand); --blue-mid: var(--brand); --green: var(--ok); --red: var(--bad); --orange: var(--warn);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --paper: #090c1b;
    --surface: #131833;
    --surface2: #1b2145;
    --ink: #eef0ff;
    --ink2: #a3abd0;
    --ink3: #646c96;
    --line: rgba(255,255,255,.075);
    --line2: rgba(255,255,255,.14);
    --brand: #7482ff;
    --brand2: #5663ff;
    --brand-soft: rgba(116,130,255,.17);
    --ok: #3ddba4;
    --ok-soft: rgba(61,219,164,.14);
    --warn: #ffb347;
    --warn-soft: rgba(255,179,71,.15);
    --bad: #ff6b85;
    --bad-soft: rgba(255,107,133,.14);
    --glass: rgba(19,24,51,.82);
    --shadow: 0 0 0 1px rgba(255,255,255,.04), 0 18px 40px -24px rgba(0,0,0,.7);
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  * { scrollbar-width: none; -ms-overflow-style: none; }
  *::-webkit-scrollbar { width: 0; height: 0; display: none; }
  html, body, #root { height: 100%; overflow: hidden; }
  body { font-family: var(--font-ui); background: var(--paper); color: var(--ink); overscroll-behavior: none; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
  button { font-family: inherit; color: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; color: inherit; }
  .num { font-family: var(--font-num); letter-spacing: -.02em; }
  #root { display: flex; flex-direction: column; position: relative; }

  /* ── Estructura ── */
  .app-root { display: flex; flex-direction: column; height: 100%; width: 100%; max-width: 480px; margin: 0 auto; position: relative; }
  .app-stack { position: relative; flex: 1; overflow: hidden; }
  .screen-view { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; padding-bottom: calc(var(--nav-h) + var(--safe-bottom) + 30px);
    transition: transform .38s var(--ease-drawer), opacity .3s var(--ease-out); will-change: transform; }
  .screen-view.slide-in { transform: translateX(0); opacity: 1; }
  .screen-view.slide-out { transform: translateX(-22%); opacity: 0; pointer-events: none; }
  .screen-view.slide-right { transform: translateX(100%); opacity: 0; pointer-events: none; }
  .page { padding: 0 16px; }
  .side { display: none; }
  .view-toggle { position: fixed; top: 10px; right: 12px; z-index: 45; background: var(--glass); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border: 1px solid var(--line); border-radius: 20px; padding: 6px 13px; font-size: 12px; font-weight: 600; color: var(--ink); transition: transform .16s var(--ease-out); }
  .view-toggle:active { transform: scale(.96); }

  /* ── Navegación flotante ── */
  .dock { position: fixed; bottom: calc(14px + var(--safe-bottom)); left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; padding: 0 16px;
    display: flex; align-items: center; justify-content: center; gap: 10px; z-index: 50; pointer-events: none; }
  .dock > * { pointer-events: auto; }
  .dock-pill { display: flex; gap: 4px; padding: 5px; border-radius: 999px; background: var(--glass); border: 1px solid var(--line);
    -webkit-backdrop-filter: blur(22px) saturate(170%); backdrop-filter: blur(22px) saturate(170%); box-shadow: 0 16px 36px -14px rgba(13,18,48,.35); }
  .dock-btn { display: flex; align-items: center; gap: 0; height: 46px; min-width: 46px; padding: 0 12px; border-radius: 999px; border: none; background: none; color: var(--ink2); font-size: 14px; font-weight: 650;
    transition: background .22s var(--ease-out), color .22s var(--ease-out), transform .14s var(--ease-out); }
  .dock-btn:active { transform: scale(.95); }
  .dock-btn svg { width: 22px; height: 22px; flex-shrink: 0; }
  .dock-btn span { max-width: 0; overflow: hidden; white-space: nowrap; opacity: 0; transition: max-width .28s var(--ease-out), opacity .2s, margin .28s var(--ease-out); }
  .dock-btn.on { background: var(--ink); color: var(--surface); padding: 0 16px 0 13px; }
  .dock-btn.on span { max-width: 90px; opacity: 1; margin-left: 8px; }
  .dock-add { width: 56px; height: 56px; border-radius: 50%; border: none; background: linear-gradient(145deg, #4a5bff, var(--brand2)); color: #fff; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 16px 30px -10px rgba(42,60,255,.7), inset 0 1px 0 rgba(255,255,255,.28); transition: transform .16s var(--ease-out); flex-shrink: 0; }
  .dock-add:active { transform: scale(.93); }
  .dock-add svg { width: 26px; height: 26px; }

  /* ── Encabezados de página ── */
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; padding: 58px 20px 14px; }
  .page-head h1 { font-family: var(--font-num); font-size: 32px; font-weight: 800; letter-spacing: -.04em; line-height: 1; }
  .page-head p { font-size: 13.5px; color: var(--ink2); margin-top: 6px; }
  .round-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--brand); display: flex; align-items: center; justify-content: center; transition: transform .14s var(--ease-out); }
  .round-btn:active { transform: scale(.92); }
  .round-btn svg { width: 20px; height: 20px; }
  .h2 { font-family: var(--font-num); font-size: 18px; font-weight: 750; letter-spacing: -.03em; margin: 28px 4px 12px; display: flex; align-items: baseline; justify-content: space-between; }
  .h2 small { font-family: var(--font-ui); font-size: 13px; font-weight: 500; color: var(--ink2); letter-spacing: 0; }
  .empty { text-align: center; padding: 34px 20px; color: var(--ink2); font-size: 14.5px; line-height: 1.45; }
  .empty .icon { font-size: 38px; margin-bottom: 8px; }
  .empty b { display: block; color: var(--ink); font-size: 16px; margin-bottom: 3px; }

  /* ── Inicio: la ruta ── */
  .route { position: relative; overflow: hidden; color: #fff; padding: 62px 22px 20px; border-radius: 0 0 38px 38px;
    background: radial-gradient(90% 70% at 100% 0%, rgba(120,140,255,.55), rgba(120,140,255,0) 60%), linear-gradient(165deg, #3047ff 0%, #1f2ee0 45%, #131b9e 100%); }
  .route::before { content: ''; position: absolute; width: 260px; height: 260px; border-radius: 50%; left: -90px; bottom: -150px; background: radial-gradient(circle, rgba(255,183,3,.22), rgba(255,183,3,0) 65%); pointer-events: none; }
  .route-brand { display: flex; align-items: center; gap: 9px; font-family: var(--font-num); font-weight: 800; font-size: 16px; letter-spacing: -.02em; margin-bottom: 26px; }
  .route-brand i { width: 28px; height: 28px; border-radius: 9px; background: rgba(255,255,255,.18); display: flex; align-items: center; justify-content: center; box-shadow: inset 0 1px 0 rgba(255,255,255,.3); }
  .route-brand svg { width: 18px; height: 18px; }
  .route-lead { font-size: 15px; color: rgba(255,255,255,.74); }
  .route-amt { font-family: var(--font-num); font-size: 52px; font-weight: 800; letter-spacing: -.05em; line-height: 1.04; margin-top: 2px; }
  .route-amt small { font-size: 26px; font-weight: 700; opacity: .7; letter-spacing: -.02em; }
  .route-paid { margin-top: 10px; display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; color: rgba(255,255,255,.8); }
  .route-paid i { display: block; width: 86px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.2); overflow: hidden; }
  .route-paid i b { display: block; height: 100%; border-radius: 3px; background: var(--marigold); transition: width .8s var(--ease-out); }
  .route-chart { margin: 14px -6px 0; }
  .route-chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .route-cap { margin: 2px 4px 0; min-height: 22px; font-size: 14.5px; color: rgba(255,255,255,.78); }
  .route-cap b { color: #fff; font-weight: 700; }
  .rt-line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: rtDraw 1s var(--ease-out) .1s forwards; }
  .rt-area { opacity: 0; animation: rtFade .7s var(--ease-out) .5s forwards; }
  .rt-static .rt-line { animation: none; stroke-dashoffset: 0; }
  .rt-static .rt-area { animation: none; opacity: 1; }
  @keyframes rtDraw { to { stroke-dashoffset: 0; } }
  @keyframes rtFade { to { opacity: 1; } }
  .home-body { padding: 0 16px; }
  .month { background: var(--surface); border-radius: 28px; box-shadow: var(--shadow); padding: 20px 20px 18px; margin-top: 18px; }
  .month-cols { display: flex; gap: 16px; align-items: flex-start; }
  .month-cols > div { flex: 1; min-width: 0; }
  .month-cols > div + div { text-align: right; }
  .k { font-size: 13.5px; color: var(--ink2); }
  .v { font-family: var(--font-num); font-size: 28px; font-weight: 800; letter-spacing: -.04em; line-height: 1.1; margin-top: 3px; }
  .v-btn { background: none; border: none; text-align: right; width: 100%; padding: 0; display: block; }
  .v-btn .k { display: inline-flex; align-items: center; gap: 5px; }
  .v-btn .k svg { width: 13px; height: 13px; }
  .v.link { color: var(--brand); font-size: 20px; margin-top: 8px; }
  .s { font-size: 13px; color: var(--ink2); margin-top: 3px; }
  .meter { height: 10px; border-radius: 6px; background: var(--surface2); margin-top: 18px; overflow: hidden; }
  .meter i { display: block; height: 100%; border-radius: 6px; background: var(--ok); transition: width .7s var(--ease-out); }
  .meter.short i { background: var(--warn); }
  .meter-cap { font-size: 13.5px; margin-top: 8px; font-weight: 600; color: var(--ok); }
  .meter-cap.short { color: var(--warn); }
  .tickets { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -16px; padding: 2px 16px 6px; }
  .ticket { flex: 0 0 158px; scroll-snap-align: start; background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); padding: 14px 14px 13px; position: relative; overflow: hidden; }
  .ticket::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 5px; background: var(--tk, var(--brand)); }
  .tk-date { display: flex; align-items: baseline; gap: 5px; margin-top: 4px; }
  .tk-date b { font-family: var(--font-num); font-size: 30px; font-weight: 800; letter-spacing: -.04em; line-height: 1; }
  .tk-date span { font-size: 13px; color: var(--ink2); font-weight: 600; text-transform: lowercase; }
  .tk-name { font-size: 14.5px; font-weight: 600; margin-top: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tk-amt { font-family: var(--font-num); font-size: 17px; font-weight: 750; letter-spacing: -.03em; margin-top: 2px; }
  .tk-chip { display: inline-block; margin-top: 10px; padding: 3px 9px; border-radius: 20px; font-size: 12px; font-weight: 650; background: var(--surface2); color: var(--ink2); }
  .tk-chip.warn { background: var(--warn-soft); color: var(--warn); }
  .tk-chip.bad { background: var(--bad-soft); color: var(--bad); }
  .none-row { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); padding: 18px; color: var(--ink2); font-size: 14.5px; }
  .wallet { background: var(--surface); border-radius: 24px; box-shadow: var(--shadow); overflow: hidden; }
  .w-row { display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px 16px; border: none; background: none; text-align: left; position: relative; transition: background .15s; }
  .w-row + .w-row::before { content: ''; position: absolute; left: 70px; right: 16px; top: 0; height: 1px; background: var(--line); }
  .w-row:active { background: var(--surface2); }
  .w-chip { width: 42px; height: 28px; border-radius: 7px; flex-shrink: 0; box-shadow: inset 0 1px 0 rgba(255,255,255,.28), 0 4px 10px -4px rgba(13,18,48,.35); }
  .w-main { flex: 1; min-width: 0; }
  .w-name { font-size: 15.5px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .w-use { height: 4px; border-radius: 2px; background: var(--surface2); margin-top: 7px; overflow: hidden; }
  .w-use i { display: block; height: 100%; border-radius: 2px; background: var(--brand); }
  .w-amt { text-align: right; }
  .w-amt b { font-family: var(--font-num); font-size: 16.5px; font-weight: 750; letter-spacing: -.03em; display: block; }
  .w-amt span { font-size: 12px; color: var(--ink2); }
  .donut-card { background: var(--surface); border-radius: 24px; box-shadow: var(--shadow); padding: 18px; }
  .donut-row { display: flex; align-items: center; gap: 18px; }
  .donut-wrap { position: relative; flex-shrink: 0; }
  .donut-c { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .donut-c b { font-family: var(--font-num); font-size: 15px; font-weight: 800; letter-spacing: -.03em; }
  .donut-c span { font-size: 11px; color: var(--ink2); }
  .legend { flex: 1; min-width: 0; }
  .lg-row { display: flex; align-items: center; gap: 9px; width: 100%; padding: 7px 0; border: none; background: none; text-align: left; transition: opacity .15s; }
  .lg-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
  .lg-name { flex: 1; min-width: 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lg-pct { font-size: 13px; font-weight: 650; color: var(--ink2); }
  .lg-detail { margin-top: 12px; padding-top: 6px; border-top: 1px solid var(--line); }
  .lg-detail > div { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; font-size: 14px; }
  .lg-detail > div span:first-child { color: var(--ink2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lg-detail > div span:last-child { font-weight: 650; }
  .settings { background: var(--surface); border-radius: 24px; box-shadow: var(--shadow); padding: 16px; }
  .settings + .settings { margin-top: 12px; }
  .set-t { font-size: 15px; font-weight: 650; }
  .set-s { font-size: 12.5px; color: var(--ink2); margin-top: 3px; line-height: 1.4; }
  .btn-row { display: flex; gap: 10px; margin-top: 14px; }
  .ghost { flex: 1; height: 46px; border-radius: 14px; border: 1px solid var(--line2); background: none; font-size: 15px; font-weight: 650; transition: transform .14s var(--ease-out); }
  .ghost:active { transform: scale(.97); }
  .ghost.fill { background: var(--ink); color: var(--surface); border-color: transparent; }
  .seg { display: flex; background: var(--surface2); border-radius: 14px; padding: 3px; }
  .seg button { flex: 1; border: none; background: none; padding: 9px 0; border-radius: 11px; font-size: 13.5px; font-weight: 650; color: var(--ink2); transition: background .2s var(--ease-out), color .2s; }
  .seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 4px rgba(13,18,48,.14); }
  :root[data-theme="dark"] .seg button.on { background: var(--brand-soft); color: var(--ink); box-shadow: none; }

  /* ── Tarjetas (diseño original) ── */
  .card-flat { margin: 0 16px 10px; border-radius: 16px; padding: 13px 16px 13px; color: #fff; cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.08); animation: fadeUp .3s ease both; transition: transform .12s ease, filter .12s ease; user-select: none; -webkit-user-select: none; }
  .card-flat:active { transform: scale(.985); filter: brightness(.96); }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .cc-header { border-radius: 16px 16px 0 0; padding: 15px 16px 13px; color: #fff; position: relative; overflow: hidden; }
  .cc-name { font-size: 15px; font-weight: 700; }
  .cc-chips { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
  .cc-chip { font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 20px; background: rgba(255,255,255,.2); }
  .cc-amount { font-size: 27px; font-weight: 700; margin-top: 9px; letter-spacing: -.8px; }
  .cc-amount-label { font-size: 11px; opacity: .7; margin-top: 1px; }
  .grad-yellow  { background: linear-gradient(145deg, #e8b332, #cf9a1e); }
  .grad-red     { background: linear-gradient(145deg, #e53935, #c1272d); }
  .grad-blue    { background: linear-gradient(145deg, #1f82dd, #1257a0); }
  .grad-skyblue { background: linear-gradient(145deg, #039be5, #0379b0); }
  .grad-purple  { background: linear-gradient(145deg, #ab47bc, #8b3a9c); }
  .grad-orange  { background: linear-gradient(145deg, #f4511e, #cc3f12); }
  .grad-green   { background: linear-gradient(145deg, #3a9540, #29702d); }
  .grad-black    { background: linear-gradient(145deg, #3a3a3f, #141417); }
  .grad-graphite { background: linear-gradient(145deg, #5b6573, #313842); }
  .grad-teal     { background: linear-gradient(145deg, #16b9a6, #0c7a6e); }
  .grad-pink     { background: linear-gradient(145deg, #ec4899, #b81d6e); }
  .grad-indigo   { background: linear-gradient(145deg, #4254c5, #28307e); }
  .grad-gold     { background: linear-gradient(145deg, #caa14e, #93702a); }
  .grad-wine     { background: linear-gradient(145deg, #9b2742, #5f1628); }

  /* ── Detalle de tarjeta ── */
  .detail-top { display: flex; align-items: center; justify-content: space-between; padding: 52px 16px 12px; }
  .pill-link { display: flex; align-items: center; gap: 4px; height: 38px; padding: 0 14px 0 8px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 14.5px; font-weight: 650; transition: transform .14s var(--ease-out); }
  .pill-link:active { transform: scale(.96); }
  .pill-link svg { width: 18px; height: 18px; }
  .pill-link.solo { padding: 0 16px; }
  .banner-wrap { margin: 0 16px 12px; }
  .banner-wrap .cc-header { border-radius: 24px; padding: 20px 20px 18px; box-shadow: 0 18px 34px -20px rgba(13,18,48,.5); }
  .banner-wrap .cc-name { font-size: 16px; }
  .banner-wrap .cc-chip { font-size: 11px; padding: 3px 9px; }
  .banner-wrap .cc-amount { font-size: 38px; margin-top: 14px; font-family: var(--font-num); font-weight: 800; letter-spacing: -.045em; }
  .banner-wrap .cc-amount-label { font-size: 13px; opacity: .78; }
  .avail { background: var(--surface); border-radius: 24px; box-shadow: var(--shadow); padding: 18px 18px 16px; margin: 0 16px 12px; }
  .avail-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
  .avail-row b { font-family: var(--font-num); font-size: 26px; font-weight: 800; letter-spacing: -.04em; display: block; line-height: 1.1; }
  .avail-row span { font-size: 13px; color: var(--ink2); }
  .avail-row > div:last-child { text-align: right; }

<script type="text/babel">
const { useState, useEffect, useCallback, useMemo, useRef } = React;

// ─── CONSTANTS ──────────────────────────────────────────────────────────────
const COLORS = [
  { id:'yellow',  cls:'grad-yellow',  hex:'#e8b332' },
  { id:'red',     cls:'grad-red',     hex:'#e53935' },

  { id:'indigo',   cls:'grad-indigo',   hex:'#3f51b5' },

  { id:'wine',     cls:'grad-wine',     hex:'#8e2436' },
];

const CATS = [
  '🛒 Supermercado','🍽️ Comida','⛽ Gasolina','🚗 Auto',
  '🏥 Salud','🎬 Entretenimiento','👕 Ropa','🏠 Hogar',
  '🔧 Servicios','✈️ Viajes','🎓 Educación','💊 Farmacia','💼 Negocio','📦 Otro',
];

const MONTHS = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const today = new Date();
const currentMonth = today.getMonth();
const currentYear  = today.getFullYear();
const currentMK    = `${currentYear}-${String(currentMonth).padStart(2,'0')}`;

const uid    = () => Math.random().toString(36).slice(2,10);
const fmt0   = n => new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',minimumFractionDigits:0,maximumFractionDigits:0}).format(n||0);
const fmt    = n => new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',minimumFractionDigits:2,maximumFractionDigits:2}).format(n||0);
const monthKey = (y,m) => `${y}-${String(m).padStart(2,'0')}`;
// Fecha local (YYYY-MM-DD). toISOString() usa UTC y de noche en Tijuana ya marcaba "mañana".
const isoLocal = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function daysUntil(day) {
  const d = today.getDate();
  if (day >= d) return day - d;
  const next = new Date(today.getFullYear(), today.getMonth()+1, day);
  return Math.round((next - today) / 86400000);
}

// ─── STORAGE ─────────────────────────────────────────────────────────────────
function useStorage(key, init) {
  const [val, setVal] = useState(() => {
    try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : init; } catch { return init; }
  });
  const set = useCallback(v => {
    setVal(prev => {
      const next = typeof v === 'function' ? v(prev) : v;
      localStorage.setItem(key, JSON.stringify(next));
      return next;
    });
  }, [key]);
  return [val, set];

// ─── CALENDARIO DE DEUDA: cuánto cae en cada mes ─────────────────────────────
// Devuelve un arreglo [mes0, mes1, ...] cuya suma == totalToPay de la tarjeta.
function cardSchedule(card, expenses, msis, payments=[], horizon=60) {
  const arr = new Array(horizon).fill(0);
  const put = (k,v)=>{ if (v>0) arr[Math.min(horizon-1, Math.max(0,k))] += v; };
  expenses.forEach(e=>{ if(!e.paid) put(dueMonthsAway(e.date, card.cutDay, card.payDay), parseFloat(e.amount)||0); });
  msis.forEach(m=>{
    const total=parseInt(m.total)||0, monthly=parseFloat(m.monthly)||0, paid=m.paid||[];
    for (let i=0;i<total;i++){
      const mi=(parseInt(m.startMonth)+i)%12;
      const yi=(parseInt(m.startYear)||currentYear)+Math.floor((parseInt(m.startMonth)+i)/12);
      if (!paid.includes(monthKey(yi,mi))) put(msiMonthAway(yi,mi), monthly);
    }
  });
  let abonos = payments.reduce((a,p)=>a+(parseFloat(p.amount)||0),0);
  for (let k=0;k<horizon && abonos>0;k++){ const t=Math.min(arr[k],abonos); arr[k]-=t; abonos-=t; }
  const target = computeCardTotals(card, expenses, msis, payments).totalToPay;
  const sum = arr.reduce((a,b)=>a+b,0);
  if (sum>0) { const f=target/sum; for (let k=0;k<horizon;k++) arr[k]*=f; }
  else if (target>0) arr[0]=target;
  return arr;
}

function useCountUp(value) {
  const reduce = typeof window!=='undefined' && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const [v, setV] = useState(()=> (window.__cuDone||reduce) ? value : 0);
  useEffect(()=>{
    if (window.__cuDone || reduce) { setV(value); window.__cuDone = true; return; }
    let raf, t0=null; const dur=850;
    const step = ts => {
      if (t0===null) t0=ts;
      const p = Math.min(1,(ts-t0)/dur);
      setV(value*(1-Math.pow(1-p,4)));
      if (p<1) raf=requestAnimationFrame(step); else window.__cuDone=true;
    };
    raf = requestAnimationFrame(step);
    return ()=>cancelAnimationFrame(raf);
  }, [value]);
  return v;
}

// ─── FINANCIAL MODEL ─────────────────────────────────────────────────────────
// card.available = exact bank balance entered by user. NEVER mutated.
//
// EXPENSES:
//   toggle OFF + not paid  → bank hasn't charged yet → subtract
//   toggle OFF + paid      → bank charged, credit freed → no adjustment (net 0 vs base)
//   toggle ON  + any       → already in base → 0
//
// MSI:
//   paidCount = cuotas pre-existing when user added the MSI (already in base available).
//   extraPaid = paid.length - paidCount  (cuotas newly palomeaded AFTER adding)
//   stillOwed = total - paid.length      (cuotas not yet palomeaded)
//   → each extraPaid cuota adds back to available (bank charged, freed credit)
//   → each stillOwed cuota subtracts from available (reserved future debt)
//
// IMPORTANT: if paidCount is missing (legacy data), treat ALL current paid[] as pre-existing
//            so opening an old MSI doesn't suddenly move the available balance.

function computeCardTotals(card, expenses, msis, payments=[]) {
  const totalCredit = parseFloat(card.total)||0;
  const extension   = parseFloat(card.extension)||0;
  const baseAvail   = parseFloat(card.available)||0;

  // ── Expense adjustment ──
  // The toggle (alreadyDiscounted) only affects whether we subtract when NOT paid.
  // Palomear (paid=true) ALWAYS frees credit — regardless of toggle.
  //
  //   alreadyDiscounted=false, paid=false  → bank hasn't charged yet   → subtract
  //   alreadyDiscounted=false, paid=true   → bank charged, now settled  → +amount (cancel the subtract)
  //   alreadyDiscounted=true,  paid=false  → bank already has it        → 0 (already in base)
  //   alreadyDiscounted=true,  paid=true   → paid & settled             → +amount (credit freed)
  //
  // Simplified: paid=true always adds back. paid=false only subtracts if NOT already discounted.
  let expAdj = 0;
  expenses.forEach(e => {
    const amount = parseFloat(e.amount)||0;
    if (e.paid) {
      expAdj += amount;          // paid: bank charged it AND user settled → credit freed → +
    } else if (!e.alreadyDiscounted) {
      expAdj -= amount;          // pending, bank hasn't charged yet → -
    }
    // alreadyDiscounted=true + not paid → 0 (already in base, still owed but bank tracks it)
  });

  // ── MSI adjustment ──
  // baseAvail already reflects ALL pre-existing paid cuotas (paidCount) — bank took them.
  // Only NEW cuotas palomeated AFTER adding the MSI to the app add credit back.
  // newlyPaid = paid.length - paidCount  (cuotas ticked by user in the app)
  let msiAdj = 0;
  msis.forEach(m => {
    const monthly   = parseFloat(m.monthly)||0;
    const paidKeys  = m.paid||[];
    const paidCount = m.paidCount !== undefined && m.paidCount !== ''
      ? parseInt(m.paidCount)||0
      : paidKeys.length; // legacy: treat all as pre-existing → no adjustment
    const newlyPaid = Math.max(0, paidKeys.length - paidCount);
    msiAdj += newlyPaid * monthly;
  });

  // ── Payments (abonos) ──
  // Dinero que transferiste a la tarjeta: libera crédito (sube disponible)
  // y baja tu total a pagar. No se ata a un gasto concreto.
  const totalPayments = payments.reduce((a,p)=>a+(parseFloat(p.amount)||0),0);

  const realAvail = baseAvail + expAdj + msiAdj + totalPayments;
  const creditLine = totalCredit + extension;
  const used    = creditLine - realAvail;
  const usedPct = creditLine > 0 ? (used / creditLine) * 100 : 0;

  // "Total a pagar": unpaid expenses + remaining MSI cuotas − pagos hechos
  const unpaidExp = expenses.filter(e=>!e.paid).reduce((a,e)=>a+(parseFloat(e.amount)||0),0);
  const pendMsi   = msis.reduce((a,m)=>{
    const stillOwed = (parseInt(m.total)||0) - (m.paid||[]).length;
    return a + stillOwed * (parseFloat(m.monthly)||0);
  },0);
  const totalToPay = Math.max(0, unpaidExp + pendMsi - totalPayments);

  // ── Cycle breakdown (expenses + MSI cuotas) ──
  const expThisCycle = expenses.filter(e=>!e.paid && dueMonthsAway(e.date, card.cutDay, card.payDay) <= 0).reduce((a,e)=>a+(parseFloat(e.amount)||0),0);
  const expNextCycle = expenses.filter(e=>!e.paid && dueMonthsAway(e.date, card.cutDay, card.payDay) === 1).reduce((a,e)=>a+(parseFloat(e.amount)||0),0);
  const { thisCycleMsi, nextCycleMsi } = getMsiCycleAmounts(msis);

  // Los pagos reducen primero lo del ciclo actual
  const thisCycle = Math.max(0, (expThisCycle + thisCycleMsi) - totalPayments);

  return { totalCredit, extension, realAvail, used, usedPct, totalToPay, totalPayments,
    cutDays: daysUntil(parseInt(card.cutDay)||1),
    payDays: daysUntil(parseInt(card.payDay)||15),
    thisCycle,
    nextCycle:  expNextCycle + nextCycleMsi,
  };
}

// ─── CYCLE HELPER ────────────────────────────────────────────────────────────
// Returns true if a date string falls AFTER the card's cut day (next billing cycle)
function isNextCycle(dateStr, cutDay) {
  if (!dateStr) return false;
  const [y,m,d] = dateStr.split('-').map(Number);
  const expDate = new Date(y, m-1, d);
  const cut = parseInt(cutDay)||1;
  const cutThisMonth = new Date(today.getFullYear(), today.getMonth(), cut);
  return expDate > cutThisMonth;
}

// Meses que faltan para PAGAR un gasto, según corte y pago de la tarjeta.
// 0 = este mes (o atrasado), 1 = próximo mes, 2 = en dos meses...
// Una compra hecha DESPUÉS del corte entra al siguiente estado de cuenta.
// Si el día de pago cae ANTES que el de corte, ese estado se paga el mes siguiente al cierre.
function dueMonthsAway(dateStr, cutDay, payDay) {
  if (!dateStr) return 0;
  const [y,m,d] = dateStr.split('-').map(Number);
  const C = parseInt(cutDay)||1, P = parseInt(payDay)||15;
  let closeAbs = y*12 + (m-1);              // estado de cuenta que captura la compra
  if (d > C) closeAbs += 1;                 // comprado después del corte → siguiente estado
  const dueAbs = closeAbs + (P <= C ? 1 : 0); // si el pago < corte, se paga el mes siguiente
  return dueAbs - (currentYear*12 + currentMonth);
}
// Meses que faltan para una cuota MSI (por su propio mes asignado).
function msiMonthAway(yi, mi) {
  return (yi*12 + mi) - (currentYear*12 + currentMonth);
}

// Returns the date string for a given cuota index of an MSI
function msiCuotaDate(msi, index) {
  const mi = (parseInt(msi.startMonth) + index) % 12;
  const yi = parseInt(msi.startYear) + Math.floor((parseInt(msi.startMonth) + index) / 12);
  // Use day 1 of that month as the billing date
  return `${yi}-${String(mi+1).padStart(2,'0')}-01`;
}

// Returns { thisCycleMsi, nextCycleMsi } — unpaid cuotas grouped by current/next cycle
function getMsiCycleAmounts(msis) {
  let thisCycleMsi = 0, nextCycleMsi = 0;
  msis.forEach(m => {
    const total    = parseInt(m.total)||0;
    const monthly  = parseFloat(m.monthly)||0;
    const paidKeys = m.paid||[];
    for (let i = 0; i < total; i++) {
      const mi = (parseInt(m.startMonth)+i)%12;
      const yi = parseInt(m.startYear)+Math.floor((parseInt(m.startMonth)+i)/12);
      const mk = monthKey(yi,mi);
      if (paidKeys.includes(mk)) continue; // already paid, skip
      const away = msiMonthAway(yi, mi);
      if (away <= 0) thisCycleMsi += monthly;       // este mes o atrasada
      else if (away === 1) nextCycleMsi += monthly; // próximo mes
    }
  });
  return { thisCycleMsi, nextCycleMsi };
}

// Próximos 2 meses a pagar de UNA tarjeta: cuotas MSI de ese mes + gastos cuyo pago real cae ahí
function cardMonthsToPay(card, expenses, msis) {
  const out = [];
  for (let k=1;k<=2;k++){
    const d  = new Date(currentYear, currentMonth+k, 1);
    const mk = monthKey(d.getFullYear(), d.getMonth());
    let amount = 0;
    msis.forEach(m=>{
      const total=parseInt(m.total)||0, monthly=parseFloat(m.monthly)||0, paid=m.paid||[];
      for (let i=0;i<total;i++){
        const mi=(parseInt(m.startMonth)+i)%12;
        const yi=parseInt(m.startYear)+Math.floor((parseInt(m.startMonth)+i)/12);
        const cuotaMk=monthKey(yi,mi);
        if (cuotaMk===mk && !paid.includes(cuotaMk)) amount += monthly;
      }
    });
    amount += expenses
      .filter(e=>!e.paid && dueMonthsAway(e.date, card.cutDay, card.payDay) === k)
      .reduce((a,e)=>a+(parseFloat(e.amount)||0),0);
    out.push({ label: MONTHS[d.getMonth()], year: d.getFullYear(), amount });
  }
  return out;
}

function QuickAdd({ cards, lastCard, onPick, onNewCard, onClose }) {

    { k:'ingreso', e:'💰', c:'#cdeefa', t:'Ingreso',    s:'Sueldo, negocio' },

    </Sheet>
  );

        <div className="qa-grid">
          <button className="qa-tile big" disabled={need} style={need?{opacity:.45}:null} onClick={()=>choose({k:'gasto',needCard:true})}>
            <span className="qa-ico">🧾</span>
            <span><span className="qa-t">Gasto</span><span className="qa-s">Compra con tarjeta</span></span>
          </button>
          <button className="qa-tile row" disabled={need} style={need?{opacity:.45}:null} onClick={()=>choose(tiles[0])}>
            <span className="qa-ico" style={{background:tiles[0].c}}>{tiles[0].e}</span>

  const PALETTE = ['#2a3cff','#ffb703','#0f9d6e','#e5304f','#8b5cf6','#06b6d4'];

  const { catData, catItems, owedTotal, paidTotal, hasAbonos, sched } = (()=>{
    const map = {}, items = {}, sched = new Array(60).fill(0);
    let owed = 0, paid = 0, abonosOn = false;
    const add = (k,v,desc)=>{ if(v>0){ map[k]=(map[k]||0)+v; (items[k]=items[k]||[]).push({desc:desc||k, amount:v}); } };
    cards.forEach(c=>{
      const cExp  = (expenses||[]).filter(e=>e.cardId===c.id);
      const cMsi  = (msis||[]).filter(m=>m.cardId===c.id);
      const cPay  = (payments||[]).filter(p=>p.cardId===c.id);
      const target = computeCardTotals(c, cExp, cMsi, cPay).totalToPay;
      cardSchedule(c, cExp, cMsi, cPay).forEach((v,i)=>{ sched[i]+=v; });
      const abonos = cPay.reduce((a,p)=>a+(parseFloat(p.amount)||0),0);
      const raw = [];
      cExp.forEach(e=>{
        const amt = parseFloat(e.amount)||0;
        if (e.paid) paid += amt; else if (amt>0) raw.push({k:e.cat||'📦 Otro', v:amt, d:e.desc||'Gasto'});
      });
      cMsi.forEach(m=>{
        const mo = parseFloat(m.monthly)||0, t = parseInt(m.total)||0, p = (m.paid||[]).length;
        paid += Math.min(p,t)*mo;
        const left = Math.max(0,t-p)*mo;
        if (left>0) raw.push({k:'📅 Meses sin intereses', v:left, d:m.desc||'MSI'});
      });
      paid += abonos;
      const rawSum = raw.reduce((a,r)=>a+r.v,0);
      const f = rawSum>0 ? target/rawSum : 0;
      if (abonos>0 && f<1) abonosOn = true;
      raw.forEach(r=> add(r.k, r.v*f, r.d));
      owed += target;
    });
    const arr = Object.entries(map).map(([label,value])=>({label,value})).filter(d=>d.value>0.005).sort((a,b)=>b.value-a.value);
    const top = arr.slice(0,5), rest = arr.slice(5);
    if (rest.length) {
      top.push({ label:'➕ Otras categorías', value: rest.reduce((a,d)=>a+d.value,0) });
      items['➕ Otras categorías'] = rest.flatMap(d=>items[d.label]||[]);
    }
    return { catData: top.map((d,i)=>({ ...d, color: PALETTE[i%PALETTE.length] })), catItems: items, owedTotal: owed, paidTotal: paid, hasAbonos: abonosOn, sched };
  })();
  const catTotal = catData.reduce((a,d)=>a+d.value,0);
  const everything = paidTotal + owedTotal;
  const paidPct = everything>0 ? Math.round(paidTotal/everything*100) : 0;
  const flow = [{ label:'Este mes', amount:thisMonth, current:true }, ...(months||[]).map(m=>({ label: m.label + (m.year!==currentYear?` '${String(m.year).slice(2)}`:''), amount:m.amount }))];

  const shown = useCountUp(owedTotal);
  const cents = Math.round(shown*100), whole = Math.floor(cents/100), dec = String(cents%100).padStart(2,'0');
  const meterPct = thisMonth>0 ? Math.min(100, cashVal/thisMonth*100) : 100;

  return (
    <>
      <div className="route">
        <div className="route-brand"><i><IconBrand/></i>Finanzas</div>
        <div className="route-lead">Debes hoy</div>
        <div className="route-amt num">${whole.toLocaleString('es-MX')}<small>.{dec}</small></div>
        {everything>0 && <div className="route-paid"><i><b style={{width:`${paidPct}%`}}/></i>Pagado {fmt0(paidTotal)} · {paidPct}%</div>}
        {owedTotal>0.005
          ? <RouteChart sched={sched} total={owedTotal}/>
          : <div className="route-cap" style={{marginTop:14}}>Sin deuda pendiente</div>}
      </div>

      <div className="home-body">
        <section className="month">
          <div className="month-cols">
            <div><div className="k">Este mes</div><div className="v">{fmt0(thisMonth)}</div><div className="s">≈ {fmt0(weekly)} por semana</div></div>
            <div>
              <button className="v-btn" onClick={onEditCash}>
                <div className="k">Disponible</div>
                {cashVal>0 ? <div className="v">{fmt0(cashVal)}</div> : <div className="v link">Agregar</div>}
              </button>
            </div>
          </div>
          {cashVal>0 && (<>
            <div className={`meter ${diff<0?'short':''}`}><i style={{width:`${meterPct}%`}}/></div>
            <div className={`meter-cap ${diff<0?'short':''}`}>{diff>=0 ? `Te alcanza · sobran ${fmt0(diff)}` : `Te faltan ${fmt0(-diff)}`}</div>
          </>)}
        </section>

        <section>
          <div className="h2">Próximos pagos</div>
          {upcoming && upcoming.length>0
            ? <div className="tickets">
                {upcoming.map(p=>{
                  const card = p.isCommit ? null : cards.find(c=>c.id===p.id);
                  return (
                    <div key={p.id} className="ticket" style={{'--tk': p.hex || '#ffb703', cursor:card?'pointer':'default'}} onClick={card?()=>onOpenCard(card):undefined}>
                      <div className="tk-date"><b className="num">{p.date.getDate()}</b><span>{MONTHS[p.date.getMonth()]}</span></div>
                      <div className="tk-name">{p.name}</div>
                      <div className="tk-amt">{fmt(p.amount)}</div>
                      <span className={`tk-chip ${p.days<=3?'bad':p.days<=7?'warn':''}`}>{dayLabel(p.days)}</span>
                    </div>
                  );
                })}
              </div>
            : <div className="none-row">Sin pagos próximos</div>}
        </section>

        <section>
          <div className="h2">Tarjetas</div>
          <div className="wallet">
            {cards.map(c=>{
              const ci = COLORS.find(x=>x.id===c.color)||COLORS[2];
              const t = computeCardTotals(c, expenses.filter(e=>e.cardId===c.id), msis.filter(m=>m.cardId===c.id), payments.filter(p=>p.cardId===c.id));
              return (
                <button key={c.id} className="w-row" onClick={()=>onOpenCard(c)}>

        {flow.length>1 && (
          <section>

                      <span className="lg-pct">{Math.round(d.value/catTotal*100)}%</span>

              {selCat && catItems[selCat] && (
                <div className="lg-detail">
                  {catItems[selCat].slice().sort((a,b)=>b.amount-a.amount).map((it,i)=>(<div key={i}><span>{it.desc}</span><span>{fmt(it.amount)}</span></div>))}
                </div>
              )}

        )}
        {footer}
      </div>
    </>
  );
}

// ─── TECLADO NUMÉRICO ────────────────────────────────────────────────────────
function Keypad({ value, onChange }) {
  const val = String(value ?? '');
  const press = k => {
    if (k==='⌫') { onChange(val.slice(0,-1)); return; }
    if (k==='.') { if (val.includes('.')) return; onChange((val||'0')+'.'); return; }
    if (val.includes('.') && val.split('.')[1].length>=2) return;
    if (val.replace('.','').length>=9) return;
    onChange(val==='0' ? k : val+k);
  };
  const ref = useRef(press); ref.current = press;
  useEffect(()=>{
    const h = e => {
      const t = e.target && e.target.tagName;
      if (t==='INPUT'||t==='TEXTAREA'||t==='SELECT'||e.metaKey||e.ctrlKey||e.altKey) return;
      if (/^[0-9]$/.test(e.key)) ref.current(e.key);
      else if (e.key==='.'||e.key===',') ref.current('.');
      else if (e.key==='Backspace') ref.current('⌫');
    };
    window.addEventListener('keydown', h);
    return ()=>window.removeEventListener('keydown', h);
  }, []);
  return (
    <div className="keypad">
      {['1','2','3','4','5','6','7','8','9','.','0','⌫'].map(k=>(
        <button type="button" key={k} className={k==='⌫'?'kp-del':''} onClick={()=>press(k)} aria-label={k==='⌫'?'Borrar':k}>{k}</button>
      ))}
    </div>
  );
}
function BigAmount({ value }) {
  const s = String(value ?? '');
  const [w, d] = s.split('.');
  const shown = (w||'0').replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (
    <div className={`xp-amt ${s?'':'empty'}`}>
      <span className="cur">$</span><b className="num">{shown}{d!==undefined?'.'+d:''}</b>
    </div>
  );
}

// ─── CALENDARIO POR SEMANAS ──────────────────────────────────────────────────
function CommitmentsScreen({ commits, cards, expenses, msis, payments, incomes, onEdit, onEditIncome, onTogglePaid, onToggleReceived, selMonth, setSelMonth }) {
  const [openMap, setOpenMap] = useState({});
  const nowRef = useRef(null);
  useEffect(()=>{ if (nowRef.current) { const sc=nowRef.current.closest('.screen-view'); if (sc) sc.scrollTop = Math.max(0, nowRef.current.offsetTop - 130); } }, [selMonth]);
  const [y, mIdx] = selMonth.split('-').map(Number);
  const dim = new Date(y, mIdx+1, 0).getDate();
  const isCurMonth = selMonth === monthKey(currentYear, currentMonth);
  const todayD = today.getDate();
  const k = (y*12 + mIdx) - (currentYear*12 + currentMonth);
  const activeIn = (sm, mths) => {
    const endDate = new Date(parseInt(sm.split('-')[0]), parseInt(sm.split('-')[1])+(parseInt(mths)||1)-1, 1);
    return sm<=selMonth && selMonth<=monthKey(endDate.getFullYear(), endDate.getMonth());
  };
  const activeCommits = commits.filter(c=> activeIn(monthKey(parseInt(c.year),parseInt(c.month)), c.repeat));
  const activeIncomes = (incomes||[]).filter(c=> activeIn(monthKey(parseInt(c.year),parseInt(c.month)), c.repeat));
  function cardAmountForMonth(cd){
    let amt=0;
    (msis||[]).filter(m=>m.cardId===cd.id).forEach(m=>{
      const total=parseInt(m.total)||0, monthly=parseFloat(m.monthly)||0, paid=m.paid||[];
      for(let i=0;i<total;i++){
        const mi=(parseInt(m.startMonth)+i)%12;
        const yi=(parseInt(m.startYear)||currentYear)+Math.floor((parseInt(m.startMonth)+i)/12);
        const ck=monthKey(yi,mi);
        if(ck===selMonth && !paid.includes(ck)) amt+=monthly;
      }
    });
    (expenses||[]).filter(e=>e.cardId===cd.id && !e.paid).forEach(e=>{
      if(dueMonthsAway(e.date, cd.cutDay, cd.payDay)===k) amt+=parseFloat(e.amount)||0;
    });
    return amt;
  }
  const dues = [];
  activeCommits.forEach(c=>dues.push({ day:Math.min(dim,parseInt(c.day)||1), kind:'commit', label:c.desc,
    sub:(c.cat||'').split(' ').slice(1).join(' ')||'Pago fijo', amount:parseFloat(c.amount)||0, paid:(c.paidMonths||[]).includes(selMonth), ref:c }));
  (cards||[]).forEach(cd=>dues.push({ day:Math.min(dim,parseInt(cd.payDay)||1), kind:'card', color:(COLORS.find(x=>x.id===cd.color)||COLORS[2]).hex,
    label:`Pago ${cd.name||'tarjeta'}`, sub:'Pago de tarjeta', amount:cardAmountForMonth(cd), ref:cd }));
  const ins = [];
  activeIncomes.forEach(c=>ins.push({ day:Math.min(dim,parseInt(c.day)||1), kind:'income', label:c.desc,
    sub:'Ingreso', amount:parseFloat(c.amount)||0, received:(c.receivedMonths||[]).includes(selMonth), ref:c }));

  const dayPay = {}, dayInc = {};
  dues.forEach(d=>{ const v=(d.kind==='commit'&&d.paid)?0:(d.amount||0); dayPay[d.day]=(dayPay[d.day]||0)+v; });
  ins.forEach(d=>{ dayInc[d.day]=(dayInc[d.day]||0)+(d.amount||0); });
  const maxPay = Math.max(1, ...Object.values(dayPay));
  const payTotal = dues.reduce((a,d)=> a + ((d.kind==='commit'&&d.paid)?0:(d.amount||0)), 0);
  const incTotal = ins.reduce((a,d)=> a + (d.amount||0), 0);
  const net = incTotal - payTotal;
  const navMonth = delta => { const d=new Date(y, mIdx+delta, 1); setSelMonth(monthKey(d.getFullYear(), d.getMonth())); };
  const MONTHS_FULL = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const WL = ['L','M','M','J','V','S','D'], WD = ['dom','lun','mar','mié','jue','vie','sáb'];

  // semanas (lunes a domingo)
  const offset = (new Date(y, mIdx, 1).getDay()+6)%7;
  const weeks = []; let d = 1;
  while (d<=dim) {
    const cells = new Array(7).fill(null);
    for (let c=(weeks.length===0?offset:0); c<7 && d<=dim; c++, d++) cells[c]=d;
    const nums = cells.filter(Boolean);
    const first = nums[0], last = nums[nums.length-1];
    const items = [...dues, ...ins].filter(it=>it.day>=first && it.day<=last).sort((a,b)=>a.day-b.day || (a.kind==='income'?1:-1));
    const out = nums.reduce((a,n)=>a+(dayPay[n]||0),0), inn = nums.reduce((a,n)=>a+(dayInc[n]||0),0);
    const past = isCurMonth ? last<todayD : k<0;
    const now = isCurMonth && todayD>=first && todayD<=last;
    weeks.push({ cells, first, last, items, out, inn, past, now });
  }

  return (
    <div className="page cal-wrap">
      <div className="cal-head">
        <div className="cal-month">{MONTHS_FULL[mIdx]} <span>{y}</span></div>
        <div className="cal-nav" style={{display:'flex',gap:8}}>
          <button className="round-btn" onClick={()=>navMonth(-1)} aria-label="Mes anterior"><IconChevronLeft/></button>
          <button className="round-btn" onClick={()=>navMonth(1)} aria-label="Mes siguiente"><IconChevronRight/></button>
        </div>
      </div>
      <div className="sum3">
        <div className="s-pay"><span>Por pagar</span><b>{fmt0(payTotal)}</b></div>
        <div className="s-inc"><span>Ingresos</span><b>{fmt0(incTotal)}</b></div>
        <div className={net>=0?'s-net':'s-neg'}><span>Balance</span><b>{net>=0?'+':'−'}{fmt0(Math.abs(net))}</b></div>
      </div>

      <div className="weeks">
        {weeks.map((w,i)=>{
          const key = selMonth+'-'+i;
          const open = key in openMap ? openMap[key] : !w.past;
          return (
            <div key={i} ref={w.now?nowRef:null} className={`wk ${w.now?'now':''} ${w.past?'past':''}`}>
              <button className="wk-h" onClick={()=>setOpenMap(m=>({...m,[key]:!open}))} aria-expanded={open}>
                <div className="wk-t"><b>{w.now?'Esta semana':`Semana ${i+1}`}</b><span>{w.first}–{w.last} {MONTHS[mIdx].toLowerCase()}</span></div>
                <div className="wk-tot"><b className="num">{w.out>0?fmt0(w.out):'—'}</b>{w.inn>0 && <em>+{fmt0(w.inn)}</em>}</div>
                <span className={`wk-chev ${open?'open':''}`}><IconChevronRight/></span>
              </button>
              {open && <div className="wk-days">
                {w.cells.map((n,c)=>{
                  if (n===null) return <div key={c} className="wk-d blank"/>;
                  const pay=dayPay[n]||0, hasInc=(dayInc[n]||0)>0, h=pay>0?.2+.8*(pay/maxPay):0, isToday=isCurMonth&&n===todayD;
                  return (
                    <div key={c} className={`wk-d ${h>.55?'hot':''} ${isToday?'today':''}`} style={h>0?{'--h':h}:null}>
                      <small>{WL[c]}</small><b>{n}</b>{hasInc && <i/>}
                    </div>
                  );
                })}
              </div>}
              {open && (w.items.length===0
                ? <div className="wk-empty">Sin movimientos</div>
                : <div className="wk-items">
                    {w.items.map((it,idx)=>{
                      const isInc = it.kind==='income';
                      const done = isInc ? it.received : it.paid;
                      const urgent = !isInc && isCurMonth && it.day>=todayD && (it.day-todayD)<=3 && (it.kind==='card'||!it.paid);
                      const editable = it.kind==='commit' || isInc;
                      const bar = isInc?'var(--ok)':urgent?'var(--bad)':(it.color||'var(--brand)');
                      return (
                        <div key={idx} className="wk-i" style={{'--bar':bar}}>
                          <div className="wk-dt"><b className="num">{it.day}</b><span>{WD[new Date(y,mIdx,it.day).getDay()]}</span></div>
                          <div className="it-main" style={{cursor:editable?'pointer':'default'}} onClick={editable?()=>(isInc?onEditIncome(it.ref):onEdit(it.ref)):undefined}>
                            <span className="it-t" style={{opacity:done?.45:1,textDecoration:done?'line-through':'none'}}>{it.label}</span>
                            <span className="it-s" style={urgent?{color:'var(--bad)',fontWeight:650}:null}>{it.sub}{urgent?' · vence pronto':''}</span>
                          </div>
                          <span className="it-amt" style={{opacity:done?.45:1,color:isInc?'var(--ok)':'var(--ink)'}}>{isInc?'+':''}{fmt(it.amount||0)}</span>
                          {isInc ? <CheckBtn checked={it.received} onToggle={()=>onToggleReceived(it.ref.id, selMonth)}/>
                            : it.kind==='commit' ? <CheckBtn checked={it.paid} onToggle={()=>onTogglePaid(it.ref.id, selMonth)}/>
                            : <span style={{width:28}}/>}
                        </div>
                      );
                    })}
                  </div>)}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function App() {
  const [tab, setTab]           = useState('home');
  const [view, setView]         = useStorage('fp_view', (typeof window!=='undefined' && window.innerWidth>=900) ? 'pc' : 'mobile');
  const [detailCard, setDetail] = useState(null); // card obj | null
  const [cards, setCards]       = useStorage('fp_cards', []);
  const [expenses, setExpenses] = useStorage('fp_expenses', []);
  const [msis, setMsis]         = useStorage('fp_msis', []);
  const [payments, setPayments] = useStorage('fp_payments', []);
  const [commits, setCommits]   = useStorage('fp_commits', []);
  const [incomes, setIncomes]   = useStorage('fp_incomes', []);
  const [cash, setCash]         = useStorage('fp_cash', '');
  const [income, setIncome]     = useStorage('fp_income', '');

  const [cardModal,   setCardModal]   = useState(null);
  const [expModal,    setExpModal]    = useState(null);
  const [msiModal,    setMsiModal]    = useState(null);
  const [payModal,    setPayModal]    = useState(null);
  const [commitModal, setCommitModal] = useState(null);
  const [incomeEvtModal, setIncomeEvtModal] = useState(null);
  const [addChooser,  setAddChooser]  = useState(false);
  const [quickAdd,    setQuickAdd]    = useState(false);
  const [cashModal,   setCashModal]   = useState(false);
  const [incomeModal, setIncomeModal] = useState(false);
  const [selMonth,    setSelMonth]    = useState(currentMK);
  const [scrolled,    setScrolled]    = useState(false);
  useEffect(()=>{ setScrolled(false); },[tab]);

  // ── Card CRUD ──
  const saveCard = c => {
    if (c.id) setCards(p=>p.map(x=>x.id===c.id?{...c}:x));
    else setCards(p=>[...p,{...c,id:uid()}]);
  };
  const deleteCard = id => {
    setCards(p=>p.filter(x=>x.id!==id));
    setExpenses(p=>p.filter(x=>x.cardId!==id));
    setMsis(p=>p.filter(x=>x.cardId!==id));
    setPayments(p=>p.filter(x=>x.cardId!==id));
    setCardModal(null);
    setDetail(null);
  };

  // ── Expense CRUD ── (card.available is NEVER touched — everything is derived)
  const saveExpense = (f, cardId) => {
    if (f.id) setExpenses(p=>p.map(x=>x.id===f.id?{...f,cardId}:x));
    else setExpenses(p=>[...p,{...f,id:uid(),cardId,paid:false}]);
  };
  const deleteExpense = id => setExpenses(p=>p.filter(x=>x.id!==id));
  const toggleExpense = id => setExpenses(p=>p.map(x=>x.id===id?{...x,paid:!x.paid}:x));

  // ── MSI CRUD ── (card.available is NEVER touched — everything is derived)
  const saveMsi = (f, cardId) => {
    if (f.id) setMsis(p=>p.map(x=>x.id===f.id?{...f,cardId}:x));
    else setMsis(p=>[...p,{...f,id:uid(),cardId}]);
  };
  const deleteMsi = id => setMsis(p=>p.filter(x=>x.id!==id));
  const toggleMsiPaid = (id, mk) => {
    setMsis(p=>p.map(x=>{
      if(x.id!==id) return x;
      const paid=[...(x.paid||[])];
      const nowPaid = !paid.includes(mk);
      return {...x, paid: nowPaid ? [...paid,mk] : paid.filter(k=>k!==mk)};
    }));
  };

  // ── Payment CRUD ── (abonos a la tarjeta — suben disponible, bajan deuda)
  const savePayment = (f, cardId) => {
    if (f.id) setPayments(p=>p.map(x=>x.id===f.id?{...f,cardId}:x));
    else setPayments(p=>[...p,{...f,id:uid(),cardId}]);
  };
  const deletePayment = id => setPayments(p=>p.filter(x=>x.id!==id));

  // ── Commitments CRUD ──
  const saveCommit = f => {
    if(f.id) setCommits(p=>p.map(x=>x.id===f.id?{...f}:x));
    else setCommits(p=>[...p,{...f,id:uid(),paidMonths:[]}]);
  };
  const deleteCommit = id => { setCommits(p=>p.filter(x=>x.id!==id)); setCommitModal(null); };
  const toggleCommitPaid = (id,mk) => setCommits(p=>p.map(x=>{
    if(x.id!==id) return x;
    const pm=x.paidMonths||[];
    return {...x,paidMonths:pm.includes(mk)?pm.filter(k=>k!==mk):[...pm,mk]};
  }));

  // ── Incomes (ingresos) CRUD ──
  const saveIncome2 = f => {
    if(f.id) setIncomes(p=>p.map(x=>x.id===f.id?{...f}:x));
    else setIncomes(p=>[...p,{...f,id:uid(),receivedMonths:[]}]);
  };
  const deleteIncome2 = id => { setIncomes(p=>p.filter(x=>x.id!==id)); setIncomeEvtModal(null); };
  const toggleIncomeReceived = (id,mk) => setIncomes(p=>p.map(x=>{
    if(x.id!==id) return x;
    const rm=x.receivedMonths||[];
    return {...x,receivedMonths:rm.includes(mk)?rm.filter(k=>k!==mk):[...rm,mk]};
  }));

  // ── FAB — only for list screens ──
  const handleFab = () => {
    if (tab==='cards') setCardModal('new');
    else setAddChooser(true);
  };

  const showDetail = detailCard !== null;

  // ── Totales del inicio (todas las tarjetas) ──
  const homeTotals = useMemo(()=>{
    let grandTotal=0, thisMonth=0;
    cards.forEach(c=>{
      const t = computeCardTotals(
        c,
        expenses.filter(e=>e.cardId===c.id),
        msis.filter(m=>m.cardId===c.id),
        payments.filter(p=>p.cardId===c.id)
      );
      grandTotal += t.totalToPay;
      thisMonth  += t.thisCycle;
    });
    // Pagos fijos activos este mes y no pagados → suman a "Este mes" (no a la deuda total)
    const curMK = monthKey(currentYear, currentMonth);
    commits.forEach(c=>{
      const sm = monthKey(parseInt(c.year), parseInt(c.month));
      const mths = parseInt(c.repeat)||1;
      const end = new Date(parseInt(c.year), parseInt(c.month)+mths-1, 1);
      const endMK = monthKey(end.getFullYear(), end.getMonth());
      if (sm <= curMK && curMK <= endMK && !((c.paidMonths||[]).includes(curMK))) {
        thisMonth += parseFloat(c.amount)||0;
      }
    });
    return { grandTotal, thisMonth, weekly: thisMonth/4 };
  }, [cards, expenses, msis, payments, commits]);

  // ── A pagar por mes — GENERAL (próximos 2 meses, todas las tarjetas) ──
  const monthsToPay = useMemo(()=>{
    const out = [];
    for (let k=1;k<=2;k++){
      const d  = new Date(currentYear, currentMonth+k, 1);
      const mk = monthKey(d.getFullYear(), d.getMonth());
      let amount = 0;
      msis.forEach(m=>{
        const total=parseInt(m.total)||0, monthly=parseFloat(m.monthly)||0, paid=m.paid||[];
        for (let i=0;i<total;i++){
          const mi=(parseInt(m.startMonth)+i)%12;
          const yi=parseInt(m.startYear)+Math.floor((parseInt(m.startMonth)+i)/12);
          const cuotaMk=monthKey(yi,mi);
          if (cuotaMk===mk && !paid.includes(cuotaMk)) amount += monthly;
        }
      });
      expenses.forEach(e=>{
        if (e.paid) return;
        const card = cards.find(c=>c.id===e.cardId);
        const cut = card ? card.cutDay : 1, pay = card ? card.payDay : 15;
        if (dueMonthsAway(e.date, cut, pay) === k) amount += parseFloat(e.amount)||0;
      });
      // Pagos fijos activos ese mes y no pagados (suman al mes, no a la deuda)
      commits.forEach(c=>{
        const sm = monthKey(parseInt(c.year), parseInt(c.month));
        const mths = parseInt(c.repeat)||1;
        const end = new Date(parseInt(c.year), parseInt(c.month)+mths-1, 1);
        const endMK = monthKey(end.getFullYear(), end.getMonth());
        if (sm <= mk && mk <= endMK && !((c.paidMonths||[]).includes(mk))) amount += parseFloat(c.amount)||0;
      });
      out.push({ mk, label: MONTHS[d.getMonth()], year: d.getFullYear(), amount });
    }
    return out;
  }, [cards, expenses, msis, payments, commits]);

  // ── Próximos pagos (tarjetas que vencen dentro de 15 días) ──
  const upcomingPayments = useMemo(()=>{
    const list = [];
    cards.forEach(c=>{
      const t = computeCardTotals(
        c,
        expenses.filter(e=>e.cardId===c.id),
        msis.filter(m=>m.cardId===c.id),
        payments.filter(p=>p.cardId===c.id)
      );
      const days = daysUntil(parseInt(c.payDay)||15);
      if (days <= 15 && t.thisCycle > 0) {
        const dd = parseInt(c.payDay)||15;
        const date = dd >= today.getDate()
          ? new Date(currentYear, currentMonth, dd)
          : new Date(currentYear, currentMonth+1, dd);
        const ci = COLORS.find(x=>x.id===c.color)||COLORS[2];
        list.push({ id:c.id, name:c.name||'Sin nombre', hex:ci.hex, amount:t.thisCycle, days, date });
      }
    });
    // Pagos fijos (apartado Pagos) activos este mes y no pagados
    const curMK = monthKey(currentYear, currentMonth);
    commits.forEach(c=>{
      const sm = monthKey(parseInt(c.year), parseInt(c.month));
      const mths = parseInt(c.repeat)||1;
      const end = new Date(parseInt(c.year), parseInt(c.month)+mths-1, 1);
      const endMK = monthKey(end.getFullYear(), end.getMonth());
      const activeNow = sm <= curMK && curMK <= endMK;
      const paid = (c.paidMonths||[]).includes(curMK);
      if (activeNow && !paid && (parseFloat(c.amount)||0) > 0) {
        const dd = parseInt(c.day)||1;
        const date = dd >= today.getDate()
          ? new Date(currentYear, currentMonth, dd)
          : new Date(currentYear, currentMonth+1, dd);
        list.push({ id:'commit-'+c.id, name:c.desc||'Pago', amount:parseFloat(c.amount)||0,
          emoji:(c.cat||'📦 Otro').split(' ')[0], isCommit:true, date, days:daysUntil(dd) });
      }
    });
    list.sort((a,b)=>a.days-b.days);
    return list;
  }, [cards, expenses, msis, payments, commits]);

  // Alertas: pagos que vencen en ≤3 días
  const dueSoonCount = upcomingPayments.filter(p=>p.days<=3).length;

  // ── Respaldo de datos ──
  const BK_KEYS = ['fp_cards','fp_expenses','fp_msis','fp_payments','fp_commits','fp_incomes','fp_cash','fp_income'];
  const [restoreData, setRestoreData] = useState(null); // datos en espera de confirmación
  const [bkMsg, setBkMsg] = useState('');
  const exportData = () => {
    const data = {};
    BK_KEYS.forEach(k=>{ const v=localStorage.getItem(k); if(v!==null) data[k]=v; });
    const payload = { app:'finanzas', version:1, exportedAt:new Date().toISOString(), data };
    const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `finanzas-respaldo-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
    setBkMsg('✓ Respaldo descargado');
  };
  const importData = (file) => {
    setBkMsg('');
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        const data = parsed && parsed.data ? parsed.data : parsed;
        if (!data || !BK_KEYS.some(k=>k in data)) { setBkMsg('⚠️ Ese archivo no parece un respaldo válido.'); return; }
        setRestoreData(data); // abre confirmación dentro de la app
      } catch(e){ setBkMsg('⚠️ No se pudo leer el archivo: '+e.message); }
    };
    reader.onerror = () => setBkMsg('⚠️ No se pudo abrir el archivo.');
    reader.readAsText(file);
  };
  const applyRestore = () => {
    const data = restoreData; if (!data) return;
    const pv = (v, def) => { try { return typeof v==='string'?JSON.parse(v):v; } catch { return def; } };
    if ('fp_cards'    in data) setCards(pv(data.fp_cards, []));
    if ('fp_expenses' in data) setExpenses(pv(data.fp_expenses, []));
    if ('fp_msis'     in data) setMsis(pv(data.fp_msis, []));
    if ('fp_payments' in data) setPayments(pv(data.fp_payments, []));
    if ('fp_commits'  in data) setCommits(pv(data.fp_commits, []));
    if ('fp_incomes'  in data) setIncomes(pv(data.fp_incomes, []));
    if ('fp_cash'     in data) setCash(pv(data.fp_cash, ''));
    if ('fp_income'   in data) setIncome(pv(data.fp_income, ''));
    setRestoreData(null);
    setBkMsg('✓ Datos restaurados correctamente');
  };

  // ── Tema (auto / claro / oscuro) ──
  const [theme, setTheme] = useStorage('fp_theme', 'auto');
  useEffect(()=>{
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const apply = () => { document.documentElement.dataset.theme = theme==='auto' ? (mq.matches?'dark':'light') : theme; };
    apply(); mq.addEventListener && mq.addEventListener('change', apply);
    return ()=>{ mq.removeEventListener && mq.removeEventListener('change', apply); };
  }, [theme]);
  const goTab = t => { setTab(t); setDetail(null); };

  const settingsBlock = (
    <section className="wide">
      <div className="h2">Ajustes</div>
      <div className="settings">
        <div className="set-t">Apariencia</div>
        <div className="seg three" style={{marginTop:12}}>
          {[['auto','Auto'],['light','Claro'],['dark','Oscuro']].map(([k,l])=>(<button key={k} className={theme===k?'on':''} onClick={()=>setTheme(k)}>{l}</button>))}
        </div>
      </div>
      <div className="settings">
        <div className="set-t">Respaldo de datos</div>
        <div className="set-s">Guarda el archivo en un lugar seguro. Puedes restaurarlo aquí o en otro equipo.</div>
        <div className="btn-row">
          <button className="ghost fill" onClick={exportData}>Exportar</button>
          <button className="ghost" onClick={()=>document.getElementById('bk-import').click()}>Restaurar</button>
        </div>
        <input id="bk-import" type="file" accept="application/json,.json" style={{display:'none'}}
          onChange={e=>{ const f=e.target.files&&e.target.files[0]; if(f) importData(f); e.target.value=''; }}/>
        {bkMsg && <div className={`bk-msg ${bkMsg[0]==='⚠'?'err':'ok'}`}>{bkMsg}</div>}
      </div>
    </section>
  );

  return (
    <div className={`app-root ${view==='pc'?'as-pc':'as-mobile'}`}>
      <button className="view-toggle" onClick={()=>setView(view==='pc'?'mobile':'pc')}>{view==='pc'?'Vista móvil':'Vista PC'}</button>
      <div className="app-stack">
        <div key={tab} className={`screen-view ${showDetail ? 'slide-out' : 'slide-in'}`}>
          {tab==='home' && (cards.length===0
            ? <>
                <div className="route">
                  <div className="route-brand"><i><IconBrand/></i>Finanzas</div>
                  <div className="home-empty">
                    <div className="route-lead">Aún no hay tarjetas</div>
                    <div className="route-amt num">$0<small>.00</small></div>
                    <button className="ghost" onClick={()=>setCardModal('new')}>Agregar tarjeta</button>
                  </div>
                </div>
                <div className="home-body">{settingsBlock}</div>
              </>
            : <HomeSummary {...homeTotals} months={monthsToPay} upcoming={upcomingPayments} cash={cash} expenses={expenses} msis={msis} cards={cards} payments={payments}
                onEditCash={()=>setCashModal(true)} onOpenCard={c=>setDetail(c)} footer={settingsBlock}/>)}

          {tab==='cards' && (
            <div className="cards-wrap">
              <div className="page-head"><div><h1>Tarjetas</h1></div><button className="round-btn" onClick={()=>setCardModal('new')} aria-label="Agregar tarjeta"><IconPlus/></button></div>
              {cards.length===0 && <div className="empty"><div className="icon">💳</div><b>Sin tarjetas</b>Toca + para agregar la primera.</div>}
              <div className="stack">
                {cards.map(card=>(
                  <PlasticCard key={card.id} card={card} expenses={expenses.filter(e=>e.cardId===card.id)} msis={msis.filter(m=>m.cardId===card.id)} payments={payments.filter(p=>p.cardId===card.id)} onClick={()=>setDetail(card)}/>
                ))}
              </div>
            </div>
          )}

          {tab==='commits' && (
            <>
              <div className="page-head cal-wrap"><div><h1>Pagos</h1></div><button className="round-btn" onClick={()=>setAddChooser(true)} aria-label="Agregar"><IconPlus/></button></div>
              <CommitmentsScreen commits={commits} cards={cards} expenses={expenses} msis={msis} payments={payments} incomes={incomes}
                onEdit={c=>setCommitModal(c)} onEditIncome={i=>setIncomeEvtModal(i)} onTogglePaid={toggleCommitPaid} onToggleReceived={toggleIncomeReceived}
                selMonth={selMonth} setSelMonth={setSelMonth}/>
            </>
          )}
        </div>

        {detailCard && (
          <div className="screen-view slide-in detail-enter" style={{zIndex:10, background:'var(--paper)'}}>
            <CardDetail
              card={cards.find(c=>c.id===detailCard.id)||detailCard}
              expenses={expenses.filter(e=>e.cardId===detailCard.id)}
              msis={msis.filter(m=>m.cardId===detailCard.id)}
              payments={payments.filter(p=>p.cardId===detailCard.id)}
              onBack={()=>setDetail(null)}
              onEditCard={c=>setCardModal(c)}
              onToggleExpense={toggleExpense}
              onEditExpense={(exp,cid)=>setExpModal({cardId:cid, cutDay:cards.find(c=>c.id===cid)?.cutDay, payDay:cards.find(c=>c.id===cid)?.payDay, exp})}
              onAddExpense={cid=>setExpModal({cardId:cid, cutDay:cards.find(c=>c.id===cid)?.cutDay, payDay:cards.find(c=>c.id===cid)?.payDay})}
              onToggleMsiPaid={toggleMsiPaid}
              onEditMsi={(item,cid)=>setMsiModal({cardId:cid,item})}
              onAddMsi={cid=>setMsiModal({cardId:cid})}
              onEditPayment={(pay,cid)=>setPayModal({cardId:cid, pay})}
              onAddPayment={cid=>setPayModal({cardId:cid})}
            />
          </div>
        )}
      </div>

      <nav className="dock">
        <div className="dock-pill">
          {[['home','Inicio'],['cards','Tarjetas'],['commits','Pagos']].map(([k,l])=>(
            <button key={k} className={`dock-btn ${tab===k?'on':''}`} onClick={()=>goTab(k)} aria-label={l}>
              <NavIcon kind={k==='commits'?'cal':k} on={tab===k}/><span>{l}</span>
            </button>
          ))}
        </div>
        {!showDetail && <button className="dock-add" onClick={()=>setQuickAdd(true)} aria-label="Agregar"><IconPlus/></button>}
      </nav>

      {/* MODALS */}
      {(cardModal==='new'||(cardModal&&cardModal.id)) && (
        <CardForm
          initial={cardModal==='new'?null:cardModal}
          onSave={saveCard}
          onDelete={deleteCard}
          onClose={()=>setCardModal(null)}
        />
      )}
      {expModal && (
        <ExpenseForm
          initial={expModal.exp||null}
          cutDay={expModal.cutDay||1}
          payDay={expModal.payDay||15}
          cards={cards}
          cardId={expModal.cardId}
          onSave={(f,cid)=>{ const useId = cid||expModal.cardId; if(!f.id){ try{ localStorage.setItem('fp_lastcard', useId); }catch(e){} } saveExpense(f,useId); }}
          onDelete={deleteExpense}
          onClose={()=>setExpModal(null)}
        />
      )}
      {msiModal && (
        <MsiForm
          initial={msiModal.item||null}
          onSave={f=>saveMsi(f,msiModal.cardId)}
          onDelete={deleteMsi}
          onClose={()=>setMsiModal(null)}
        />
      )}
      {payModal && (
        <PaymentForm
          initial={payModal.pay||null}
          onSave={f=>savePayment(f,payModal.cardId)}
          onDelete={deletePayment}
          onClose={()=>setPayModal(null)}
        />
      )}
      {commitModal && (
        <CommitForm
          initial={commitModal==='new'?null:commitModal}
          onSave={saveCommit}
          onDelete={deleteCommit}
          onClose={()=>setCommitModal(null)}
        />
      )}
      {quickAdd && (
        <QuickAdd
          cards={cards}
          lastCard={(()=>{ try{ return localStorage.getItem('fp_lastcard'); }catch(e){ return null; } })()}
          onClose={()=>setQuickAdd(false)}
          onNewCard={()=>{ setQuickAdd(false); setCardModal('new'); }}
          onPick={(k,cid)=>{
            setQuickAdd(false);
            const cd = cards.find(c=>c.id===cid);
            if (k==='gasto') setExpModal({cardId:cid, cutDay:cd?.cutDay, payDay:cd?.payDay});
            else if (k==='msi') setMsiModal({cardId:cid});
            else if (k==='abono') setPayModal({cardId:cid});
            else if (k==='pago') setCommitModal('new');
            else setIncomeEvtModal('new');
          }}
        />
      )}
      {addChooser && (
        <AddChooser
          onClose={()=>setAddChooser(false)}
          onPick={t=>{ setAddChooser(false); if(t==='pago') setCommitModal('new'); else setIncomeEvtModal('new'); }}
        />
      )}
      {incomeEvtModal && (
        <IncomeEvtForm
          initial={incomeEvtModal==='new'?null:incomeEvtModal}
          onSave={saveIncome2}
          onDelete={deleteIncome2}
          onClose={()=>setIncomeEvtModal(null)}
        />
      )}
      {cashModal && (
        <CashForm
          initial={cash}
          onSave={v=>setCash(v)}
          onClose={()=>setCashModal(false)}
        />
      )}
      {incomeModal && (
        <IncomeForm
          initial={income}
          onSave={v=>setIncome(v)}
          onClose={()=>setIncomeModal(false)}
        />
      )}
      {restoreData && (
        <Sheet title="Restaurar respaldo" onClose={()=>setRestoreData(null)}>
          <div className="sheet-body">
            <p style={{fontSize:14.5,color:'var(--text)',lineHeight:1.5,margin:'0 0 4px'}}>
              Esto <strong>reemplazará</strong> tus datos actuales (tarjetas, gastos, MSI y pagos) con los del archivo. Esta acción no se puede deshacer.
            </p>
          </div>
          <div className="sheet-actions">
            <button className="btn-secondary" onClick={()=>setRestoreData(null)}>Cancelar</button>
            <button className="btn-primary" onClick={applyRestore}>Restaurar</button>
          </div>
        </Sheet>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>
  // Registrar el service worker (PWA) — instalación e inicio offline
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
